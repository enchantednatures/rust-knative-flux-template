# k6 Operator Deployment via FluxCD HelmRelease
# 
# The k6-operator enables running k6 load tests as Kubernetes jobs
# via the TestRun custom resource definition.
#
# See: https://github.com/grafana/k6-operator

---
# HelmRepository for Grafana charts
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts

---
# HelmRelease for k6-operator
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k6-operator
  namespace: k6-operator-system
spec:
  interval: 1h
  chart:
    spec:
      chart: k6-operator
      version: "3.*"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Manager configuration
    manager:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      
    # Default runner configuration for TestRun pods
    runner:
      image:
        registry: docker.io
        repository: grafana/k6
        tag: latest
      
    # Enable Prometheus metrics for the operator itself
    prometheus:
      enabled: true
