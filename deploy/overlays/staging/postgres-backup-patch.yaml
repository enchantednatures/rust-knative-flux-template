apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-app-daily-backup
spec:
  # Staging backup schedule - 2 AM UTC daily
  schedule: "0 2 * * *"

---
apiVersion: objectstorage.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup-store
  namespace: default
spec:
  configuration:
    destinationPath: s3://postgres-backups/staging/
    s3:
      # S3 endpoint for staging (can be AWS S3 or MinIO)
      endpointURL: http://minio.minio.svc.cluster.local:9000
      region: us-east-1
      s3Credentials:
        accessKeyId:
          name: object-storage-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: object-storage-secret
          key: SECRET_ACCESS_KEY
  
  # Staging: medium retention (14 days)
  retentionPolicy:
    base: 14     # Keep base backups for 14 days
    wal: 7       # Keep WAL files for 7 days
  
  # Staging: zstd compression level 3
  compressionAlgorithm: zstd
  compressionLevel: 3
  walCompressionAlgorithm: zstd
  walCompressionLevel: 3
