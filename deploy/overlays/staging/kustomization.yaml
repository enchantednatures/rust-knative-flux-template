apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

components:
  {% if feature_flagger %}
  - ../../components/flagger
  {% endif %}
  {% if feature_postgres %}
  - ../../components/postgres
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    # JSON6902 via RFC 6901 double-slash encoding — see deploy/overlays/dev for
    # the issue #136 strategic-merge rationale.
    patch: |-
      - op: replace
        path: /spec/values/services//scaling
        value:
          minScale: {% if use_default_scaling %}1{% else %}{{ staging_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}5{% else %}{{ staging_max_scale }}{% endif %}
      - op: replace
        path: /spec/values/services//resources
        value:
          requests:
            cpu: "{% if use_default_scaling %}200m{% else %}{{ staging_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}128Mi{% else %}{{ staging_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}800m{% else %}{{ staging_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}384Mi{% else %}{{ staging_memory_limit }}{% endif %}"

      {% if event_source_kafka %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}
        value:
          bootstrapServers:
            - "{{ kafka_bootstrap_servers_staging }}"
          consumers: 5
          initialOffset: earliest
      {% endif %}

  {% if feature_postgres %}
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "{{ project_name | replace: '_', '-' }}-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_instances_staging }}
  # Per-env backup retention (ObjectStore base carries the prod default).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "{{ backup_retention_staging }}d"
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_pooler_instances_staging }}
  {% endif %}


  {% if feature_flagger %}
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "{{ flagger_prometheus_url_staging }}"
  {% endif %}

 {% if feature_s3 %}
configMapGenerator:
  - name: s3-config
    behavior: create
    literals:
      - S3_ENDPOINT=https://minio.staging.svc.cluster.local:9000
      - S3_BUCKET=data-staging
      - S3_REGION=us-east-1
 {% endif %}
