apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

components:
  {% if feature_flagger %}
  - ../../components/flagger
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: {{ project_name | replace: "_", "-" }}
      spec:
        values:
          services:
            "":
              scaling:
                minScale: {% if use_default_scaling %}1{% else %}{{ staging_min_scale }}{% endif %}
                maxScale: {% if use_default_scaling %}5{% else %}{{ staging_max_scale }}{% endif %}
              resources:
                requests:
                  cpu: "{% if use_default_scaling %}200m{% else %}{{ staging_cpu_request }}{% endif %}"
                  memory: "{% if use_default_scaling %}128Mi{% else %}{{ staging_memory_request }}{% endif %}"
                limits:
                  cpu: "{% if use_default_scaling %}800m{% else %}{{ staging_cpu_limit }}{% endif %}"
                  memory: "{% if use_default_scaling %}384Mi{% else %}{{ staging_memory_limit }}{% endif %}"
          {% if feature_postgres %}
          postgres:
            instances: 2
            parameters:
              synchronous_commit: "on"
              shared_buffers: "512Mi"
              max_connections: "200"
            resources:
              requests:
                cpu: "750m"
                memory: "1Gi"
              limits:
                cpu: "1500m"
                memory: "2Gi"
            storage:
              size: "100Gi"
            backup:
              objectStore:
                destinationPath: "s3://{{ project_name | replace: '_', '-' }}-postgres-backups/staging/"
                data:
                  compression: zstd
                  jobs: 2
                wal:
                  compression: zstd
                  maxParallel: 4
              retentionPolicy: "{{ backup_retention_staging }}d"
          {% endif %}
          {% if event_source_kafka %}
          kafka:
            sources:
              {{ kafka_topic }}:
                bootstrapServers:
                  - "{{ kafka_bootstrap_servers_staging }}"
                consumers: 5
                initialOffset: earliest
          {% endif %}

  {% if feature_flagger %}
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "{{ flagger_prometheus_url_staging }}"
  {% endif %}

 {% if feature_s3 %}
configMapGenerator:
  - name: s3-config
    behavior: create
    literals:
      - S3_ENDPOINT=https://minio.staging.svc.cluster.local:9000
      - S3_BUCKET=data-staging
      - S3_REGION=us-east-1
 {% endif %}
