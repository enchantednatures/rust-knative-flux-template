apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ target_namespace }}

resources:
  - ../../base
  {% if target_namespace != "default" %}
  - namespace.yaml
  {% endif %}

components:
  {% if feature_flagger %}
  - ../../components/flagger
  {% endif %}
  {% if feature_postgres %}
  - ../../components/postgres
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: {% if use_default_scaling %}1{% else %}{{ staging_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}5{% else %}{{ staging_max_scale }}{% endif %}
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "{% if use_default_scaling %}200m{% else %}{{ staging_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}128Mi{% else %}{{ staging_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}800m{% else %}{{ staging_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}384Mi{% else %}{{ staging_memory_limit }}{% endif %}"

      {% if event_source_kafka %}
      {% if kafka_managed_cluster == false %}
      # External Kafka only: managed mode derives the bootstrap from the
      # chart-managed cluster and rejects an explicit value.
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/bootstrapServers
        value:
          - "{{ kafka_bootstrap_servers_staging }}"
      {% endif %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/consumers
        value: 5
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/initialOffset
        value: earliest
      {% endif %}

  {% if feature_postgres or feature_s3 %}
  # Object buckets provisioned per environment by the chart (ObjectBucketClaim).
  # Names are immutable once a claim first binds; keep them environment-unique.
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      - op: add
        path: /spec/values/objectBuckets
        value:
          {% if feature_postgres %}
          postgres-backups:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            endpointURL: "{{ ceph_rgw_endpoint_staging }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-postgres-backups-staging"
          {% endif %}
          {% if feature_s3 %}
          app-data:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-app-data-staging"
          {% endif %}
  {% endif %}

  {% if feature_postgres %}
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "{{ project_name | replace: '_', '-' }}-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_instances_staging }}
  # Per-env backup retention (ObjectStore base carries the prod default).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "{{ backup_retention_staging }}d"
  # Point backups at THIS environment's Ceph RGW bucket (base carries the
  # dev/Kind RustFS endpoint and the un-suffixed destination path).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/configuration/endpointURL
        value: "{{ ceph_rgw_endpoint_staging }}"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://{{ project_name | replace: '_', '-' }}-postgres-backups-staging/"
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_pooler_instances_staging }}
  {% endif %}


  {% if feature_flagger %}
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "{{ flagger_prometheus_url_staging }}"
  {% endif %}
