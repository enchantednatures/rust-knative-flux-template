---
apiVersion: v1
kind: Namespace
metadata:
  name: rustfs

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          args:
            - /data
          env:
            - name: RUSTFS_ACCESS_KEY
              value: "rustfsadmin"
            - name: RUSTFS_SECRET_KEY
              value: "rustfsadmin"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: rustfs
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: api
    - port: 9001
      targetPort: 9001
      protocol: TCP
      name: console
  selector:
    app: rustfs

---
# Create the backup and data buckets on startup
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  namespace: rustfs
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rc
          image: rustfs/rc:v0.1.36
          command:
            - /bin/sh
            - -c
            - |
              until rc alias set local http://rustfs.rustfs.svc.cluster.local:9000 rustfsadmin rustfsadmin; do
                echo "Waiting for RustFS..."
                sleep 2
              done
              rc bucket create -p local/postgres-backups
              rc bucket create -p local/data
              echo "RustFS setup complete"
