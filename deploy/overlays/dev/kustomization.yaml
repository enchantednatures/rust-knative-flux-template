apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

components:
  {% if feature_postgres %}
  - ../../components/postgres
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    # JSON6902 instead of a strategic-merge patch: kustomize >= 5.4 rejects the
    # empty-string `services.""` key during strategic merges (repository issue
    # #136). RFC 6901 encodes the empty member as an empty path segment
    # (double slash), which kustomize's JSON6902 implementation supports.
    patch: |-
      - op: replace
        path: /spec/values/services//image
        value:
          repository: "kind-registry-dev:5000/{{ project_name | replace: '_', '-' }}"
          tag: "dev"
      - op: replace
        path: /spec/values/services//scaling
        value:
          minScale: {% if use_default_scaling %}0{% else %}{{ dev_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}3{% else %}{{ dev_max_scale }}{% endif %}
      - op: replace
        path: /spec/values/services//resources
        value:
          requests:
            cpu: "{% if use_default_scaling %}100m{% else %}{{ dev_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}64Mi{% else %}{{ dev_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}500m{% else %}{{ dev_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ dev_memory_limit }}{% endif %}"
      # Replaces the base env list; must keep every base entry the app needs,
      # including the gated S3 and PostgreSQL values.
      - op: replace
        path: /spec/values/services//env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://redis.redis.svc.cluster.local:6379"
          {% if feature_s3 %}
          - name: APP__S3__ENDPOINT
            value: "http://minio.minio.svc.cluster.local:9000"
          - name: APP__S3__BUCKET
            value: "data"
          - name: APP__S3__REGION
            value: "us-east-1"
          - name: AWS_ACCESS_KEY_ID
            value: "minioadmin"
          - name: AWS_SECRET_ACCESS_KEY
            value: "minioadmin"
          {% endif %}
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "{{ project_name | replace: '_', '-' }}-dev"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          {% if feature_postgres %}
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-postgres-app"
                key: uri
          {% endif %}
          {% if event_source_kafka %}
          - name: APP__KAFKA__BROKER_URL
            value: "kafka.kafka.svc.cluster.local:9092"
          {% endif %}

      {% if event_source_kafka %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}
        value:
          bootstrapServers:
            - "kafka.kafka.svc.cluster.local:9092"
          consumers: 1
          initialOffset: earliest
      {% endif %}

  {% if feature_postgres %}
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "{{ project_name | replace: '_', '-' }}-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_instances_dev }}
  # Per-env backup retention (ObjectStore base carries the prod default).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "{{ backup_retention_dev }}d"
  {% endif %}
