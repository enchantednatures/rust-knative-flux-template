apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ target_namespace }}

resources:
  - ../../base
  {% if target_namespace != "default" %}
  - namespace.yaml
  {% endif %}
  {% if network_policy_allow_all %}
  - networkpolicy.yaml
  {% endif %}
  {% if custom_domain != "" %}
  - domain-mapping.yaml
  {% endif %}
  # After creating the encrypted image pull secret (see
  # image-pull-secret.sops.yaml.example), uncomment:
  # - image-pull-secret.sops.yaml

components:
  {% if feature_postgres %}
  - ../../components/postgres
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  - ../../components/postgres-pooler
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    # JSON6902 instead of a strategic-merge patch: the env list must be
    # REPLACED wholesale (a strategic merge would name-merge it with the base).
    patch: |-
      - op: replace
        path: /spec/values/services/app/image
        value:
          repository: "kind-registry-dev:5000/{{ project_name | replace: '_', '-' }}"
          tag: "dev"
          {% if image_pull_secret != "" %}
          imagePullSecrets:
            - name: {{ image_pull_secret }}
          {% endif %}
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: {% if use_default_scaling %}0{% else %}{{ dev_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}3{% else %}{{ dev_max_scale }}{% endif %}
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "{% if use_default_scaling %}100m{% else %}{{ dev_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}64Mi{% else %}{{ dev_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}500m{% else %}{{ dev_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ dev_memory_limit }}{% endif %}"
      # Replaces the base env list; must keep every base entry the app needs,
      # including the gated S3 and PostgreSQL values.
      - op: replace
        path: /spec/values/services/app/env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://redis.redis.svc.cluster.local:6379"
          {% if feature_s3 %}
          # Object storage mirrors the base claim contract: credentials come
          # from the provisioner Secret "<project>-app-data", bucket identity
          # from its ConfigMap. BUCKET_HOST/BUCKET_PORT must precede
          # APP__S3__ENDPOINT for Kubernetes $(VAR) expansion.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_SECRET_ACCESS_KEY
          - name: BUCKET_HOST
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_HOST
          - name: BUCKET_PORT
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_PORT
          - name: APP__S3__ENDPOINT
            value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
          - name: APP__S3__BUCKET
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_NAME
          - name: APP__S3__REGION
            value: "us-east-1"
          {% endif %}
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "{{ project_name | replace: '_', '-' }}-dev"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          {% if feature_postgres %}
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-postgres-app"
                key: uri
          {% endif %}
          {% if feature_postgres and postgres_pooler %}
          # Route the sqlx pool through the PgBouncer Pooler service; the
          # wholesale env replace above would otherwise drop the base entry.
          - name: APP__POSTGRES__HOST
            value: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
          {% endif %}
          {% if event_source_kafka %}
          - name: APP__KAFKA__BROKER_URL
            value: "{% if kafka_managed_cluster %}{{ project_name | replace: '_', '-' }}-kafka:9093{% else %}kafka.kafka.svc.cluster.local:9092{% endif %}"
          {% endif %}

      {% if event_source_kafka %}
      {% if kafka_managed_cluster == false %}
      # External Kafka only: managed mode derives the bootstrap from the
      # chart-managed cluster and rejects an explicit value.
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/bootstrapServers
        value:
          - "kafka.kafka.svc.cluster.local:9092"
      {% endif %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/consumers
        value: 1
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/initialOffset
        value: earliest
      {% endif %}

  {% if feature_s3 or feature_postgres %}
  # Chart-created object buckets (ObjectBucketClaims); consumed by the CNPG
  # ObjectStore (postgres-backups) and the app S3 env (app-data).
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      - op: add
        path: /spec/values/objectBuckets
        value:
          {%- if feature_postgres %}
          postgres-backups:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            endpointURL: "{{ ceph_rgw_endpoint_dev }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-postgres-backups"
          {%- endif %}
          {%- if feature_s3 %}
          app-data:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-app-data"
          {%- endif %}
  {% endif %}

  {% if feature_postgres %}
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "{{ project_name | replace: '_', '-' }}-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_instances_dev }}
  # Per-env ObjectStore settings: backup retention (base carries the prod
  # default) and the Ceph RGW endpoint (base carries the RustFS dev value;
  # the Kind-only overlay deploy/dev/app-overlay reverts it to RustFS).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "{{ backup_retention_dev }}d"
      - op: replace
        path: /spec/configuration/endpointURL
        value: "{{ ceph_rgw_endpoint_dev }}"
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_pooler_instances_dev }}
  {% endif %}

