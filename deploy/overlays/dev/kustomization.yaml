apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: {{ target_namespace }}

resources:
  - ../../base
  # Added services register their self-contained per-environment deploy
  # subtree here (written by `make add-service`):
  # - ../../../services/<service>/deploy/overlays/dev
  {% if target_namespace != "default" %}
  - namespace.yaml
  {% endif %}
  {% if network_policy_allow_all %}
  - networkpolicy.yaml
  {% endif %}
  {% if custom_domain != "" and workload_type == "Knative" %}
  - domain-mapping.yaml
  {% endif %}
  # After creating the encrypted image pull secret (see
  # image-pull-secret.sops.yaml.example), uncomment:
  # - image-pull-secret.sops.yaml

components:
  {% if feature_postgres %}
  - ../../components/postgres
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  - ../../components/postgres-pooler
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    # JSON6902 instead of a strategic-merge patch: the env list must be
    # REPLACED wholesale (a strategic merge would name-merge it with the base).
    patch: |-
      - op: replace
        path: /spec/values/services/app/image
        value:
          repository: "kind-registry-dev:5000/{{ project_name | replace: '_', '-' }}"
          tag: "dev"
          {% if image_pull_secret != "" %}
          imagePullSecrets:
            - name: {{ image_pull_secret }}
          {% endif %}
      {% if workload_type == "Deployment" %}
      - op: replace
        path: /spec/values/services/app/workload/replicas
        value: {{ workload_replicas_dev }}
      {% else %}
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: {% if use_default_scaling %}0{% else %}{{ dev_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}3{% else %}{{ dev_max_scale }}{% endif %}
      {% endif %}
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "{% if use_default_scaling %}100m{% else %}{{ dev_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}64Mi{% else %}{{ dev_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}500m{% else %}{{ dev_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ dev_memory_limit }}{% endif %}"
      # Replaces the base env list; must keep every base entry the app needs,
      # including the gated S3 and PostgreSQL values.
      - op: replace
        path: /spec/values/services/app/env
        value:
          - name: APP_ENV
            value: "development"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            value: "redis://redis.redis.svc.cluster.local:6379"
          {% if feature_s3 %}
          # Object storage mirrors the base claim contract: credentials come
          # from the provisioner Secret "<project>-app-data", bucket identity
          # from its ConfigMap. BUCKET_HOST/BUCKET_PORT must precede
          # APP__S3__ENDPOINT for Kubernetes $(VAR) expansion.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_SECRET_ACCESS_KEY
          - name: BUCKET_HOST
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_HOST
          - name: BUCKET_PORT
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_PORT
          - name: APP__S3__ENDPOINT
            value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
          - name: APP__S3__BUCKET
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_NAME
          - name: APP__S3__REGION
            value: "us-east-1"
          {% endif %}
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "{{ project_name | replace: '_', '-' }}-dev"
          - name: APP__TELEMETRY__LOG_LEVEL
            value: "debug"
          - name: RUST_LOG
            value: "debug,hyper=info,tower=info"
          {% if feature_postgres %}
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-postgres-app"
                key: uri
          {% endif %}
          {% if feature_postgres and postgres_pooler %}
          # Route the sqlx pool through the PgBouncer Pooler service; the
          # wholesale env replace above would otherwise drop the base entry.
          - name: APP__POSTGRES__HOST
            value: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
          {% endif %}
          {% if event_source_kafka and workload_type == "Knative" %}
          - name: APP__KAFKA__BROKER_URL
            value: "{% if kafka_managed_cluster %}{% if kafka_managed_provider == 'strimzi' %}{{ project_name | replace: '_', '-' }}-kafka-kafka-bootstrap:{% if kafka_managed_tls %}9093{% else %}9092{% endif %}{% else %}{{ project_name | replace: '_', '-' }}-kafka:9093{% endif %}{% else %}kafka.kafka.svc.cluster.local:9092{% endif %}"
          {% if feature_kafka and kafka_managed_cluster and kafka_managed_tls %}
          - name: APP__KAFKA__SECURITY_PROTOCOL
            value: "SSL"
          - name: APP__KAFKA__SSL_CA_LOCATION
            value: "/etc/secrets/kafka-ca/ca.crt"
          {% if kafka_managed_tls_client_auth %}
          - name: APP__KAFKA__SSL_CERTIFICATE_LOCATION
            value: "/etc/secrets/kafka-client/tls.crt"
          - name: APP__KAFKA__SSL_KEY_LOCATION
            value: "/etc/secrets/kafka-client/tls.key"
          {% endif %}
          {% endif %}
          {% if feature_kafka and kafka_external_tls %}
          - name: APP__KAFKA__SECURITY_PROTOCOL
            value: "{% if kafka_external_sasl %}SASL_SSL{% else %}SSL{% endif %}"
          - name: APP__KAFKA__SSL_CA_LOCATION
            value: "/etc/secrets/kafka-ca/{{ kafka_external_ca_key }}"
          {% if kafka_external_client_cert_secret and kafka_external_client_key_secret %}
          - name: APP__KAFKA__SSL_CERTIFICATE_LOCATION
            value: "/etc/secrets/kafka-client-cert/{{ kafka_external_client_cert_key }}"
          - name: APP__KAFKA__SSL_KEY_LOCATION
            value: "/etc/secrets/kafka-client-key/{{ kafka_external_client_key_key }}"
          {% endif %}
          {% elsif feature_kafka and kafka_external_sasl %}
          - name: APP__KAFKA__SECURITY_PROTOCOL
            value: "SASL_PLAINTEXT"
          {% endif %}
          {% if feature_kafka and kafka_external_sasl %}
          - name: APP__KAFKA__SASL_MECHANISM
            value: "{{ kafka_external_sasl_mechanism }}"
          - name: APP__KAFKA__SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: "{{ kafka_external_sasl_user_secret }}"
                key: "{{ kafka_external_sasl_user_key }}"
          - name: APP__KAFKA__SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{ kafka_external_sasl_password_secret }}"
                key: "{{ kafka_external_sasl_password_key }}"
          {% endif %}
          {% endif %}

      {% if event_source_kafka and workload_type == "Knative" %}
      {% if kafka_managed_cluster == false %}
      # External Kafka only: managed mode derives the bootstrap from the
      # chart-managed cluster and rejects an explicit value.
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/bootstrapServers
        value:
          - "kafka.kafka.svc.cluster.local:9092"
      {% endif %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/consumers
        value: 1
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/initialOffset
        value: earliest
      {% endif %}

  {% if feature_s3 or feature_postgres %}
  # Chart-created object buckets (ObjectBucketClaims); consumed by the CNPG
  # ObjectStore (postgres-backups) and the app S3 env (app-data).
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      - op: add
        path: /spec/values/objectBuckets
        value:
          {%- if feature_postgres %}
          postgres-backups:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            endpointURL: "{{ ceph_rgw_endpoint_dev }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-postgres-backups"
          {%- endif %}
          {%- if feature_s3 %}
          app-data:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-app-data"
            {%- if feature_bucket_notifications %}
            objectStore:
              name: "{{ ceph_object_store_name }}"
              namespace: "{{ ceph_object_store_namespace }}"
            notifications:
              enabled: true
              events:
                put:
                  enabled: {{ bucket_notification_put }}
{% if bucket_notification_put %}
                  partitions: {{ bucket_notification_put_partitions }}
{% if bucket_notification_put_prefix != "" %}
                  prefix: "{{ bucket_notification_put_prefix }}"
{% endif %}
{% if bucket_notification_put_suffix != "" %}
                  suffix: "{{ bucket_notification_put_suffix }}"
{% endif %}
                  sink: "{{ bucket_notification_put_sink }}"
                  topicNameTemplate: "{{ bucket_notification_topic_template }}"
{% endif %}
                delete:
                  enabled: {{ bucket_notification_delete }}
{% if bucket_notification_delete %}
                  partitions: {{ bucket_notification_delete_partitions }}
{% if bucket_notification_delete_prefix != "" %}
                  prefix: "{{ bucket_notification_delete_prefix }}"
{% endif %}
{% if bucket_notification_delete_suffix != "" %}
                  suffix: "{{ bucket_notification_delete_suffix }}"
{% endif %}
                  sink: "{{ bucket_notification_delete_sink }}"
                  topicNameTemplate: "{{ bucket_notification_topic_template }}"
{% endif %}
                post:
                  enabled: {{ bucket_notification_post }}
{% if bucket_notification_post %}
                  partitions: {{ bucket_notification_post_partitions }}
{% if bucket_notification_post_prefix != "" %}
                  prefix: "{{ bucket_notification_post_prefix }}"
{% endif %}
{% if bucket_notification_post_suffix != "" %}
                  suffix: "{{ bucket_notification_post_suffix }}"
{% endif %}
                  sink: "{{ bucket_notification_post_sink }}"
                  topicNameTemplate: "{{ bucket_notification_topic_template }}"
{% endif %}
                copy:
                  enabled: {{ bucket_notification_copy }}
{% if bucket_notification_copy %}
                  partitions: {{ bucket_notification_copy_partitions }}
{% if bucket_notification_copy_prefix != "" %}
                  prefix: "{{ bucket_notification_copy_prefix }}"
{% endif %}
{% if bucket_notification_copy_suffix != "" %}
                  suffix: "{{ bucket_notification_copy_suffix }}"
{% endif %}
                  sink: "{{ bucket_notification_copy_sink }}"
                  topicNameTemplate: "{{ bucket_notification_topic_template }}"
{% endif %}
                multipart:
                  enabled: {{ bucket_notification_multipart }}
{% if bucket_notification_multipart %}
                  partitions: {{ bucket_notification_multipart_partitions }}
{% if bucket_notification_multipart_prefix != "" %}
                  prefix: "{{ bucket_notification_multipart_prefix }}"
{% endif %}
{% if bucket_notification_multipart_suffix != "" %}
                  suffix: "{{ bucket_notification_multipart_suffix }}"
{% endif %}
                  sink: "{{ bucket_notification_multipart_sink }}"
                  topicNameTemplate: "{{ bucket_notification_topic_template }}"
{% endif %}
                delete-marker:
                  enabled: {{ bucket_notification_delete_marker }}
{% if bucket_notification_delete_marker %}
                  partitions: {{ bucket_notification_delete_marker_partitions }}
{% if bucket_notification_delete_marker_prefix != "" %}
                  prefix: "{{ bucket_notification_delete_marker_prefix }}"
{% endif %}
{% if bucket_notification_delete_marker_suffix != "" %}
                  suffix: "{{ bucket_notification_delete_marker_suffix }}"
{% endif %}
                  sink: "{{ bucket_notification_delete_marker_sink }}"
                  topicNameTemplate: "{{ bucket_notification_topic_template }}"
{% endif %}
  {% endif %}
          {%- endif %}
  {% endif %}

  {% if feature_postgres %}
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "{{ project_name | replace: '_', '-' }}-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_instances_dev }}
  # Per-env ObjectStore settings: backup retention (base carries the prod
  # default) and the Ceph RGW endpoint (base carries the RustFS dev value;
  # the Kind-only overlay deploy/dev/app-overlay reverts it to RustFS).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "{{ backup_retention_dev }}d"
      - op: replace
        path: /spec/configuration/endpointURL
        value: "{{ ceph_rgw_endpoint_dev }}"
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_pooler_instances_dev }}
  {% endif %}

