# Grafana Kustomization for Local/Test Overlays
#
# Deploys Grafana with pre-configured datasources and k6 dashboards.
# This is included in local and test overlays only; dev/prod use global Grafana.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - grafana-deployment.yaml
  - grafana-service.yaml
  - grafana-configmaps.yaml

# Labels applied to all resources
commonLabels:
  app.kubernetes.io/name: grafana
  app.kubernetes.io/component: visualization
  app.kubernetes.io/part-of: observability
