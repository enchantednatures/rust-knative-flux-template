apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base

components:
  {% if feature_flagger %}
  - ../../components/flagger
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      - op: replace
        path: /spec/values/services//scaling/minScale
        value: {% if use_default_scaling %}2{% else %}{{ prod_min_scale }}{% endif %}
      - op: replace
        path: /spec/values/services//scaling/maxScale
        value: {% if use_default_scaling %}20{% else %}{{ prod_max_scale }}{% endif %}
      - op: replace
        path: /spec/values/services//resources/requests/cpu
        value: "{% if use_default_scaling %}250m{% else %}{{ prod_cpu_request }}{% endif %}"
      - op: replace
        path: /spec/values/services//resources/requests/memory
        value: "{% if use_default_scaling %}256Mi{% else %}{{ prod_memory_request }}{% endif %}"
      - op: replace
        path: /spec/values/services//resources/limits/cpu
        value: "{% if use_default_scaling %}1000m{% else %}{{ prod_cpu_limit }}{% endif %}"
      - op: replace
        path: /spec/values/services//resources/limits/memory
        value: "{% if use_default_scaling %}512Mi{% else %}{{ prod_memory_limit }}{% endif %}"
      {% if feature_postgres %}
      - op: replace
        path: /spec/values/postgres/instances
        value: 3
      - op: replace
        path: /spec/values/postgres/parameters/synchronous_commit
        value: "remote_apply"
      - op: replace
        path: /spec/values/postgres/parameters/shared_buffers
        value: "2Gi"
      - op: replace
        path: /spec/values/postgres/parameters/max_connections
        value: "300"
      - op: replace
        path: /spec/values/postgres/resources/requests/cpu
        value: "1"
      - op: replace
        path: /spec/values/postgres/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/values/postgres/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/values/postgres/resources/limits/memory
        value: "4Gi"
      - op: replace
        path: /spec/values/postgres/storage/size
        value: "200Gi"
      - op: replace
        path: /spec/values/postgres/backup/objectStore/destinationPath
        value: "s3://{{ project_name | replace: '_', '-' }}-postgres-backups/prod/"
      - op: replace
        path: /spec/values/postgres/backup/objectStore/data/compression
        value: zstd
      - op: replace
        path: /spec/values/postgres/backup/objectStore/data/jobs
        value: 4
      - op: replace
        path: /spec/values/postgres/backup/objectStore/wal/compression
        value: zstd
      - op: replace
        path: /spec/values/postgres/backup/objectStore/wal/maxParallel
        value: 8
      - op: replace
        path: /spec/values/postgres/backup/retentionPolicy
        value: "{{ backup_retention_prod }}d"
      {% endif %}
      {% if event_source_kafka %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/bootstrapServers
        value:
          - "{{ kafka_bootstrap_servers_prod }}"
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/consumers
        value: 10
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/initialOffset
        value: latest
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/delivery/retry
        value: 10
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/delivery/backoffDelay
        value: "PT2S"
      {% endif %}

  {% if feature_flagger %}
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "{{ flagger_prometheus_url_prod }}"
  {% endif %}

 {% if feature_s3 %}
configMapGenerator:
  - name: s3-config
    behavior: create
    literals:
      - S3_ENDPOINT=https://s3.amazonaws.com
      - S3_BUCKET=data-prod
      - S3_REGION=us-east-1
 {% endif %}
