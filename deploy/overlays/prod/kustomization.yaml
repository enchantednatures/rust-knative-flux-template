apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

components:
  {% if feature_flagger %}
  - ../../components/flagger
  {% endif %}
  {% if feature_postgres %}
  - ../../components/postgres
  {% endif %}

patches:
  - target:
      kind: HelmRelease
      name: {{ project_name | replace: "_", "-" }}
    patch: |-
      - op: replace
        path: /spec/values/services/app/scaling
        value:
          minScale: {% if use_default_scaling %}2{% else %}{{ prod_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}20{% else %}{{ prod_max_scale }}{% endif %}
      - op: replace
        path: /spec/values/services/app/resources
        value:
          requests:
            cpu: "{% if use_default_scaling %}250m{% else %}{{ prod_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ prod_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}1000m{% else %}{{ prod_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}512Mi{% else %}{{ prod_memory_limit }}{% endif %}"

      {% if feature_postgres or feature_s3 %}
      # Chart-provisioned ObjectBucketClaims (ksvc 0.7.0 `objectBuckets`). The
      # cluster bucket provisioner creates the bucket plus a claim-named Secret
      # (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) and ConfigMap
      # (BUCKET_HOST/BUCKET_PORT/BUCKET_NAME) in the release namespace.
      - op: add
        path: /spec/values/objectBuckets
        value:
          {% if feature_postgres %}
          postgres-backups:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            endpointURL: "{{ ceph_rgw_endpoint_prod }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-postgres-backups-prod"
          {% endif %}
          {% if feature_s3 %}
          app-data:
            storageClassName: "{{ ceph_bucket_storage_class }}"
            bucketName: "{{ project_name | replace: '_', '-' }}-app-data-prod"
          {% endif %}
      {% endif %}

      {% if event_source_kafka %}
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/bootstrapServers
        value:
          - "{{ kafka_bootstrap_servers_prod }}"
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/consumers
        value: 10
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/initialOffset
        value: latest
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/delivery/retry
        value: 10
      - op: replace
        path: /spec/values/kafka/sources/{{ kafka_topic }}/delivery/backoffDelay
        value: "PT2S"
      {% endif %}

  {% if feature_postgres %}
  # Per-env CloudNativePG sizing (component base carries prod-leaning defaults).
  - target:
      kind: Cluster
      name: "{{ project_name | replace: '_', '-' }}-postgres"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_instances_prod }}
  # Per-env backup retention (ObjectStore base carries the prod default).
  # The base carries the dev/Kind RustFS endpoint; prod routes backups to the
  # Ceph RGW bucket provisioned by the chart (see the objectBuckets patch).
  - target:
      kind: ObjectStore
      name: "{{ project_name | replace: '_', '-' }}-postgres-backup-store"
    patch: |-
      - op: replace
        path: /spec/retentionPolicy
        value: "{{ backup_retention_prod }}d"
      - op: replace
        path: /spec/configuration/endpointURL
        value: "{{ ceph_rgw_endpoint_prod }}"
      - op: replace
        path: /spec/configuration/destinationPath
        value: "s3://{{ project_name | replace: '_', '-' }}-postgres-backups-prod/"
  {% endif %}
  {% if feature_postgres and postgres_pooler %}
  # PgBouncer pooler instance count (see deploy/components/postgres/pooler).
  - target:
      kind: Pooler
      name: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
    patch: |-
      - op: replace
        path: /spec/instances
        value: {{ postgres_pooler_instances_prod }}
  {% endif %}


  {% if feature_flagger %}
  # Canary metric gates must query THIS environment's Prometheus. The flagger
  # component's fallback (dev observability URL) does not exist here.
  # See docs/FLAGGER.md "Prerequisites".
  - target:
      kind: MetricTemplate
    patch: |-
      - op: replace
        path: /spec/provider/address
        value: "{{ flagger_prometheus_url_prod }}"
  {% endif %}
