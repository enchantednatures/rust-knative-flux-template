apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

patchesStrategicMerge:
  - postgres-cluster-patch.yaml.liquid
  - postgres-backup-patch.yaml.liquid

# Note: Create and encrypt object-storage-secret.yaml with SOPS:
# 1. cp ../../base/object-storage-secret.yaml.example object-storage-secret.yaml
# 2. Edit with production object storage credentials (AWS S3 or production MinIO)
# 3. sops -e -i object-storage-secret.yaml
# 4. Add to resources above
#
# Production Checklist:
# - Configure storageClass in postgres-cluster-patch.yaml for fast SSD
# - Set up proper backup retention policies
# - Configure monitoring and alerting
# - Ensure SOPS Age key is securely stored and backed up
