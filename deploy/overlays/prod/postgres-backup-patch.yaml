apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ project_name | replace: "_", "-" }}-postgres-daily-backup
  namespace: {{ target_namespace }}
spec:
  # Production backup schedule - configurable via template variable
  schedule: "{{ backup_schedule }}"

---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ project_name | replace: "_", "-" }}-postgres-backup-store
  namespace: {{ target_namespace }}
spec:
  configuration:
    destinationPath: s3://{{ project_name | replace: "_", "-" }}-postgres-backups/prod/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: postgres-backup-storage
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-storage
        key: ACCESS_SECRET_KEY
  
  # Production: extended retention (configurable via template)
  retentionPolicy: "{{ backup_retention_prod }}d"
  
  # Production: maximum compression (zstd)
  configuration:
    data:
      compression: zstd
      jobs: 4
    wal:
      compression: zstd
      maxParallel: 8
