apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-app-daily-backup
spec:
  # Production backup schedule - 2 AM UTC daily
  schedule: "0 2 * * *"

---
apiVersion: objectstorage.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup-store
  namespace: default
spec:
  configuration:
    destinationPath: s3://postgres-backups/prod/
    s3:
      # AWS S3 for production
      region: us-east-1
      # S3 endpoint is optional for AWS S3 (uses default)
      # endpointURL: https://s3.us-east-1.amazonaws.com
      s3Credentials:
        accessKeyId:
          name: object-storage-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: object-storage-secret
          key: SECRET_ACCESS_KEY
  
  # Production: extended retention (30 days)
  retentionPolicy:
    base: 30     # Keep base backups for 30 days
    wal: 15      # Keep WAL files for 15 days
  
  # Production: maximum compression (zstd level 10) with SSE-S3 encryption
  compressionAlgorithm: zstd
  compressionLevel: 10
  walCompressionAlgorithm: zstd
  walCompressionLevel: 10
  
  # Production: Enable encryption (S3 server-side encryption)
  encryptionType: sse-s3
