{% if event_sources contains "kafka" %}
apiVersion: sources.knative.dev/v1beta1
kind: KafkaSource
metadata:
  name: {{ project_name | replace: "_", "-" }}-kafka-source
  namespace: {{ target_namespace }}
  labels:
    app.kubernetes.io/name: {{ project_name | replace: "_", "-" }}-kafka-source
    app.kubernetes.io/component: event-source
    app.kubernetes.io/managed-by: flux
spec:
  consumerGroup: {{ kafka_consumer_group }}
  consumers: 3
  
  bootstrapServers:
  - kafka.kafka.svc.cluster.local:9092
  
  topics:
  - {{ kafka_topic }}
  
  sink:
    ref:
      apiVersion: serving.knative.dev/v1
      kind: Service
      name: {{ project_name | replace: "_", "-" }}
  
  delivery:
    retry: 5
    backoffPolicy: exponential
    backoffDelay: PT1S
    deadLetterSink:
      ref:
        apiVersion: serving.knative.dev/v1
        kind: Service
        name: {{ project_name | replace: "_", "-" }}-dlq
  
  initialOffset: latest
{% endif %}
