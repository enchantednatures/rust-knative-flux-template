apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ project_name | replace: "_", "-" }}
  namespace: {{ target_namespace }}
spec:
  interval: 10m
  chart:
    spec:
      chart: ./deploy/chart
      sourceRef:
        kind: GitRepository
        name: {{ project_name | replace: "_", "-" }}
        namespace: flux-system
      reconcileStrategy: Revision
  values:
    global:
      fullnameOverride: "{{ project_name | replace: '_', '-' }}"
      labels:
        app.kubernetes.io/part-of: "{{ project_name | replace: '_', '-' }}"

    # Empty key "" produces service name = fullnameOverride (no suffix)
    # via ksvc.serviceName: printf "%s-%s" fullname "" | trimSuffix "-"
    services:
      "":
        image:
          repository: "{{ image_registry }}/{{ github_org }}/{{ project_name | replace: '_', '-' }}"
          tag: "latest"  # {"$imagepolicy": "flux-system:{{ project_name | replace: '_', '-' }}:tag"}
        scaling:
          minScale: {% if use_default_scaling %}1{% else %}{{ base_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}10{% else %}{{ base_max_scale }}{% endif %}
          target: {% if use_default_scaling %}100{% else %}{{ base_target }}{% endif %}
          containerConcurrency: 100
          timeoutSeconds: 300
        resources:
          requests:
            cpu: "{% if use_default_scaling %}100m{% else %}{{ base_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}64Mi{% else %}{{ base_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}500m{% else %}{{ base_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ base_memory_limit }}{% endif %}"
        probes:
          liveness:
            path: /health/live
            port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readiness:
            path: /health/ready
            port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        env:
          - name: APP_ENV
            value: "production"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-secrets"
                key: redis-url
          {% if feature_s3 %}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-secrets"
                key: aws-access-key-id
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-secrets"
                key: aws-secret-access-key
          - name: APP__S3__ENDPOINT
            value: "http://minio:9000"
          - name: APP__S3__BUCKET
            value: "data"
          - name: APP__S3__REGION
            value: "us-east-1"
          {% endif %}
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "{{ project_name | replace: '_', '-' }}"
          {% if feature_postgres %}
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-postgres-app"
                key: uri
          {% endif %}
        {% if feature_postgres %}
        # PostgreSQL server CA certificate. Generated and rotated automatically
        # by the CloudNativePG operator (secret <cluster>-ca, key ca.crt);
        # mounted at the path config/*.toml expects (ssl_root_cert_path).
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/secrets/pg-ca
            readOnly: true
        volumes:
          - name: postgres-ca
            secret:
              secretName: "{{ project_name | replace: '_', '-' }}-postgres-ca"
              items:
                - key: ca.crt
                  path: ca.crt
        {% endif %}

    {% if event_source_kafka %}
    kafka:
      sources:
        {{ kafka_topic }}:
          topic: "{{ kafka_topic }}"
          consumerGroup: "{{ kafka_consumer_group }}"
          bootstrapServers:
            - "kafka.kafka.svc.cluster.local:9092"
          consumers: 3
          initialOffset: latest
          sink: ""
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
          dlq:
            enabled: true
            image:
              repository: "gcr.io/knative-releases/knative.dev/eventing/cmd/event_display"
              tag: "latest"
            scaling:
              minScale: 0
              maxScale: 2
            resources:
              requests:
                cpu: "50m"
                memory: "32Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
    {% endif %}
