apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ project_name | replace: "_", "-" }}
  namespace: {{ target_namespace }}
spec:
  interval: 10m
  chart:
    spec:
      chart: ./deploy/chart
      sourceRef:
        kind: GitRepository
        name: {{ project_name | replace: "_", "-" }}
        namespace: flux-system
      reconcileStrategy: Revision
  {% if event_source_kafka %}
  # Knative >=1.23 rejects valueFrom.fieldRef env vars; the ksvc chart's DLQ
  # service hardcodes POD_NAME/POD_NAMESPACE via fieldRef. Strip the env list
  # post-render — the event_display image does not need them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: "{{ project_name | replace: '_', '-' }}-{{ kafka_topic }}-dlq"
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env
                value: []
  {% endif %}
  values:
    global:
      fullnameOverride: "{{ project_name | replace: '_', '-' }}"
      labels:
        app.kubernetes.io/part-of: "{{ project_name | replace: '_', '-' }}"

    # Named the services key `app` (non-empty) because kafka.sources.*.sink must
    # reference a services key and the ksvc chart rejects an empty sink. An empty
    # nameOverride makes the Knative Service name exactly fullnameOverride.
    services:
      app:
        nameOverride: ""
        image:
          repository: "{{ image_registry }}/{{ github_org }}/{{ project_name | replace: '_', '-' }}"
          tag: "latest"  # {"$imagepolicy": "flux-system:{{ project_name | replace: '_', '-' }}:tag"}
          {% if image_pull_secret != "" %}
          # Private registry credentials (see deploy/overlays/dev for the
          # SOPS-encrypted Secret and `make` targets).
          imagePullSecrets:
            - name: {{ image_pull_secret }}
          {% endif %}
        scaling:
          minScale: {% if use_default_scaling %}1{% else %}{{ base_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}10{% else %}{{ base_max_scale }}{% endif %}
          target: {% if use_default_scaling %}100{% else %}{{ base_target }}{% endif %}
          containerConcurrency: 100
          timeoutSeconds: 300
        resources:
          requests:
            cpu: "{% if use_default_scaling %}100m{% else %}{{ base_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}64Mi{% else %}{{ base_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}500m{% else %}{{ base_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ base_memory_limit }}{% endif %}"
        probes:
          liveness:
            path: /health/live
            port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readiness:
            path: /health/ready
            port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        env:
          - name: APP_ENV
            value: "production"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-secrets"
                key: redis-url
          {% if feature_s3 %}
          # Object storage is backed by the chart-created ObjectBucketClaim
          # "<project>-app-data". The cluster's bucket provisioner publishes:
          #   - Secret   "<project>-app-data" -> AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          #   - ConfigMap "<project>-app-data" -> BUCKET_HOST / BUCKET_PORT / BUCKET_NAME
          # both in the release namespace.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_SECRET_ACCESS_KEY
          # BUCKET_HOST/BUCKET_PORT must be declared BEFORE APP__S3__ENDPOINT:
          # Kubernetes expands $(VAR) references using earlier env entries only.
          - name: BUCKET_HOST
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_HOST
          - name: BUCKET_PORT
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_PORT
          - name: APP__S3__ENDPOINT
            value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
          - name: APP__S3__BUCKET
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_NAME
          - name: APP__S3__REGION
            value: "us-east-1"
          {% endif %}
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "{{ project_name | replace: '_', '-' }}"
          {% if feature_postgres %}
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-postgres-app"
                key: uri
          {% endif %}
          {%- if feature_postgres and postgres_pooler %}
          # Route the sqlx pool through the PgBouncer Pooler service. The
          # CNPG `uri` secret always points at <cluster>-rw, so the override
          # swaps the host while keeping credentials from that same secret.
          # The pooler hostname must be in the Cluster's
          # spec.certificates.serverAltDNSNames for verify-full to pass.
          - name: APP__POSTGRES__HOST
            value: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
          {% endif %}
          {% if feature_kafka and kafka_managed_cluster %}
          # Chart-managed Redpanda cluster: the operator publishes a
          # same-namespace Service named "<project>-kafka" on the Kafka port
          # 9093 (the internal listener, not the external 9092).
          - name: APP__KAFKA__BROKER_URL
            value: "{{ project_name | replace: '_', '-' }}-kafka:9093"
          {% endif %}
        {% if feature_postgres %}
        # PostgreSQL server CA certificate. Generated and rotated automatically
        # by the CloudNativePG operator (secret <cluster>-ca, key ca.crt);
        # mounted at the path config/*.toml expects (ssl_root_cert_path).
        volumeMounts:
          - name: postgres-ca
            mountPath: /etc/secrets/pg-ca
            readOnly: true
        volumes:
          - name: postgres-ca
            secret:
              secretName: "{{ project_name | replace: '_', '-' }}-postgres-ca"
              items:
                - key: ca.crt
                  path: ca.crt
        {% endif %}

    {% if event_source_kafka %}
    kafka:
      {% if kafka_managed_cluster %}
      # Managed mode renders a Redpanda cluster plus a Knative Kafka Broker and
      # Trigger. The chart derives the Kafka bootstrap address from the cluster
      # name/namespace, so neither the sources nor the broker config may set
      # `bootstrapServers`; with the Broker enabled the KafkaSource sinks to the
      # Broker (a Trigger routes to services.app), so `sink` must not be set.
      cluster:
        enabled: true
        provider: redpanda
        name: "{{ project_name | replace: '_', '-' }}-kafka"
        replicas: 1
        storage:
          size: "10Gi"
          storageClassName: "ceph-block"
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "2.5Gi"
        tls:
          enabled: false
        auth:
          type: none
        topics:
          create: true
          partitions: 3
        redpanda:
          # Kyverno clusters commonly reject the operator's privileged tuning
          # init container and pods without regular-container resources. Disable
          # tuning and size every generated container explicitly. See
          # deploy/kyverno/policyexception.yaml for the matching exception.
          extraClusterSpec:
            resources:
              requests:
                cpu: "500m"
                memory: "2Gi"
              limits:
                cpu: "2"
                memory: "2.5Gi"
            config:
              cluster:
                auto_create_topics_enabled: true
            console:
              enabled: false
            monitoring:
              enabled: false
            auth:
              sasl:
                enabled: false
            statefulset:
              initContainers:
                tuning:
                  tune_aio_events: false
                  apply_host_tuners: false
                configurator:
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "64Mi"
                    limits:
                      memory: "128Mi"
              podTemplate:
                spec:
                  containers:
                    - name: sidecar
                      resources:
                        requests:
                          cpu: "10m"
                          memory: "256Mi"
                        limits:
                          memory: "512Mi"
              sideCars:
                resources:
                  requests:
                    cpu: "10m"
                    memory: "256Mi"
                  limits:
                    memory: "512Mi"
            post_install_job:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
            post_upgrade_job:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
      broker:
        enabled: true
        config:
          topicPartitions: 3
        delivery:
          retry: 5
          backoffPolicy: exponential
          backoffDelay: "PT1S"
      triggers:
        {{ kafka_topic }}:
          subscriber: "app"
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
      {% endif %}
      sources:
        {{ kafka_topic }}:
          topic: "{{ kafka_topic }}"
          consumerGroup: "{{ kafka_consumer_group }}"
          {% if kafka_managed_cluster == false %}
          bootstrapServers:
            - "kafka.kafka.svc.cluster.local:9092"
          {% endif %}
          consumers: 3
          initialOffset: latest
          {% if kafka_managed_cluster == false %}
          sink: "app"
          {% endif %}
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
          dlq:
            enabled: true
            image:
              repository: "gcr.io/knative-releases/knative.dev/eventing/cmd/event_display"
              tag: "{% if kafka_managed_cluster %}v1.23.0{% else %}latest{% endif %}"
            scaling:
              minScale: 0
              maxScale: 2
            resources:
              requests:
                cpu: "50m"
                memory: "32Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
    {% endif %}

    {% if feature_cron %}
    # The ksvc chart validates that a PingSource sink references a services key,
    # so the root sink `sink: "app"` is intentional: it targets the services.app
    # Knative Service (there is no sink.uri or nested target path here). The
    # PingSource event type is fixed by Knative at `dev.knative.sources.ping`;
    # it is not configurable and no ceOverrides are set.
    pingsources:
      scheduled:
        schedule: "{{ cron_schedule }}"
        timezone: "{{ cron_timezone }}"
        contentType: application/json
        data: |
          {{ cron_payload }}
        sink: "app"
    {% endif %}
