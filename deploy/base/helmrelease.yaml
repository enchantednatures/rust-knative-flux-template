apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ project_name | replace: "_", "-" }}
  namespace: {{ target_namespace }}
spec:
  interval: 10m
  chart:
    spec:
      # The source-controller builds this local chart and resolves the ksvc
      # OCI dependency from deploy/chart/Chart.yaml/Chart.lock at reconcile.
      chart: ./deploy/chart
      sourceRef:
        kind: GitRepository
        name: {{ project_name | replace: "_", "-" }}
        namespace: flux-system
      reconcileStrategy: Revision
  {% if event_source_kafka and kafka_managed_cluster and workload_type == "Knative" %}
  # A cold cluster must install Redpanda/Strimzi, the Topic, Broker, Trigger,
  # KafkaSource, and the Knative Service (plus CNPG when enabled). Helm's 5m
  # default times out on that first install, so give install/upgrade 10m.
  install:
    timeout: 10m
  upgrade:
    timeout: 10m
  {% endif %}
  {% if event_source_kafka and workload_type == "Knative" %}
  # Knative >=1.23 rejects valueFrom.fieldRef env vars; the ksvc chart's DLQ
  # service hardcodes POD_NAME/POD_NAMESPACE via fieldRef. Strip the env list
  # post-render — the event_display image does not need them.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: "{{ project_name | replace: '_', '-' }}-{{ kafka_topic }}-dlq"
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/env
                value: []
  {% endif %}
  values:
    global:
      fullnameOverride: "{{ project_name | replace: '_', '-' }}"
      labels:
        app.kubernetes.io/part-of: "{{ project_name | replace: '_', '-' }}"

    # DragonflyDB is disabled by default, but the key must exist in the base so
    # environment overlays can enable it with a plain JSON6902 `replace`
    # (`/spec/values/dragonfly/enabled`) instead of having to `add` the parent
    # object first.
    dragonfly:
      enabled: false

    # Named the services key `app` (non-empty) because kafka.sources.*.sink must
    # reference a services key and the ksvc chart rejects an empty sink. An empty
    # nameOverride makes the Knative Service name exactly fullnameOverride.
    services:
      app:
        nameOverride: ""
        image:
          repository: "{{ image_registry }}/{{ github_org }}/{{ project_name | replace: '_', '-' }}"
          tag: "latest"  # {"$imagepolicy": "flux-system:{{ project_name | replace: '_', '-' }}:tag"}
          {% if image_pull_secret != "" %}
          # Private registry credentials (see deploy/overlays/dev for the
          # SOPS-encrypted Secret and `make` targets).
          imagePullSecrets:
            - name: {{ image_pull_secret }}
          {% endif %}
        {% if workload_type == "Deployment" %}
        # Standard Deployment workload for long-lived connections
        # (websockets/SSE). The Knative `scaling` block below is not rendered:
        # deployment replicas and the rolling update strategy replace it.
        workload:
          type: Deployment
          replicas: {{ workload_replicas }}
          strategy:
            maxUnavailable: "{{ workload_max_unavailable }}"
            maxSurge: "{{ workload_max_surge }}"
          terminationGracePeriodSeconds: {{ workload_termination_grace_period_seconds }}
          # Extra sleep before SIGTERM so endpoint removal can propagate. The
          # runtime image has /bin/sh and sleep; set to 0 for distroless images.
          preStopSleepSeconds: {{ workload_prestop_sleep_seconds }}
        service:
          type: {{ workload_service_type }}
          port: {{ workload_service_port }}
          sessionAffinity: {{ workload_session_affinity }}
          {% if workload_session_affinity == "ClientIP" %}
          sessionAffinityConfig:
            clientIP:
              timeoutSeconds: 10800
          {% endif %}
        podDisruptionBudget:
          enabled: {{ workload_pdb_enabled }}
          minAvailable: "{{ workload_pdb_min_available }}"
        {% else %}
        scaling:
          minScale: {% if use_default_scaling %}1{% else %}{{ base_min_scale }}{% endif %}
          maxScale: {% if use_default_scaling %}10{% else %}{{ base_max_scale }}{% endif %}
          target: {% if use_default_scaling %}100{% else %}{{ base_target }}{% endif %}
          containerConcurrency: 100
          timeoutSeconds: 300
        {% endif %}
        resources:
          requests:
            cpu: "{% if use_default_scaling %}100m{% else %}{{ base_cpu_request }}{% endif %}"
            memory: "{% if use_default_scaling %}64Mi{% else %}{{ base_memory_request }}{% endif %}"
          limits:
            cpu: "{% if use_default_scaling %}500m{% else %}{{ base_cpu_limit }}{% endif %}"
            memory: "{% if use_default_scaling %}256Mi{% else %}{{ base_memory_limit }}{% endif %}"
        probes:
          liveness:
            path: /health/live
            port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readiness:
            path: /health/ready
            port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        env:
          - name: APP_ENV
            value: "production"
          - name: APP__SERVER__PORT
            value: "8080"
          - name: APP__REDIS__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-secrets"
                key: redis-url
          {% if feature_s3 %}
          # Object storage is backed by the chart-created ObjectBucketClaim
          # "<project>-app-data". The cluster's bucket provisioner publishes:
          #   - Secret   "<project>-app-data" -> AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          #   - ConfigMap "<project>-app-data" -> BUCKET_HOST / BUCKET_PORT / BUCKET_NAME
          # both in the release namespace.
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: AWS_SECRET_ACCESS_KEY
          # BUCKET_HOST/BUCKET_PORT must be declared BEFORE APP__S3__ENDPOINT:
          # Kubernetes expands $(VAR) references using earlier env entries only.
          - name: BUCKET_HOST
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_HOST
          - name: BUCKET_PORT
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_PORT
          - name: APP__S3__ENDPOINT
            value: "http://$(BUCKET_HOST):$(BUCKET_PORT)"
          - name: APP__S3__BUCKET
            valueFrom:
              configMapKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-app-data"
                key: BUCKET_NAME
          - name: APP__S3__REGION
            value: "us-east-1"
          {% endif %}
          - name: APP__TELEMETRY__OTLP_ENDPOINT
            value: "http://otel-collector.observability.svc.cluster.local:4317"
          - name: APP__TELEMETRY__SERVICE_NAME
            value: "{{ project_name | replace: '_', '-' }}"
          {% if feature_postgres %}
          # App DSN (postgresql://...) from the operator-generated
          # <cluster>-app secret; consumed as APP__POSTGRES__URL.
          - name: APP__POSTGRES__URL
            valueFrom:
              secretKeyRef:
                name: "{{ project_name | replace: '_', '-' }}-postgres-app"
                key: uri
          {% endif %}
          {%- if feature_postgres and postgres_pooler %}
          # Route the sqlx pool through the PgBouncer Pooler service. The
          # CNPG `uri` secret always points at <cluster>-rw, so the override
          # swaps the host while keeping credentials from that same secret.
          # The pooler hostname must be in the Cluster's
          # spec.certificates.serverAltDNSNames for verify-full to pass.
          - name: APP__POSTGRES__HOST
            value: "{{ project_name | replace: '_', '-' }}-postgres-rw-pooler"
          {% endif %}
          {% if feature_kafka %}
          {% if event_source_kafka and kafka_managed_cluster %}
          # Chart-managed Kafka: Redpanda exposes a same-namespace Service
          # named "<project>-kafka" on 9093; Strimzi exposes the bootstrap
          # Service "<project>-kafka-kafka-bootstrap" on 9092 (plaintext) or
          # 9093 (TLS).
          - name: APP__KAFKA__BROKER_URL
            value: "{% if kafka_managed_provider == 'strimzi' %}{{ project_name | replace: '_', '-' }}-kafka-kafka-bootstrap:{% if kafka_managed_tls %}9093{% else %}9092{% endif %}{% else %}{{ project_name | replace: '_', '-' }}-kafka:9093{% endif %}"
          {% if kafka_managed_tls %}
          - name: APP__KAFKA__SECURITY_PROTOCOL
            value: "SSL"
          - name: APP__KAFKA__SSL_CA_LOCATION
            value: "/etc/secrets/kafka-ca/ca.crt"
          {% if kafka_managed_tls_client_auth %}
          - name: APP__KAFKA__SSL_CERTIFICATE_LOCATION
            value: "/etc/secrets/kafka-client/tls.crt"
          - name: APP__KAFKA__SSL_KEY_LOCATION
            value: "/etc/secrets/kafka-client/tls.key"
          {% endif %}
          {% endif %}
          {% else %}
          {% if kafka_external_tls %}
          - name: APP__KAFKA__SECURITY_PROTOCOL
            value: "{% if kafka_external_sasl %}SASL_SSL{% else %}SSL{% endif %}"
          - name: APP__KAFKA__SSL_CA_LOCATION
            value: "/etc/secrets/kafka-ca/{{ kafka_external_ca_key }}"
          {% if kafka_external_client_cert_secret and kafka_external_client_key_secret %}
          - name: APP__KAFKA__SSL_CERTIFICATE_LOCATION
            value: "/etc/secrets/kafka-client-cert/{{ kafka_external_client_cert_key }}"
          - name: APP__KAFKA__SSL_KEY_LOCATION
            value: "/etc/secrets/kafka-client-key/{{ kafka_external_client_key_key }}"
          {% endif %}
          {% elsif kafka_external_sasl %}
          - name: APP__KAFKA__SECURITY_PROTOCOL
            value: "SASL_PLAINTEXT"
          {% endif %}
          {% if kafka_external_sasl %}
          - name: APP__KAFKA__SASL_MECHANISM
            value: "{{ kafka_external_sasl_mechanism }}"
          - name: APP__KAFKA__SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: "{{ kafka_external_sasl_user_secret }}"
                key: "{{ kafka_external_sasl_user_key }}"
          - name: APP__KAFKA__SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{ kafka_external_sasl_password_secret }}"
                key: "{{ kafka_external_sasl_password_key }}"
          {% endif %}
          {% endif %}
          {% endif %}
        {% assign kafka_tls_mounts = false %}
        {% if feature_kafka %}
          {% if event_source_kafka and kafka_managed_cluster and kafka_managed_tls %}{% assign kafka_tls_mounts = true %}{% endif %}
          {% if kafka_external_tls %}{% assign kafka_tls_mounts = true %}{% endif %}
        {% endif %}
        {% if feature_postgres or kafka_tls_mounts %}
        volumeMounts:
          {% if feature_postgres %}
          # PostgreSQL server CA certificate. Generated and rotated automatically
          # by the CloudNativePG operator (secret <cluster>-ca, key ca.crt);
          # mounted at the path config/*.toml expects (ssl_root_cert_path).
          - name: postgres-ca
            mountPath: /etc/secrets/pg-ca
            readOnly: true
          {% endif %}
          {% if feature_kafka and event_source_kafka and kafka_managed_cluster and kafka_managed_tls %}
          # Chart-managed Kafka CA (cert-manager chain) used by the publisher.
          - name: kafka-ca
            mountPath: /etc/secrets/kafka-ca
            readOnly: true
          {% if kafka_managed_tls_client_auth %}
          - name: kafka-client
            mountPath: /etc/secrets/kafka-client
            readOnly: true
          {% endif %}
          {% endif %}
          {% if feature_kafka and kafka_external_tls %}
          - name: kafka-ca
            mountPath: /etc/secrets/kafka-ca
            readOnly: true
          {% if kafka_external_client_cert_secret and kafka_external_client_key_secret %}
          - name: kafka-client-cert
            mountPath: /etc/secrets/kafka-client-cert
            readOnly: true
          - name: kafka-client-key
            mountPath: /etc/secrets/kafka-client-key
            readOnly: true
          {% endif %}
          {% endif %}
        volumes:
          {% if feature_postgres %}
          - name: postgres-ca
            secret:
              secretName: "{{ project_name | replace: '_', '-' }}-postgres-ca"
              items:
                - key: ca.crt
                  path: ca.crt
          {% endif %}
          {% if feature_kafka and event_source_kafka and kafka_managed_cluster and kafka_managed_tls %}
          - name: kafka-ca
            secret:
              secretName: "{{ project_name | replace: '_', '-' }}-kafka-ca"
              items:
                - key: ca.crt
                  path: ca.crt
          {% if kafka_managed_tls_client_auth %}
          - name: kafka-client
            secret:
              secretName: "{{ project_name | replace: '_', '-' }}-kafka-client-tls"
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
          {% endif %}
          {% endif %}
          {% if feature_kafka and kafka_external_tls %}
          - name: kafka-ca
            secret:
              secretName: "{{ kafka_external_ca_secret }}"
              items:
                - key: "{{ kafka_external_ca_key }}"
                  path: "{{ kafka_external_ca_key }}"
          {% if kafka_external_client_cert_secret and kafka_external_client_key_secret %}
          - name: kafka-client-cert
            secret:
              secretName: "{{ kafka_external_client_cert_secret }}"
              items:
                - key: "{{ kafka_external_client_cert_key }}"
                  path: "{{ kafka_external_client_cert_key }}"
          - name: kafka-client-key
            secret:
              secretName: "{{ kafka_external_client_key_secret }}"
              items:
                - key: "{{ kafka_external_client_key_key }}"
                  path: "{{ kafka_external_client_key_key }}"
          {% endif %}
          {% endif %}
        {% endif %}

    {% if workload_type == "Deployment" and ingress_enabled %}
    # Standard Ingress values rendered by deploy/chart/templates/ingress.yaml.
    # `annotations` is a pass-through map: add controller-specific keys here
    # (for example nginx proxy read/send timeouts for SSE/WebSockets).
    ingress:
      enabled: true
      className: "{{ ingress_class_name }}"
      annotations:
        # Long-lived SSE/WebSocket support (nginx ingress controller example):
        # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        # nginx.ingress.kubernetes.io/proxy-buffering: "off"
      servicePort: {{ workload_service_port }}
      hosts:
        - host: "{{ ingress_host }}"
          paths:
            - path: "{{ ingress_path }}"
              pathType: {{ ingress_path_type }}
      tls:
        {% if ingress_tls_enabled %}
        -
          {% if ingress_host != "" %}
          hosts:
            - "{{ ingress_host }}"
          {% endif %}
          {% if ingress_tls_secret_name != "" %}
          secretName: "{{ ingress_tls_secret_name }}"
          {% endif %}
        {% else %}
        []
        {% endif %}
    {% endif %}

    {% if event_source_kafka and workload_type == "Knative" %}
    kafka:
      {% if kafka_managed_cluster %}
      # Managed mode renders a Strimzi or Redpanda cluster plus a Knative Kafka
      # Broker and Trigger. The chart derives the Kafka bootstrap address from
      # the cluster name/namespace, so neither the sources nor the broker config
      # may set `bootstrapServers`; with the Broker enabled the KafkaSource sinks
      # to the Broker (a Trigger routes to services.app), so `sink` must not be
      # set.
      cluster:
        enabled: true
        provider: "{{ kafka_managed_provider }}"
        name: "{{ project_name | replace: '_', '-' }}-kafka"
        replicas: 1
        storage:
          size: "10Gi"
          # Empty falls back to the cluster's default StorageClass.
          storageClassName: "{{ kafka_storage_class }}"
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "2.5Gi"
        tls:
          enabled: {{ kafka_managed_tls }}
          {% if kafka_managed_tls %}
          certManager:
            enabled: true
            issuerRef:
              name: "{{ kafka_managed_tls_issuer }}"
              kind: "{{ kafka_managed_tls_issuer_kind }}"
            clientAuth: {{ kafka_managed_tls_client_auth }}
          {% endif %}
        auth:
          type: none
        topics:
          create: true
          partitions: 3
        {% if kafka_managed_provider == "redpanda" %}
        redpanda:
          # Kyverno clusters commonly reject the operator's privileged tuning
          # init container and pods without regular-container resources. Disable
          # tuning and size every generated container explicitly. See
          # deploy/kyverno/policyexception.yaml for the matching exception.
          extraClusterSpec:
            resources:
              requests:
                cpu: "500m"
                memory: "2Gi"
              limits:
                cpu: "2"
                memory: "2.5Gi"
            config:
              cluster:
                auto_create_topics_enabled: true
            console:
              enabled: false
            monitoring:
              enabled: false
            auth:
              sasl:
                enabled: false
            statefulset:
              initContainers:
                tuning:
                  tune_aio_events: false
                  apply_host_tuners: false
                configurator:
                  resources:
                    requests:
                      cpu: "10m"
                      memory: "64Mi"
                    limits:
                      memory: "128Mi"
              podTemplate:
                spec:
                  containers:
                    - name: sidecar
                      resources:
                        requests:
                          cpu: "10m"
                          memory: "256Mi"
                        limits:
                          memory: "512Mi"
              sideCars:
                resources:
                  requests:
                    cpu: "10m"
                    memory: "256Mi"
                  limits:
                    memory: "512Mi"
            post_install_job:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
            post_upgrade_job:
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  memory: "128Mi"
        {% endif %}
      broker:
        enabled: {% if kafka_managed_tls %}false{% else %}true{% endif %}
        config:
          topicPartitions: 3
        delivery:
          retry: 5
          backoffPolicy: exponential
          backoffDelay: "PT1S"
      {% if kafka_managed_tls == false %}
      triggers:
        {{ kafka_topic }}:
          subscriber: "app"
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
      {% endif %}
      {% endif %}
      sources:
        {{ kafka_topic }}:
          topic: "{{ kafka_topic }}"
          consumerGroup: "{{ kafka_consumer_group }}"
          {% if kafka_managed_cluster == false %}
          bootstrapServers:
            - "kafka.kafka.svc.cluster.local:9092"
          {% endif %}
          consumers: 3
          initialOffset: latest
          {% if kafka_managed_cluster == false or kafka_managed_tls %}
          sink: "app"
          {% endif %}
          {% if kafka_managed_tls %}
          net:
            tls:
              enabled: true
          {% elsif kafka_managed_cluster == false and kafka_external_tls %}
          net:
            tls:
              enabled: true
              caCertSecret: "{{ kafka_external_ca_secret }}"
              caCertKey: "{{ kafka_external_ca_key }}"
              {% if kafka_external_client_cert_secret and kafka_external_client_key_secret %}
              certSecret: "{{ kafka_external_client_cert_secret }}"
              certKey: "{{ kafka_external_client_cert_key }}"
              keySecret: "{{ kafka_external_client_key_secret }}"
              keyKey: "{{ kafka_external_client_key_key }}"
              {% endif %}
            {% if kafka_external_sasl %}
            sasl:
              enabled: true
              mechanism: "{{ kafka_external_sasl_mechanism }}"
              userSecret: "{{ kafka_external_sasl_user_secret }}"
              userKey: "{{ kafka_external_sasl_user_key }}"
              passwordSecret: "{{ kafka_external_sasl_password_secret }}"
              passwordKey: "{{ kafka_external_sasl_password_key }}"
            {% endif %}
          {% elsif kafka_managed_cluster == false and kafka_external_sasl %}
          net:
            sasl:
              enabled: true
              mechanism: "{{ kafka_external_sasl_mechanism }}"
              userSecret: "{{ kafka_external_sasl_user_secret }}"
              userKey: "{{ kafka_external_sasl_user_key }}"
              passwordSecret: "{{ kafka_external_sasl_password_secret }}"
              passwordKey: "{{ kafka_external_sasl_password_key }}"
          {% endif %}
          delivery:
            retry: 5
            backoffPolicy: exponential
            backoffDelay: "PT1S"
          dlq:
            enabled: true
            image:
              repository: "gcr.io/knative-releases/knative.dev/eventing/cmd/event_display"
              tag: "{% if kafka_managed_cluster %}v1.23.0{% else %}latest{% endif %}"
            scaling:
              minScale: 0
              maxScale: 2
            resources:
              requests:
                cpu: "50m"
                memory: "32Mi"
              limits:
                cpu: "200m"
                memory: "128Mi"
    {% endif %}

    {% if feature_cron and workload_type == "Knative" %}
    # The ksvc chart validates that a PingSource sink references a services key,
    # so the root sink `sink: "app"` is intentional: it targets the services.app
    # Knative Service (there is no sink.uri or nested target path here). The
    # PingSource event type is fixed by Knative at `dev.knative.sources.ping`;
    # it is not configurable and no ceOverrides are set.
    pingsources:
      scheduled:
        schedule: "{{ cron_schedule }}"
        timezone: "{{ cron_timezone }}"
        contentType: application/json
        data: |
          {{ cron_payload }}
        sink: "app"
    {% endif %}
