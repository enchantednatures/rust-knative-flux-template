apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ project_name | replace: "_", "-" }}
  namespace: {{ target_namespace }}
  labels:
    app.kubernetes.io/name: {{ project_name | replace: "_", "-" }}
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: flux
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  template:
    metadata:
      annotations:
        # Autoscaling configuration
        autoscaling.knative.dev/min-scale: "{% if use_default_scaling %}1{% else %}{{ base_min_scale }}{% endif %}"
        autoscaling.knative.dev/max-scale: "{% if use_default_scaling %}10{% else %}{{ base_max_scale }}{% endif %}"
        autoscaling.knative.dev/target: "{% if use_default_scaling %}100{% else %}{{ base_target }}{% endif %}"
        # Prometheus (pod-level scraping)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - name: service
          # Image will be updated by Flux ImageUpdateAutomation
          image: {{ image_registry }}/{{ github_org }}/{{ project_name | replace: "_", "-" }}:latest # {"$imagepolicy": "flux-system:{{ project_name | replace: "_", "-" }}"}
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: APP__SERVER__PORT
              value: "8080"
            - name: APP__REDIS__URL
              valueFrom:
                secretKeyRef:
                  name: {{ project_name | replace: "_", "-" }}-secrets
                  key: redis-url
            {% if features contains "s3" %}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ project_name | replace: "_", "-" }}-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ project_name | replace: "_", "-" }}-secrets
                  key: aws-secret-access-key
            - name: APP__S3__ENDPOINT
              value: "http://minio:9000"  # Update for your environment
            - name: APP__S3__BUCKET
              value: "data"
            - name: APP__S3__REGION
              value: "us-east-1"
            {% endif %}
            - name: APP__TELEMETRY__OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: APP__TELEMETRY__SERVICE_NAME
              value: "{{ project_name | replace: "_", "-" }}"
          resources:
            requests:
              cpu: "{% if use_default_scaling %}100m{% else %}{{ base_cpu_request }}{% endif %}"
              memory: "{% if use_default_scaling %}64Mi{% else %}{{ base_memory_request }}{% endif %}"
            limits:
              cpu: "{% if use_default_scaling %}500m{% else %}{{ base_cpu_limit }}{% endif %}"
              memory: "{% if use_default_scaling %}256Mi{% else %}{{ base_memory_limit }}{% endif %}"
          # Liveness: Is the process alive?
          # Kubernetes restarts the pod if this fails
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: Can it handle traffic? (checks Redis)
          # Kubernetes removes from Service endpoints if this fails
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
