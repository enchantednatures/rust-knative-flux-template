apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-backup.yaml
  # - postgres-pooler.yaml  # Temporarily disabled due to CRD size issues in K8s 1.35+

# Note: object-storage-secret.yaml is created from object-storage-secret.yaml.example
# and encrypted with SOPS, so it's managed separately per environment
