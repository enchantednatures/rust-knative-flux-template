apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - knative-service.yaml
  {% if event_sources contains "kafka" %}
  - kafka-source.yaml
  - dlq-handler.yaml
  {% endif %}
  {% if features contains "postgres" %}
  - postgres-objectstore.yaml
  - postgres-cluster.yaml
  - postgres-backup.yaml
  - postgres-podmonitor.yaml
  - postgres-alerts.yaml
  {% endif %}
  # NOTE: secret.yaml is NOT included here
  # Users must create it from secret.yaml.example
  # This prevents accidental commits of secrets to git

commonAnnotations:
  kustomize.config.k8s.io/version: "5.0"
