apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ project_name | replace: "_", "-" }}-prod
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: {{ project_name | replace: "_", "-" }}
  wait: true
  timeout: 5m
  {% if feature_flagger %}
  dependsOn:
    - name: flagger
  {% endif %}
