apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ project_name | replace: "_", "-" }}-postgres
  namespace: flux-system
spec:
  interval: 5m
  path: ./deploy/components/postgres
  prune: true
  sourceRef:
    kind: GitRepository
    name: {{ project_name | replace: "_", "-" }}
  wait: true
  timeout: 10m
  # Wait for CloudNativePG operator to be ready
  dependsOn:
    - name: cnpg-operator
  # SOPS decryption for secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: {{ project_name | replace: "_", "-" }}-postgres
      namespace: {{ target_namespace }}
  postBuild:
    substitute:
      POSTGRES_APP_NAME: "{{ project_name | replace: "_", "-" }}-postgres"
