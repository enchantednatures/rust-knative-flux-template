apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: {{ project_name | replace: "_", "-" }}
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: {{ project_name | replace: "_", "-" }}
  wait: true
  timeout: 5m
  {% if feature_flagger %}
  # Ensure Flagger CRDs exist before the Canary object in the prod overlay is applied.
  # Without this, Flux will fail with "no matches for kind Canary in group flagger.app".
  dependsOn:
    - name: flagger
  {% endif %}
