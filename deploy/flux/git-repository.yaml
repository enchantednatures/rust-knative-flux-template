apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: rust-service
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/{{ github_org }}/{{ github_repo }}
  ref:
    branch: {{ default_branch }}
