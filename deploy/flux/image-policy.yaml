# =============================================================================
# ImagePolicy for sha-based continuous deployment
# =============================================================================
# This policy selects the latest sha-based image tag (e.g., sha-a1b2c3d)
# allowing continuous deployment on every successful build
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: {{ project_name | replace: "_", "-" }}
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: {{ project_name | replace: "_", "-" }}
  filterTags:
    pattern: '^sha-[a-f0-9]{7}$'
  policy:
    alphabetical:
      order: asc

---
# =============================================================================
# ImagePolicy for release tag (stable deployments)
# =============================================================================
# This policy selects images tagged with 'release' for stable production deployments.
# The release workflow automatically tags releases with 'release' in addition to semver.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: {{ project_name | replace: "_", "-" }}-release
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: {{ project_name | replace: "_", "-" }}
  filterTags:
    pattern: '^release$'
  policy:
    alphabetical:
      order: asc

---
# =============================================================================
# Alternative: ImagePolicy for SemVer releases
# =============================================================================
# Uncomment this if you prefer semantic versioning releases (e.g., v1.0.0)
