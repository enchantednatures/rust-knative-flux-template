---
# Flagger operator: watches Canary CRDs and orchestrates progressive delivery
# via Knative's native revision traffic splitting — no service mesh required.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flagger-system
spec:
  interval: 1h
  chart:
    spec:
      chart: flagger
      version: ">=1.38.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flagger-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Use Knative provider — Flagger manages spec.traffic on KnativeService.
    # No Istio, Linkerd, or other service mesh is required.
    meshProvider: knative

    # Prometheus used by the Flagger operator's built-in metric checks. All
    # canary gates in this template instead query per-environment addresses
    # via their MetricTemplates (patched per overlay — see
    # deploy/overlays/{staging,prod}/kustomization.yaml and docs/FLAGGER.md).
    # This operator install is cluster-wide: override in cluster management
    # tooling if this cluster's Prometheus lives elsewhere.
    metricsServer: "{{ flagger_operator_metrics_server }}"

    # Cluster-wide watch — Flagger will manage Canary objects in all namespaces
    clusterName: ""

    # Log level: info | debug
    logLevel: info

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

---
# Flagger load tester: provides synthetic traffic during canary analysis via
# the webhook mechanism. Without this, low-traffic staging services may have
# no metric data during analysis windows, causing false failures.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-loadtester
  namespace: flagger-system
spec:
  interval: 1h
  chart:
    spec:
      chart: loadtester
      version: ">=0.34.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flagger-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
