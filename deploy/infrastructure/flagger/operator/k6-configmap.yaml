apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-{{ project_name | replace: "_", "-" }}
  # Installed in flagger-system so the loadtester pod can mount it directly.
  # The Canary object (in the app namespace) references it via the webhook cmd.
  namespace: flagger-system
data:
  # The script is mounted at /scripts/canary-test.js inside the loadtester pod.
  # canary.yaml passes this path to `k6 run`.
  canary-test.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Rate } from 'k6/metrics';

    // Custom metric: tracks the ratio of failed requests.
    // Flagger will evaluate the Prometheus success-rate gate separately;
    // this gives you per-run visibility in the k6 output / CI logs.
    const errorRate = new Rate('errors');

    export const options = {
      // Virtual users and duration are controlled here.
      // k6_vus is baked in at generation time; adjust here if needed.
      vus: {{ k6_vus }},
      duration: '1m',

      thresholds: {
        // Rollout webhook fails (non-zero exit) if p95 latency > 500ms.
        // Flagger treats a failed webhook as a metric gate failure.
        'http_req_duration': ['p(95)<500'],

        // Fail if more than 1% of requests error.
        'errors': ['rate<0.01'],
      },
    };

    // Smoke test export — used by the pre-rollout webhook to validate the
    // service is reachable before any traffic is shifted. For the Knative
    // provider the target URL routes to the primary until Flagger starts
    // shifting weights, so this is an availability check, not a canary check.
    export function smokeTest() {
      const res = http.get(
        // FQDN of the Knative Service under canary control. Cross-namespace
        // traffic from flagger-system requires a full cluster-local FQDN.
        'http://{{ project_name | replace: "_", "-" }}.{{ target_namespace }}.svc.cluster.local/health/live'
      );
      check(res, {
        'smoke: status is 200': (r) => r.status === 200,
      });
    }

    // Default export — used by the rollout load test webhook. Traffic goes
    // through the Knative Service Flagger controls, so it lands on the
    // canary/primary revisions per the analysis weights — which is what the
    // Kourier gateway Envoy stats (the builtin metric gates) observe.
    export default function () {
      const res = http.get(
        'http://{{ project_name | replace: "_", "-" }}.{{ target_namespace }}.svc.cluster.local/'
      );

      const ok = check(res, {
        'status is 2xx': (r) => r.status >= 200 && r.status < 300,
        'response time < 500ms': (r) => r.timings.duration < 500,
      });

      errorRate.add(!ok);
      sleep(1);
    }
