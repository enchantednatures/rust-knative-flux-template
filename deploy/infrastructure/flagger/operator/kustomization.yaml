apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flagger-system

resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - k6-configmap.yaml

# Mount the k6 script ConfigMap into the loadtester. The target HelmRelease is
# part of this kustomization, so the patch actually applies (when it lived in
# the app-facing component, kustomize silently dropped it — the HelmRelease
# was outside that resource set).
patches:
  - path: loadtester-patch.yaml
    target:
      kind: HelmRelease
      name: flagger-loadtester
      namespace: flagger-system
