apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# CloudNativePG Operator + Barman Cloud Plugin installation
# This component is intended for LOCAL DEVELOPMENT ONLY
# 
# In staging/production environments, the CNPG operator should be installed
# cluster-wide via your cluster management tooling (e.g., Flux, ArgoCD, Terraform)
#
# Usage:
#   Local dev:  components: [../../components/operator, ../../components/postgres]
#   Prod/Stage: components: [../../components/postgres]  # Operator pre-installed

resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.28/releases/cnpg-1.28.0.yaml
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.11.0/manifest.yaml

labels:
  - pairs:
      component: operator
      app.kubernetes.io/name: cloudnative-pg
      app.kubernetes.io/part-of: {{ project_name | replace: "_", "-" }}
    includeSelectors: false
