# k6 TestRun Custom Resource Definition Contract
# This defines the expected structure for k6 load test executions

apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: <test-name>           # DNS-compatible name (required)
  namespace: <namespace>      # Target namespace (default: default)
  labels:
    app: k6-test
    test-type: <smoke|load|stress|soak>
spec:
  # Number of parallel k6 runner pods (1-100)
  parallelism: 4
  
  # Test script source (required)
  script:
    configMap:
      name: <configmap-name>  # ConfigMap containing test script
      file: <filename.js>     # Key within ConfigMap
  
  # k6 CLI arguments (optional)
  # Required for Prometheus output: --out experimental-prometheus-rw
  arguments: --out experimental-prometheus-rw --tag testid=${TEST_ID}
  
  # Runner pod configuration
  runner:
    # k6 container image (pin to specific version in production)
    image: grafana/k6:latest
    
    # Environment variables for k6
    env:
      # Prometheus remote write configuration (required)
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "http://prometheus-server:9090/api/v1/write"
      
      # Trend statistics to export (recommended)
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(50),p(90),p(95),p(99),min,max,avg"
      
      # Push interval (default: 5s)
      - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
        value: "5s"
      
      # Send stale markers when test ends (recommended)
      - name: K6_PROMETHEUS_RW_STALE_MARKERS
        value: "true"
      
      # Application-specific variables
      - name: BASE_URL
        value: "http://my-service:8080"
      - name: TEST_ID
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
    
    # Resource limits (recommended)
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    
    # Security context (recommended)
    securityContext:
      runAsNonRoot: true
      runAsUser: 12345
      fsGroup: 12345

---
# Example: Smoke Test (quick validation)
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: smoke-test
  labels:
    test-type: smoke
spec:
  parallelism: 1
  script:
    configMap:
      name: k6-scripts
      file: smoke-test.js
  arguments: --out experimental-prometheus-rw
  runner:
    image: grafana/k6:latest
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "http://prometheus-server:9090/api/v1/write"
      - name: BASE_URL
        value: "http://my-service:8080"
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

---
# Example: Load Test (sustained traffic)
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: load-test
  labels:
    test-type: load
spec:
  parallelism: 4
  script:
    configMap:
      name: k6-scripts
      file: load-test.js
  arguments: --out experimental-prometheus-rw
  runner:
    image: grafana/k6:latest
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: "http://prometheus-server:9090/api/v1/write"
      - name: K6_PROMETHEUS_RW_TREND_STATS
        value: "p(50),p(90),p(95),p(99),min,max,avg"
      - name: BASE_URL
        value: "http://my-service:8080"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
