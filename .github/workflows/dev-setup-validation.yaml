name: Validate Dev Setup

on:
  pull_request:
    paths:
      - "Makefile"
      - "scripts/dev/**"
      - "deploy/dev/**"
      - "deploy/overlays/dev/**"
      - ".github/workflows/dev-setup-validation.yaml"

jobs:
  validate-dev-setup:
    name: Validate Kind Development Environment
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PROJECT_NAME: dev-setup-test
      GENERATED_DIR: ./generated/dev-setup-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate project from template
        run: |
          cargo generate --path . \
            --name "${PROJECT_NAME}" \
            --define "project_name=${PROJECT_NAME}" \
            --define "project_author=CI Bot <ci@github.com>" \
            --define "feature_s3=true" \
            --define "feature_kafka=false" \
            --define "feature_postgres=false" \
            --define "feature_flagger=false" \
            --define "feature_gha_runner=false" \
            --define "event_source_kafka=true" \
            --define "enable_image_updates=false" \
            --define "target_namespace=default" \
            --define "github_org=test-org" \
            --define "github_repo=${PROJECT_NAME}" \
            --define "default_branch=main" \
            --define "image_registry=ghcr.io" \
            --define "use_default_scaling=true" \
            --define "kafka_topic=events" \
            --define "kafka_consumer_group=${PROJECT_NAME}-consumers" \
            --define "kafka_bootstrap_servers_staging=kafka.staging.svc.cluster.local:9092" \
            --define "kafka_bootstrap_servers_prod=kafka.prod.svc.cluster.local:9092" \
            --silent

          mkdir -p ./generated
          mv "${PROJECT_NAME}" ./generated/

          echo "Generated project structure:"
          ls -la "${GENERATED_DIR}/deploy/dev/infrastructure/" || true

      - name: Install Kind
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: dev
          config: ${{ env.GENERATED_DIR }}/deploy/dev/kind-config.yaml
          wait: 5m

      - name: Verify Kind cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install Knative
        run: |
          "${GENERATED_DIR}/scripts/dev/install-knative.sh"
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Verify Knative installation
        run: |
          kubectl get pods -n knative-serving
          kubectl wait --for=condition=Ready pods --all -n knative-serving --timeout=2m
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Deploy infrastructure
        working-directory: ${{ env.GENERATED_DIR }}
        run: |
          ./scripts/dev/deploy-infrastructure.sh
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Verify infrastructure
        run: |
          kubectl get pods -n redis
          kubectl wait --for=condition=Ready pod -l app=redis -n redis --timeout=3m
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Deploy observability
        working-directory: ${{ env.GENERATED_DIR }}
        run: |
          ./scripts/dev/deploy-observability.sh
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Verify observability
        run: |
          kubectl get pods -n observability
          kubectl wait --for=condition=Ready pod -l app=jaeger -n observability --timeout=3m
          kubectl wait --for=condition=Ready pod -l app=otel-collector -n observability --timeout=3m
          kubectl wait --for=condition=Ready pod -l app=prometheus -n observability --timeout=3m
        env:
          KUBECONFIG: /home/runner/.kube/config

      - name: Show final status
        if: always()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info
          echo ""
          echo "=== Knative Status ==="
          kubectl get pods -n knative-serving
          echo ""
          echo "=== Infrastructure Status ==="
          kubectl get pods -n redis
          kubectl get pods -n kafka 2>/dev/null || true
          kubectl get pods -n minio 2>/dev/null || true
          echo ""
          echo "=== Observability Status ==="
          kubectl get pods -n observability
        env:
          KUBECONFIG: /home/runner/.kube/config
