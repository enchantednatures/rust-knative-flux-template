name: Naming Convention Tests

# Guards the hyphen/underscore normalization contract between Rust (crate names),
# Kubernetes (DNS-1123 names), and Docker (image tags). Runs on every change that
# can affect generated names, plus on demand.
on:
  push:
    branches: [main]
    paths:
      - "cargo-generate.toml"
      - "**/*.liquid"
      - "deploy/**"
      - "scripts/dev/**"
      - "Makefile"
      - "post-generate.rhai"
      - ".github/workflows/naming-convention-tests.yaml"
  pull_request:
    branches: [main]
    paths:
      - "cargo-generate.toml"
      - "**/*.liquid"
      - "deploy/**"
      - "scripts/dev/**"
      - "Makefile"
      - "post-generate.rhai"
      - ".github/workflows/naming-convention-tests.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naming-convention-tests:
    name: Naming Convention (${{ matrix.naming_style }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # kebab-case input: crate gains underscores, Kubernetes keeps hyphens
          - naming_style: "kebab-case"
            project_name: "test-service"
            expected_crate: "test_service"
            expected_k8s: "test-service"

          # snake_case input: the problematic case — Kubernetes must NOT get underscores
          - naming_style: "snake_case"
            project_name: "test_service"
            expected_crate: "test_service"
            expected_k8s: "test-service"

          # single word: no separator to normalize
          - naming_style: "single-word"
            project_name: "testservice"
            expected_crate: "testservice"
            expected_k8s: "testservice"

    env:
      NAMING_STYLE: ${{ matrix.naming_style }}
      PROJECT_NAME: ${{ matrix.project_name }}
      EXPECTED_CRATE: ${{ matrix.expected_crate }}
      EXPECTED_K8S: ${{ matrix.expected_k8s }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate project with ${{ matrix.naming_style }} name
        run: |
          set -euo pipefail

          # cargo-generate --path reads from the git index; copy without .git so
          # every file in the checkout is visible.
          TEMPLATE_SRC=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='target' "$GITHUB_WORKSPACE/" "$TEMPLATE_SRC/"

          cat > template-values.toml <<EOF
          [values]
          project_name = "${{ matrix.project_name }}"
          project_author = "Naming Bot <naming@github.com>"
          workload_type = "Knative"
          feature_s3 = false
          feature_postgres = false
          feature_kafka = false
          event_source_kafka = false
          feature_cron = false
          feature_flagger = false
          feature_gha_runner = false
          feature_cluster_smoke = false
          enable_image_updates = false
          target_namespace = "default"
          github_org = "test-org"
          github_repo = "test-repo"
          default_branch = "main"
          image_registry = "ghcr.io"
          use_default_scaling = true
          EOF

          cargo generate \
            --path "$TEMPLATE_SRC" \
            --name "${{ matrix.project_name }}" \
            --template-values-file template-values.toml \
            --silent \
            --allow-commands

      - name: Verify naming conventions
        run: |
          set -euo pipefail
          cd "${{ matrix.project_name }}"

          echo "=== Verifying naming conventions ==="
          echo "Project name input : ${{ matrix.project_name }}"
          echo "Expected crate     : ${{ matrix.expected_crate }}"
          echo "Expected K8s name  : ${{ matrix.expected_k8s }}"

          fail() { echo "❌ FAILED: $*"; exit 1; }

          # 1. Rust crate name (Cargo.toml)
          ACTUAL_CRATE=$(grep -m1 '^name = ' Cargo.toml | sed 's/name = "\(.*\)"/\1/')
          echo "Cargo.toml name    : $ACTUAL_CRATE"
          [[ "$ACTUAL_CRATE" == "${{ matrix.expected_crate }}" ]] \
            || fail "crate name is '$ACTUAL_CRATE'"
          echo "✓ Cargo.toml crate name"

          # 2. Makefile: PROJECT_NAME hyphenated, CRATE_NAME underscored
          grep -qF "PROJECT_NAME := ${{ matrix.expected_k8s }}" Makefile \
            || fail "Makefile PROJECT_NAME is not ${{ matrix.expected_k8s }}"
          grep -qF "CRATE_NAME := ${{ matrix.expected_crate }}" Makefile \
            || fail "Makefile CRATE_NAME is not ${{ matrix.expected_crate }}"
          echo "✓ Makefile PROJECT_NAME / CRATE_NAME"

          # 3. Local chart name (rendered through the OCI ksvc chart)
          CHART_NAME=$(grep -m1 '^name: ' deploy/chart/Chart.yaml | sed 's/name: *//')
          [[ "$CHART_NAME" == "${{ matrix.expected_k8s }}" ]] \
            || fail "deploy/chart/Chart.yaml name is '$CHART_NAME'"
          echo "✓ deploy/chart/Chart.yaml name"

          # 4. Flux HelmRelease: release name and the rendered Knative Service name
          HR_NAME=$(grep -m1 '^  name: ' deploy/base/helmrelease.yaml | sed 's/.*name: *//')
          [[ "$HR_NAME" == "${{ matrix.expected_k8s }}" ]] \
            || fail "HelmRelease metadata.name is '$HR_NAME'"

          FULLNAME=$(grep -m1 'fullnameOverride:' deploy/base/helmrelease.yaml | sed 's/.*fullnameOverride: *//; s/"//g')
          [[ "$FULLNAME" == "${{ matrix.expected_k8s }}" ]] \
            || fail "HelmRelease fullnameOverride is '$FULLNAME'"
          echo "✓ HelmRelease name + fullnameOverride"

          # 5. Knative forbids underscores in service names: assert none survive
          if grep -rInE '^( *)(name|fullnameOverride): *"?[^"#]*_' deploy/ \
              --include='*.yaml' --include='*.yml'; then
            fail "underscore found in a Kubernetes resource name"
          fi
          echo "✓ no underscores in Kubernetes resource names"

          # 6. Local build/deploy script baked names
          grep -qF "SERVICE_NAME=\"${{ matrix.expected_k8s }}\"" scripts/dev/build-and-deploy.sh \
            || fail "build-and-deploy.sh SERVICE_NAME mismatch"
          grep -qF "CRATE_NAME=\"${{ matrix.expected_crate }}\"" scripts/dev/build-and-deploy.sh \
            || fail "build-and-deploy.sh CRATE_NAME mismatch"
          echo "✓ build-and-deploy.sh SERVICE_NAME / CRATE_NAME"

          # 7. Docker image reference in the HelmRelease uses the hyphenated name
          grep -qF "repository: \"ghcr.io/test-org/${{ matrix.expected_k8s }}\"" deploy/base/helmrelease.yaml \
            || fail "HelmRelease image repository is not hyphenated"
          echo "✓ image repository"

          # 8. Overlay renders with the normalized name
          if command -v kubectl >/dev/null 2>&1; then
            kubectl kustomize deploy/overlays/dev > /tmp/overlay-dev.yaml
            grep -qF "name: ${{ matrix.expected_k8s }}" /tmp/overlay-dev.yaml \
              || fail "dev overlay does not render ${{ matrix.expected_k8s }}"
            echo "✓ dev overlay renders"
          fi

      - name: Compile the generated project
        run: |
          set -euo pipefail
          cd "${{ matrix.project_name }}"
          cargo test --lib

      - name: Summary
        if: always()
        run: |
          echo "=== Naming Convention Test Summary ==="
          echo "Naming style          : ${{ matrix.naming_style }}"
          echo "Input project name    : ${{ matrix.project_name }}"
          echo "Expected crate name   : ${{ matrix.expected_crate }}"
          echo "Expected K8s name     : ${{ matrix.expected_k8s }}"
