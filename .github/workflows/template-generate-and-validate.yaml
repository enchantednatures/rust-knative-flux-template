name: Template Generate & Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-and-validate:
    name: "Validate (${{ matrix.scenario }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bare — no features
          - scenario: bare
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "false"
            enable_image_updates: "false"
          # S3 only
          - scenario: s3-only
            feature_s3: "true"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "false"
            enable_image_updates: "false"
          # Kafka only (producer + consumer)
          - scenario: kafka-only
            feature_s3: "false"
            feature_kafka: "true"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "true"
            enable_image_updates: "false"
          # Postgres only
          - scenario: postgres-only
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "false"
            enable_image_updates: "false"
          # Flagger only
          - scenario: flagger-only
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "true"
            event_source_kafka: "false"
            enable_image_updates: "false"
          # S3 + Kafka
          - scenario: s3-kafka
            feature_s3: "true"
            feature_kafka: "true"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "true"
            enable_image_updates: "false"
          # S3 + Postgres
          - scenario: s3-postgres
            feature_s3: "true"
            feature_kafka: "false"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "false"
            enable_image_updates: "false"
          # Kafka + Postgres
          - scenario: kafka-postgres
            feature_s3: "false"
            feature_kafka: "true"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "true"
            enable_image_updates: "false"
          # All features (no image updates)
          - scenario: all-features
            feature_s3: "true"
            feature_kafka: "true"
            feature_postgres: "true"
            feature_flagger: "true"
            event_source_kafka: "true"
            enable_image_updates: "false"
          # All features + image updates
          - scenario: all-features-img
            feature_s3: "true"
            feature_kafka: "true"
            feature_postgres: "true"
            feature_flagger: "true"
            event_source_kafka: "true"
            enable_image_updates: "true"
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies for Kafka
        if: matrix.feature_kafka == 'true' || matrix.event_source_kafka == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libcurl4-openssl-dev pkg-config
        shell: bash

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.scenario }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate template and run build & lint checks
        run: |
          set -euo pipefail

          # cargo-generate --path reads from the git index, NOT the working tree.
          # Copy the checkout to a temp dir without .git/ so all files are visible.
          TEMPLATE_SRC=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='target' "$GITHUB_WORKSPACE/" "$TEMPLATE_SRC/"

          TEMP_DIR=$(mktemp -d)

          echo "Generating template: ${{ env.SCENARIO }}"

          # Build template-values.toml with boolean placeholders
          cat > "$TEMP_DIR/template-values.toml" <<'TOML_HEADER'
          [values]
          project_name = "example-app"
          project_author = "CI Bot <ci@github.com>"
          TOML_HEADER

          # Feature booleans
          cat >> "$TEMP_DIR/template-values.toml" <<TOML_FEATURES
          feature_s3 = ${{ matrix.feature_s3 }}
          feature_kafka = ${{ matrix.feature_kafka }}
          feature_postgres = ${{ matrix.feature_postgres }}
          feature_flagger = ${{ matrix.feature_flagger }}
          event_source_kafka = ${{ matrix.event_source_kafka }}
          enable_image_updates = ${{ matrix.enable_image_updates }}
          TOML_FEATURES

          # Common settings
          cat >> "$TEMP_DIR/template-values.toml" <<'TOML_COMMON'
          target_namespace = "default"
          github_org = "enchantednatures"
          github_repo = "rust-knative-flux-template"
          default_branch = "main"
          image_registry = "ghcr.io"
          use_default_scaling = true
          TOML_COMMON

          # Flagger-specific values (prompted when feature_flagger = true)
          if [[ "${{ matrix.feature_flagger }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_FLAGGER'
          canary_success_rate_threshold = "99"
          canary_latency_threshold_ms = "500"
          k6_vus = "10"
          flagger_prometheus_url_staging = "http://prometheus.staging.svc.cluster.local:9090"
          flagger_prometheus_url_prod = "http://prometheus.prod.svc.cluster.local:9090"
          flagger_operator_metrics_server = "http://prometheus.observability.svc.cluster.local:9090"
          TOML_FLAGGER
          fi

          # Postgres-specific values (prompted when feature_postgres = true)
          if [[ "${{ matrix.feature_postgres }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_POSTGRES'
          postgres_version = "16"
          postgres_instances_dev = "1"
          postgres_instances_staging = "2"
          postgres_instances_prod = "3"
          postgres_storage_class = "standard"
          backup_schedule = "0 2 * * *"
          backup_retention_dev = "7"
          backup_retention_staging = "14"
          backup_retention_prod = "30"
          TOML_POSTGRES
          fi

          # kafka_topic is shared between feature_kafka and event_source_kafka
          if [[ "${{ matrix.feature_kafka }}" == "true" || "${{ matrix.event_source_kafka }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_KAFKA_COMMON'
          kafka_topic = "events"
          TOML_KAFKA_COMMON
          fi

          # Kafka event source values (prompted when event_source_kafka = true)
          if [[ "${{ matrix.event_source_kafka }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_KAFKA_ES'
          kafka_consumer_group = "example-app-consumers"
          kafka_bootstrap_servers_staging = "kafka.staging.svc.cluster.local:9092"
          kafka_bootstrap_servers_prod = "kafka.prod.svc.cluster.local:9092"
          TOML_KAFKA_ES
          fi

          # Kafka feature values (prompted when feature_kafka = true)
          if [[ "${{ matrix.feature_kafka }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_KAFKA_FEAT'
          kafka_broker_url = "kafka.kafka.svc.cluster.local:9092"
          kafka_event_name = "com.example-app.event.published"
          TOML_KAFKA_FEAT
          fi

          echo "--- template-values.toml ---"
          cat "$TEMP_DIR/template-values.toml"
          echo "---"

          PROJ_NAME="example-app-${{ env.SCENARIO }}"

          cargo generate \
            --path "$TEMPLATE_SRC" \
            --name "$PROJ_NAME" \
            --template-values-file "$TEMP_DIR/template-values.toml" \
            --destination "$TEMP_DIR" \
            --silent \
            --allow-commands

          GENERATED_DIR="$TEMP_DIR/$PROJ_NAME"
          cd "$GENERATED_DIR"
          echo "GENERATED_DIR=$GENERATED_DIR" >> "$GITHUB_ENV"

          echo "Running formatting check"
          cargo fmt --all -- --check

          echo "Running Clippy"
          cargo clippy --all-targets --all-features -- -D warnings

          echo "Building"
          cargo build --all-features

          echo "Compiling tests (no run)"
          cargo test --all-features --no-run
        shell: bash

      - name: Validate Flagger per-env metric gates
        if: matrix.feature_flagger == 'true'
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"
          curl -sSLo /tmp/yq.tar.gz https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64.tar.gz
          tar -xzf /tmp/yq.tar.gz -C /tmp && sudo mv /tmp/yq_linux_amd64 /usr/local/bin/yq
          STAGING_SENTINEL="http://prometheus.staging.svc.cluster.local:9090"
          PROD_SENTINEL="http://prometheus.prod.svc.cluster.local:9090"
          DEV_URL="prometheus.observability.svc.cluster.local:9090"

          # The full overlays cannot be kustomize-built directly: the HelmRelease
          # values patch uses the empty-string services."" key, which kustomize's
          # strategic merge rejects on every kustomize >= 5.4 (pre-existing,
          # tracked separately). Validate the flagger surface exactly as the
          # overlay applies it: component + namespace transformer + the
          # MetricTemplate address patch extracted verbatim from the generated
          # overlay file.
          validate_env() {
            local overlay="$1" kust_ns="$2" outfile="$3"
            local tmp="deploy/overlays/.tmp-flagger-validation"
            rm -rf "$tmp" && mkdir -p "$tmp"
            {
              echo "apiVersion: kustomize.config.k8s.io/v1beta1"
              echo "kind: Kustomization"
              echo "namespace: $kust_ns"
              echo "components:"
              echo "  - ../../components/flagger"
              echo "patches:"
              yq eval '.patches | map(select(.target.kind == "MetricTemplate"))' "$overlay" | sed 's/^/  /'
            } > "$tmp/kustomization.yaml"
            kubectl kustomize "$tmp" > "$outfile"
            rm -rf "$tmp"
          }

          validate_env deploy/overlays/staging/kustomization.yaml staging /tmp/staging-flagger.yaml
          validate_env deploy/overlays/prod/kustomization.yaml production /tmp/prod-flagger.yaml

          assert_env() {
            local env_name="$1" file="$2" mine="$3" other="$4"
            grep -Fq "$mine" "$file" \
              || { echo "FAIL: $env_name MetricTemplate address not patched"; exit 1; }
            if grep -Fq "$other" "$file"; then echo "FAIL: cross-env URL leaked into $env_name"; exit 1; fi
            if grep -Fq "$DEV_URL" "$file"; then echo "FAIL: dev-only Prometheus URL leaked into $env_name"; exit 1; fi
            local count
            count=$(grep -c 'kind: MetricTemplate' "$file" || true)
            [ "$count" = "1" ] || { echo "FAIL: expected 1 MetricTemplate (custom-metric) in $env_name, got $count"; exit 1; }
            if grep -B1 -A3 'templateRef' "$file" | grep -Fq 'namespace: flagger-system'; then
              echo "FAIL: templateRef still hardcodes flagger-system namespace"
              exit 1
            fi
          }

          assert_env staging /tmp/staging-flagger.yaml "$STAGING_SENTINEL" "$PROD_SENTINEL"
          assert_env prod /tmp/prod-flagger.yaml "$PROD_SENTINEL" "$STAGING_SENTINEL"

          # operator kustomization: k6 ConfigMap + applied loadtester patch +
          # templated metricsServer
          kubectl kustomize deploy/infrastructure/flagger/operator > /tmp/operator-flagger.yaml
          grep -Fq 'kind: ConfigMap' /tmp/operator-flagger.yaml \
            || { echo "FAIL: k6 ConfigMap missing from operator kustomization"; exit 1; }
          grep -Fq 'mountPath: /scripts' /tmp/operator-flagger.yaml \
            || { echo "FAIL: loadtester patch not applied"; exit 1; }
          grep -Fq 'metricsServer: http://prometheus.observability.svc.cluster.local:9090' /tmp/operator-flagger.yaml \
            || { echo "FAIL: operator metricsServer not templated"; exit 1; }

          echo "Flagger per-env metric gate validation passed"
        shell: bash
