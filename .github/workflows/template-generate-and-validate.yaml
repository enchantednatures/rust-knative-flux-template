name: Template Generate & Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-and-validate:
    name: Generate & Validate (features=${{ matrix.features }}, updates=${{ matrix.enable_image_updates }})
    runs-on: [gha-runner-scale-set]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: no-s3
            features: ""
            event_sources: ""
            enable_image_updates: "false"
          - scenario: no-s3
            features: ""
            event_sources: ""
            enable_image_updates: "true"
          - scenario: with-s3
            features: "s3"
            event_sources: ""
            enable_image_updates: "false"
          - scenario: with-s3
            features: "s3"
            event_sources: ""
            enable_image_updates: "true"
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-generate-${{ matrix.features }}-${{ matrix.enable_image_updates }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate template and run build & lint checks
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          echo "Generating template: ${{ env.SCENARIO }} (features='${{ matrix.features }}', event_sources='${{ matrix.event_sources }}', enable_image_updates=${{ matrix.enable_image_updates }})"
          cargo generate --path "$OLDPWD" --name "example-app-${{ env.SCENARIO }}-updates-${{ matrix.enable_image_updates }}" \
            --define "features=${{ matrix.features }}" \
            --define "event_sources=${{ matrix.event_sources }}" \
            --define "enable_image_updates=${{ matrix.enable_image_updates }}" \
            --define "target_namespace=default" \
            --define "project_author=CI Test" \
            --silent

          GENERATED_DIR="$TEMP_DIR/example-app-${{ env.SCENARIO }}-updates-${{ matrix.enable_image_updates }}"
          cd "$GENERATED_DIR"

          echo "Running formatting check"
          cargo fmt --all -- --check

          echo "Running Clippy"
          cargo clippy --all-targets --all-features -- -D warnings

          echo "Building"
          cargo build --all-features

          echo "Compiling tests (no run)"
          cargo test --all-features --no-run
        shell: bash
