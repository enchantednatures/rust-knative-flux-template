name: Template Generate & Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-and-validate:
    name: "Validate (${{ matrix.scenario }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bare — no features
          - scenario: bare
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "false"
            feature_cron: "false"
            enable_image_updates: "false"
          # S3 only
          - scenario: s3-only
            feature_s3: "true"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "false"
            feature_cron: "false"
            enable_image_updates: "false"
          # Kafka only (producer + consumer)
          - scenario: kafka-only
            feature_s3: "false"
            feature_kafka: "true"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "true"
            feature_cron: "false"
            enable_image_updates: "false"
          # Postgres only
          - scenario: postgres-only
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "false"
            feature_cron: "false"
            enable_image_updates: "false"
          # Postgres only, barman plugin skipped — cluster already has it
          - scenario: postgres-only-barman
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "false"
            feature_cron: "false"
            enable_image_updates: "false"
            barman_plugin_installed: "true"
          # Flagger only
          - scenario: flagger-only
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "true"
            event_source_kafka: "false"
            feature_cron: "false"
            enable_image_updates: "false"
          # S3 + Kafka
          - scenario: s3-kafka
            feature_s3: "true"
            feature_kafka: "true"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "true"
            feature_cron: "false"
            enable_image_updates: "false"
          # S3 + Postgres
          - scenario: s3-postgres
            feature_s3: "true"
            feature_kafka: "false"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "false"
            feature_cron: "false"
            enable_image_updates: "false"
          # Kafka + Postgres
          - scenario: kafka-postgres
            feature_s3: "false"
            feature_kafka: "true"
            feature_postgres: "true"
            feature_flagger: "false"
            event_source_kafka: "true"
            feature_cron: "false"
            enable_image_updates: "false"
          # All features (no image updates)
          - scenario: all-features
            feature_s3: "true"
            feature_kafka: "true"
            feature_postgres: "true"
            feature_flagger: "true"
            event_source_kafka: "true"
            feature_cron: "false"
            enable_image_updates: "false"
          # All features + image updates
          - scenario: all-features-img
            feature_s3: "true"
            feature_kafka: "true"
            feature_postgres: "true"
            feature_flagger: "true"
            event_source_kafka: "true"
            feature_cron: "false"
            enable_image_updates: "true"
          # Scheduled work only (Knative PingSource)
          - scenario: cron-only
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            event_source_kafka: "false"
            feature_cron: "true"
            enable_image_updates: "false"
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies for Kafka
        if: matrix.feature_kafka == 'true' || matrix.event_source_kafka == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libcurl4-openssl-dev pkg-config
        shell: bash

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # One cache for every scenario: each row builds with --all-features,
          # so the dependency set is identical and the per-scenario suffix only
          # multiplied a 0.23 GB cache by 11 and rotated all of them on each
          # lockfile bump — crowding the 10 GB repo budget that the E2E build
          # cache (~4 min per deploy scenario) needs.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate template and run build & lint checks
        run: |
          set -euo pipefail

          # cargo-generate --path reads from the git index, NOT the working tree.
          # Copy the checkout to a temp dir without .git/ so all files are visible.
          TEMPLATE_SRC=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='target' "$GITHUB_WORKSPACE/" "$TEMPLATE_SRC/"

          TEMP_DIR=$(mktemp -d)

          echo "Generating template: ${{ env.SCENARIO }}"

          # Build template-values.toml with boolean placeholders. project_name
          # must stay identical to the --name passed below: Cargo.toml's crate
          # name derives from --name, while every Kubernetes/bucket name
          # renders from the project_name placeholder.
          PROJ_NAME="example-app-${{ env.SCENARIO }}"

          cat > "$TEMP_DIR/template-values.toml" <<TOML_HEADER
          [values]
          project_name = "${PROJ_NAME}"
          project_author = "CI Bot <ci@github.com>"
          TOML_HEADER

          # Feature booleans
          cat >> "$TEMP_DIR/template-values.toml" <<TOML_FEATURES
          feature_s3 = ${{ matrix.feature_s3 }}
          feature_kafka = ${{ matrix.feature_kafka }}
          feature_postgres = ${{ matrix.feature_postgres }}
          feature_flagger = ${{ matrix.feature_flagger }}
          event_source_kafka = ${{ matrix.event_source_kafka }}
          feature_cron = ${{ matrix.feature_cron }}
          enable_image_updates = ${{ matrix.enable_image_updates }}
          TOML_FEATURES

          # Common settings
          cat >> "$TEMP_DIR/template-values.toml" <<'TOML_COMMON'
          target_namespace = "default"
          github_org = "enchantednatures"
          github_repo = "rust-knative-flux-template"
          default_branch = "main"
          image_registry = "ghcr.io"
          use_default_scaling = true
          TOML_COMMON

          # Flagger-specific values (prompted when feature_flagger = true)
          if [[ "${{ matrix.feature_flagger }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_FLAGGER'
          canary_success_rate_threshold = "99"
          canary_latency_threshold_ms = "500"
          flagger_prometheus_url_staging = "http://prometheus.staging.svc.cluster.local:9090"
          flagger_prometheus_url_prod = "http://prometheus.prod.svc.cluster.local:9090"
          flagger_operator_metrics_server = "http://prometheus.observability.svc.cluster.local:9090"
          TOML_FLAGGER
          fi

          # Postgres-specific values (prompted when feature_postgres = true)
          if [[ "${{ matrix.feature_postgres }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_POSTGRES'
          postgres_version = "18"
          postgres_instances_dev = "1"
          postgres_instances_staging = "2"
          postgres_instances_prod = "3"
          postgres_storage_class = "standard"
          backup_schedule = "0 2 * * *"
          backup_retention_dev = "7"
          backup_retention_staging = "14"
          backup_retention_prod = "30"
          ceph_rgw_endpoint_dev = "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
          ceph_rgw_endpoint_staging = "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
          ceph_rgw_endpoint_prod = "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
          TOML_POSTGRES
          fi

          # Ceph bucket StorageClass (prompted when feature_s3 OR
          # feature_postgres is true). Emitted exactly once so the assembled
          # values file never repeats the key when both features are on.
          if [[ "${{ matrix.feature_s3 }}" == "true" || "${{ matrix.feature_postgres }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_CEPH_SC'
          ceph_bucket_storage_class = "ceph-bucket"
          TOML_CEPH_SC
          fi

          # barman_plugin_installed is optional (default false); only set it
          # explicitly when the row opts into the plugin
          if [[ "${{ matrix.barman_plugin_installed || 'false' }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_BARMAN'
          barman_plugin_installed = "true"
          TOML_BARMAN
          fi

          # kafka_topic is shared between feature_kafka and event_source_kafka
          if [[ "${{ matrix.feature_kafka }}" == "true" || "${{ matrix.event_source_kafka }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_KAFKA_COMMON'
          kafka_topic = "events"
          TOML_KAFKA_COMMON
          fi

          # Kafka event source values (prompted when event_source_kafka = true)
          if [[ "${{ matrix.event_source_kafka }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_KAFKA_ES'
          kafka_consumer_group = "example-app-consumers"
          kafka_bootstrap_servers_staging = "kafka.staging.svc.cluster.local:9092"
          kafka_bootstrap_servers_prod = "kafka.prod.svc.cluster.local:9092"
          TOML_KAFKA_ES
          fi

          # Kafka feature values (prompted when feature_kafka = true)
          if [[ "${{ matrix.feature_kafka }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_KAFKA_FEAT'
          kafka_broker_url = "kafka.kafka.svc.cluster.local:9092"
          kafka_event_name = "com.example-app.event.published"
          TOML_KAFKA_FEAT
          fi

          # Scheduled-work values (prompted when feature_cron = true)
          if [[ "${{ matrix.feature_cron }}" == "true" ]]; then
            cat >> "$TEMP_DIR/template-values.toml" <<'TOML_CRON'
          cron_schedule = "0 * * * *"
          cron_timezone = "UTC"
          cron_payload = '{"message":"generated"}'
          TOML_CRON
          fi

          echo "--- template-values.toml ---"
          cat "$TEMP_DIR/template-values.toml"
          echo "---"

          cargo generate \
            --path "$TEMPLATE_SRC" \
            --name "$PROJ_NAME" \
            --template-values-file "$TEMP_DIR/template-values.toml" \
            --destination "$TEMP_DIR" \
            --silent \
            --allow-commands

          GENERATED_DIR="$TEMP_DIR/$PROJ_NAME"
          cd "$GENERATED_DIR"
          echo "GENERATED_DIR=$GENERATED_DIR" >> "$GITHUB_ENV"

          echo "Running formatting check"
          cargo fmt --all -- --check

          echo "Running Clippy"
          cargo clippy --all-targets --all-features -- -D warnings

          echo "Building"
          cargo build --all-features

          echo "Compiling tests (no run)"
          cargo test --all-features --no-run
        shell: bash

      - name: Validate PostgreSQL manifests
        if: matrix.feature_postgres == 'true'
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          ./scripts/validate-postgres-manifests.sh

          grep -q 'name: cnpg-operator' deploy/flux/kustomization-dev.yaml \
            || { echo "FAIL: app Kustomization missing cnpg-operator dependsOn"; exit 1; }
          grep -qF 'cnpg-operator-kustomization.yaml' \
            deploy/flux/config/dev/kustomization.yaml \
            || { echo "FAIL: cnpg-operator Kustomization not wired in flux config"; exit 1; }

          if [[ "${{ matrix.barman_plugin_installed || 'false' }}" != "true" ]]; then
            grep -q 'plugin-barman-cloud/releases' \
              deploy/infrastructure/cnpg-operator/kustomization.yaml \
              || { echo "FAIL: barman plugin manifest URL missing from cnpg-operator kustomization"; exit 1; }
          fi

          du -sh "$GENERATED_DIR" > /dev/null
        shell: bash

      - name: Assert barman plugin skipped when pre-installed
        if: matrix.feature_postgres == 'true' && (matrix.barman_plugin_installed || 'false') == 'true'
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          ! grep -q 'plugin-barman-cloud' \
            deploy/infrastructure/cnpg-operator/kustomization.yaml \
            || { echo "FAIL: barman plugin manifest present despite barman_plugin_installed=true"; exit 1; }
          grep -q 'barman-cloud.cloudnative-pg.io' \
            deploy/components/postgres/postgres-backup.yaml \
            || { echo "FAIL: plugin name missing from postgres-backup.yaml after skip"; exit 1; }

          echo "✓ barman plugin skipped (pre-installed in cluster), backup manifests intact"
        shell: bash

      - name: Assert no postgres residue when disabled
        if: matrix.feature_postgres == 'false'
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          [ ! -d deploy/components/postgres ] || { echo "FAIL: postgres component present"; exit 1; }
          [ ! -f src/handlers/items.rs ] || { echo "FAIL: items handlers present"; exit 1; }
          [ ! -f build.rs ] || { echo "FAIL: build.rs present"; exit 1; }
          [ ! -d migrations ] || { echo "FAIL: migrations dir present"; exit 1; }
          ! grep -q 'tls-rustls-ring' Cargo.toml || { echo "FAIL: runtime sqlx present"; exit 1; }

          echo "✓ no postgres residue"
        shell: bash

      - name: Validate scheduled work
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          if [[ "${{ matrix.feature_cron }}" == "true" ]]; then
            grep -q 'pingsources:' deploy/base/helmrelease.yaml \
              || { echo "FAIL: pingsources missing from HelmRelease values"; exit 1; }
            grep -Fq 'schedule: "0 * * * *"' deploy/base/helmrelease.yaml \
              || { echo "FAIL: cron_schedule not rendered into HelmRelease values"; exit 1; }
            grep -Fq 'timezone: "UTC"' deploy/base/helmrelease.yaml \
              || { echo "FAIL: cron_timezone not rendered into HelmRelease values"; exit 1; }
            grep -Fq '{"message":"generated"}' deploy/base/helmrelease.yaml \
              || { echo "FAIL: cron_payload not rendered into HelmRelease values"; exit 1; }

            grep -q 'handle_scheduled_event' src/handlers/events.rs \
              || { echo "FAIL: scheduled handler missing"; exit 1; }
            grep -q 'SCHEDULED_EVENT_TYPE' src/handlers/events.rs \
              || { echo "FAIL: scheduled event type constant missing"; exit 1; }
            grep -q 'test_scheduled_cloudevent' tests/events_test.rs \
              || { echo "FAIL: scheduled event test missing"; exit 1; }

            [ -f scripts/dev/install-knative-eventing.sh ] \
              || { echo "FAIL: install-knative-eventing.sh missing"; exit 1; }
            [ -f docs/SCHEDULED_WORK.md ] \
              || { echo "FAIL: docs/SCHEDULED_WORK.md missing"; exit 1; }

            grep -q 'SCHEDULED_WORK.md' README.md \
              || { echo "FAIL: README.md missing SCHEDULED_WORK link"; exit 1; }
            grep -q 'SCHEDULED_WORK.md' docs/KNATIVE_EVENTING.md \
              || { echo "FAIL: docs/KNATIVE_EVENTING.md missing SCHEDULED_WORK link"; exit 1; }
            grep -q 'Scheduled Work (feature_cron)' AGENTS.md \
              || { echo "FAIL: AGENTS.md missing Scheduled Work section"; exit 1; }

            ! grep -rq 'kind: PingSource' deploy/ \
              || { echo "FAIL: raw PingSource manifest found in deploy/ (expected HelmRelease values only)"; exit 1; }

            echo "✓ scheduled-work artifacts present (feature_cron=true)"
          else
            ! grep -q 'pingsources:' deploy/base/helmrelease.yaml \
              || { echo "FAIL: pingsources present when feature_cron=false"; exit 1; }
            ! grep -q 'cron_schedule' deploy/base/helmrelease.yaml \
              || { echo "FAIL: cron_schedule present when feature_cron=false"; exit 1; }
            ! grep -q 'cron_timezone' deploy/base/helmrelease.yaml \
              || { echo "FAIL: cron_timezone present when feature_cron=false"; exit 1; }
            ! grep -q 'cron_payload' deploy/base/helmrelease.yaml \
              || { echo "FAIL: cron_payload present when feature_cron=false"; exit 1; }

            ! grep -q 'handle_scheduled_event' src/handlers/events.rs \
              || { echo "FAIL: scheduled handler present when feature_cron=false"; exit 1; }
            ! grep -q 'SCHEDULED_EVENT_TYPE' src/handlers/events.rs \
              || { echo "FAIL: scheduled event type constant present when feature_cron=false"; exit 1; }

            [ ! -f scripts/dev/install-knative-eventing.sh ] \
              || { echo "FAIL: install-knative-eventing.sh present when feature_cron=false"; exit 1; }
            [ ! -f docs/SCHEDULED_WORK.md ] \
              || { echo "FAIL: docs/SCHEDULED_WORK.md present when feature_cron=false"; exit 1; }

            ! grep -q 'feature_cron' AGENTS.md \
              || { echo "FAIL: AGENTS.md retains feature_cron content when feature_cron=false"; exit 1; }
            ! grep -q 'SCHEDULED_WORK' README.md docs/KNATIVE_EVENTING.md \
              || { echo "FAIL: README.md/docs/KNATIVE_EVENTING.md retain SCHEDULED_WORK links when feature_cron=false"; exit 1; }

            echo "✓ no scheduled-work residue (feature_cron=false)"
          fi
        shell: bash

      - name: Validate Flagger per-env metric gates
        if: matrix.feature_flagger == 'true'
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"
          curl -sSLo /tmp/yq.tar.gz https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64.tar.gz
          tar -xzf /tmp/yq.tar.gz -C /tmp && sudo mv /tmp/yq_linux_amd64 /usr/local/bin/yq
          STAGING_SENTINEL="http://prometheus.staging.svc.cluster.local:9090"
          PROD_SENTINEL="http://prometheus.prod.svc.cluster.local:9090"
          DEV_URL="prometheus.observability.svc.cluster.local:9090"

          # Validate the flagger surface exactly as the overlay applies it:
          # component + namespace transformer + the MetricTemplate address
          # patch extracted verbatim from the generated overlay file. (The
          # previous empty-string services."" limitation no longer applies —
          # the HelmRelease now uses a named `services.app` key.)
          validate_env() {
            local overlay="$1" kust_ns="$2" outfile="$3"
            local tmp="deploy/overlays/.tmp-flagger-validation"
            rm -rf "$tmp" && mkdir -p "$tmp"
            {
              echo "apiVersion: kustomize.config.k8s.io/v1beta1"
              echo "kind: Kustomization"
              echo "namespace: $kust_ns"
              echo "components:"
              echo "  - ../../components/flagger"
              echo "patches:"
              yq eval '.patches | map(select(.target.kind == "MetricTemplate"))' "$overlay" | sed 's/^/  /'
            } > "$tmp/kustomization.yaml"
            kubectl kustomize "$tmp" > "$outfile"
            rm -rf "$tmp"
          }

          validate_env deploy/overlays/staging/kustomization.yaml staging /tmp/staging-flagger.yaml
          validate_env deploy/overlays/prod/kustomization.yaml production /tmp/prod-flagger.yaml

          assert_env() {
            local env_name="$1" file="$2" mine="$3" other="$4"
            grep -Fq "$mine" "$file" \
              || { echo "FAIL: $env_name MetricTemplate address not patched"; exit 1; }
            if grep -Fq "$other" "$file"; then echo "FAIL: cross-env URL leaked into $env_name"; exit 1; fi
            if grep -Fq "$DEV_URL" "$file"; then echo "FAIL: dev-only Prometheus URL leaked into $env_name"; exit 1; fi
            local count
            count=$(grep -c 'kind: MetricTemplate' "$file" || true)
            [ "$count" = "1" ] || { echo "FAIL: expected 1 MetricTemplate (custom-metric) in $env_name, got $count"; exit 1; }
            if grep -B1 -A3 'templateRef' "$file" | grep -Fq 'namespace: flagger-system'; then
              echo "FAIL: templateRef still hardcodes flagger-system namespace"
              exit 1
            fi
          }

          assert_env staging /tmp/staging-flagger.yaml "$STAGING_SENTINEL" "$PROD_SENTINEL"
          assert_env prod /tmp/prod-flagger.yaml "$PROD_SENTINEL" "$STAGING_SENTINEL"

          # operator kustomization: loadtester HelmRelease + templated
          # metricsServer (webhook commands run hey from the stock image —
          # no script ConfigMap is mounted)
          kubectl kustomize deploy/infrastructure/flagger/operator > /tmp/operator-flagger.yaml
          grep -Fq 'name: flagger-loadtester' /tmp/operator-flagger.yaml \
            || { echo "FAIL: loadtester HelmRelease missing from operator kustomization"; exit 1; }
          grep -Fq 'metricsServer: http://prometheus.observability.svc.cluster.local:9090' /tmp/operator-flagger.yaml \
            || { echo "FAIL: operator metricsServer not templated"; exit 1; }

          echo "Flagger per-env metric gate validation passed"
        shell: bash

  managed-kafka-render:
    name: "Managed Kafka render"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies for Kafka
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libcurl4-openssl-dev pkg-config
        shell: bash

      - name: Install helm and yq
        run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          sudo curl -sSLo /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          helm version --short
          yq --version
        shell: bash

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate managed-Kafka project
        run: |
          set -euo pipefail

          TEMPLATE_SRC=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='target' "$GITHUB_WORKSPACE/" "$TEMPLATE_SRC/"

          TEMP_DIR=$(mktemp -d)
          cat > "$TEMP_DIR/template-values.toml" <<'TOML'
          [values]
          project_name = "marrakesh"
          project_author = "CI Bot <ci@github.com>"
          feature_s3 = false
          feature_kafka = true
          feature_postgres = false
          feature_flagger = false
          event_source_kafka = true
          kafka_managed_cluster = true
          feature_cron = false
          enable_image_updates = false
          target_namespace = "marrakesh"
          github_org = "enchantednatures"
          github_repo = "rust-knative-flux-template"
          default_branch = "main"
          image_registry = "ghcr.io"
          use_default_scaling = true
          kafka_topic = "events"
          kafka_consumer_group = "marrakesh-consumers"
          kafka_bootstrap_servers_staging = "kafka.staging.svc.cluster.local:9092"
          kafka_bootstrap_servers_prod = "kafka.prod.svc.cluster.local:9092"
          kafka_broker_url = "kafka.kafka.svc.cluster.local:9092"
          kafka_event_name = "com.example.marrakesh.event.published"
          TOML

          cargo generate \
            --path "$TEMPLATE_SRC" \
            --name "marrakesh" \
            --template-values-file "$TEMP_DIR/template-values.toml" \
            --destination "$TEMP_DIR" \
            --silent \
            --allow-commands

          GENERATED_DIR="$TEMP_DIR/marrakesh"
          echo "GENERATED_DIR=$GENERATED_DIR" >> "$GITHUB_ENV"
        shell: bash

      - name: Assert managed Kafka render
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          helm dependency build deploy/chart

          VALUES_FILE=$(mktemp)
          yq eval '.spec.values' deploy/base/helmrelease.yaml > "$VALUES_FILE"

          helm lint deploy/chart -n marrakesh -f "$VALUES_FILE"
          helm template marrakesh deploy/chart -n marrakesh -f "$VALUES_FILE" > /tmp/managed-render.yaml

          BROKER_BOOTSTRAP="marrakesh-kafka.marrakesh.svc.cluster.local:9093"

          require_value() {
            local description="$1" expected="$2" actual="$3"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "FAIL: ${description}: expected '${expected}', got '${actual:-<empty>}'"
              exit 1
            fi
            echo "PASS: ${description}"
          }

          require_value "managed Redpanda CR" "marrakesh-kafka" \
            "$(yq 'select(.kind == "Redpanda") | .metadata.name' /tmp/managed-render.yaml | head -1)"
          require_value "managed Topic CR" "events" \
            "$(yq 'select(.kind == "Topic") | .metadata.name' /tmp/managed-render.yaml | head -1)"
          require_value "Kafka Broker CR" "marrakesh-kafka-broker" \
            "$(yq 'select(.kind == "Broker") | .metadata.name' /tmp/managed-render.yaml | head -1)"
          require_value "Kafka Trigger CR" "marrakesh-events-trigger" \
            "$(yq 'select(.kind == "Trigger") | .metadata.name' /tmp/managed-render.yaml | head -1)"
          require_value "KafkaSource CR" "marrakesh-events-kafka-source" \
            "$(yq 'select(.kind == "KafkaSource") | .metadata.name' /tmp/managed-render.yaml | head -1)"
          require_value "broker ConfigMap" "marrakesh-kafka-broker-config" \
            "$(yq 'select(.kind == "ConfigMap" and .metadata.name == "marrakesh-kafka-broker-config") | .metadata.name' /tmp/managed-render.yaml | head -1)"
          require_value "broker bootstrap" "$BROKER_BOOTSTRAP" \
            "$(yq 'select(.kind == "ConfigMap" and .metadata.name == "marrakesh-kafka-broker-config") | .data["bootstrap.servers"]' /tmp/managed-render.yaml | head -1)"
          require_value "KafkaSource derived bootstrap" "$BROKER_BOOTSTRAP" \
            "$(yq 'select(.kind == "KafkaSource") | .spec.bootstrapServers[0]' /tmp/managed-render.yaml | head -1)"
          require_value "KafkaSource sinks to the Broker" "Broker" \
            "$(yq 'select(.kind == "KafkaSource") | .spec.sink.ref.kind' /tmp/managed-render.yaml | head -1)"
          require_value "KafkaSource broker name" "marrakesh-kafka-broker" \
            "$(yq 'select(.kind == "KafkaSource") | .spec.sink.ref.name' /tmp/managed-render.yaml | head -1)"
          require_value "Trigger subscriber" "marrakesh" \
            "$(yq 'select(.kind == "Trigger") | .spec.subscriber.ref.name' /tmp/managed-render.yaml | head -1)"
          require_value "app managed Kafka URL" "marrakesh-kafka:9093" \
            "$(yq 'select(.kind == "Service" and .metadata.name == "marrakesh") | .spec.template.spec.containers[0].env[] | select(.name == "APP__KAFKA__BROKER_URL") | .value' /tmp/managed-render.yaml | head -1)"
          require_value "DLQ image tag" "v1.23.0" \
            "$(yq 'select(.kind == "Service" and (.metadata.name | test("events-dlq$"))) | .spec.template.spec.containers[0].image' /tmp/managed-render.yaml | head -1 | sed 's/.*://')"
          require_value "tuning init disabled" "false" \
            "$(yq 'select(.kind == "Redpanda") | .spec.clusterSpec.statefulset.initContainers.tuning.tune_aio_events' /tmp/managed-render.yaml | head -1)"
          require_value "sidecar memory limit" "512Mi" \
            "$(yq 'select(.kind == "Redpanda") | .spec.clusterSpec.statefulset.podTemplate.spec.containers[] | select(.name == "sidecar") | .resources.limits.memory' /tmp/managed-render.yaml | head -1)"

          if grep -qE 'redpanda-cluster|kafka\.kafka' /tmp/managed-render.yaml; then
            echo "FAIL: managed render still references an external Kafka cluster"
            exit 1
          fi

          # The dev overlay must not pin an external bootstrap/sink in managed mode.
          kubectl kustomize deploy/overlays/dev > /tmp/managed-dev.yaml
          require_value "dev cluster enabled" "true" \
            "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.cluster.enabled' /tmp/managed-dev.yaml)"
          require_value "dev cluster name" "marrakesh-kafka" \
            "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.cluster.name' /tmp/managed-dev.yaml)"
          require_value "dev broker enabled" "true" \
            "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.broker.enabled' /tmp/managed-dev.yaml)"
          require_value "dev app managed Kafka URL" "marrakesh-kafka:9093" \
            "$(yq 'select(.kind == "HelmRelease") | .spec.values.services.app.env[] | select(.name == "APP__KAFKA__BROKER_URL") | .value' /tmp/managed-dev.yaml | head -1)"
          if [[ -n "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.sources.events.bootstrapServers // ""' /tmp/managed-dev.yaml)" ]]; then
            echo "FAIL: dev overlay still sets kafka.sources.events.bootstrapServers in managed mode"
            exit 1
          fi
          if [[ -n "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.sources.events.sink // ""' /tmp/managed-dev.yaml)" ]]; then
            echo "FAIL: dev overlay still sets kafka.sources.events.sink in managed mode"
            exit 1
          fi

          # Kind fallback: managed mode reverts to the local Kafka StatefulSet.
          kubectl kustomize deploy/dev/app-overlay > /tmp/managed-app-overlay.yaml
          require_value "kind fallback source bootstrap" "kafka.kafka.svc.cluster.local:9092" \
            "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.sources.events.bootstrapServers[0]' /tmp/managed-app-overlay.yaml)"
          require_value "kind fallback source sink" "app" \
            "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka.sources.events.sink' /tmp/managed-app-overlay.yaml)"
          if [[ "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka | has("broker")' /tmp/managed-app-overlay.yaml)" != "false" ]]; then
            echo "FAIL: Kind fallback kept kafka.broker"
            exit 1
          fi
          if [[ "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka | has("cluster")' /tmp/managed-app-overlay.yaml)" != "false" ]]; then
            echo "FAIL: Kind fallback kept kafka.cluster"
            exit 1
          fi
          if [[ "$(yq 'select(.kind == "HelmRelease") | .spec.values.kafka | has("triggers")' /tmp/managed-app-overlay.yaml)" != "false" ]]; then
            echo "FAIL: Kind fallback kept kafka.triggers"
            exit 1
          fi

          echo "✓ managed Kafka render assertions passed"
        shell: bash

  full-stack:
    name: "Full-stack validation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies (librdkafka toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev cmake \
            libcurl4-openssl-dev libsasl2-dev libzstd-dev zlib1g-dev
        shell: bash

      - name: Install helm and yq
        run: |
          if ! command -v helm &> /dev/null; then
            echo "Installing helm..."
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          sudo curl -sSLo /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          helm version --short
          yq --version
        shell: bash

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate full-stack project
        run: |
          set -euo pipefail

          # cargo-generate --path reads from the git index, NOT the working
          # tree. Copy the checkout to a temp dir without .git/ so all files
          # are visible.
          TEMPLATE_SRC=$(mktemp -d)
          rsync -a --exclude='.git' --exclude='target' "$GITHUB_WORKSPACE/" "$TEMPLATE_SRC/"

          TEMP_DIR=$(mktemp -d)
          cargo generate \
            --path "$TEMPLATE_SRC" \
            --name "test-app-full" \
            --template-values-file "$GITHUB_WORKSPACE/ci/template-values-full.toml" \
            --destination "$TEMP_DIR" \
            --silent \
            --allow-commands

          GENERATED_DIR="$TEMP_DIR/test-app-full"
          echo "GENERATED_DIR=$GENERATED_DIR" >> "$GITHUB_ENV"
          echo "Generated full-stack project at $GENERATED_DIR"
          ls "$GENERATED_DIR"
        shell: bash

      - name: Validate cluster smoke workflow
        run: |
          set -euo pipefail
          WF="${GENERATED_DIR}/.github/workflows/smoke-deploy.yaml"
          test -f "$WF" || { echo "❌ smoke workflow missing"; exit 1; }
          grep -q "runs-on: test-app-full-runner" "$WF" || { echo "❌ smoke workflow does not use the self-hosted runner"; exit 1; }
          grep -q "environment: staging" "$WF" || { echo "❌ smoke workflow environment not rendered"; exit 1; }
          grep -q "KUSTOMIZATION: test-app-full-staging" "$WF" || { echo "❌ smoke workflow Kustomization not rendered"; exit 1; }
          grep -q "DIGEST_STRICT: \"false\"" "$WF" || { echo "❌ DIGEST_STRICT should be false when image updates are disabled"; exit 1; }
          if grep -nE '\{%' "$WF"; then echo "❌ unrendered liquid syntax"; exit 1; fi
          if grep -nE '\{\{ (project_name|smoke_environment|target_namespace)' "$WF"; then echo "❌ unrendered placeholders"; exit 1; fi
          yq eval '.' "$WF" > /dev/null
          echo "✓ cluster smoke workflow rendered and valid"
        shell: bash

      - name: Lint and build generated project
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"
          echo "Running Clippy"
          cargo clippy --all-targets --all-features -- -D warnings
          echo "Building"
          cargo build --all-features
        shell: bash

      - name: Build generated container image
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"
          docker build -t test-app-full:ci .
        shell: bash

      - name: Render Helm chart and assert Kafka/DLQ wiring
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          helm dependency build deploy/chart

          VALUES_FILE=$(mktemp)
          yq eval '.spec.values' deploy/base/helmrelease.yaml > "$VALUES_FILE"

          RENDERED=$(mktemp)
          helm template test-app-full deploy/chart -f "$VALUES_FILE" -n default > "$RENDERED"

          grep -q 'KafkaSource' "$RENDERED" \
            || { echo "FAIL: KafkaSource missing from rendered chart"; exit 1; }
          grep -q 'deadLetterSink' "$RENDERED" \
            || { echo "FAIL: deadLetterSink missing from rendered chart"; exit 1; }
          grep -q 'test-app-full-events-dlq' "$RENDERED" \
            || { echo "FAIL: DLQ service name missing from rendered chart"; exit 1; }

          PINGSOURCE_COUNT=$(grep -c '^kind: PingSource$' "$RENDERED" || true)
          [ "$PINGSOURCE_COUNT" = "1" ] \
            || { echo "FAIL: expected exactly 1 rendered PingSource, got $PINGSOURCE_COUNT"; exit 1; }
          PINGSOURCE_NAME=$(yq eval 'select(.kind == "PingSource") | .metadata.name' "$RENDERED")
          [ "$PINGSOURCE_NAME" = "test-app-full-scheduled-ping-source" ] \
            || { echo "FAIL: PingSource name is '$PINGSOURCE_NAME', expected test-app-full-scheduled-ping-source"; exit 1; }
          PINGSOURCE_SINK=$(yq eval 'select(.kind == "PingSource") | .spec.sink.ref.name' "$RENDERED")
          [ "$PINGSOURCE_SINK" = "test-app-full" ] \
            || { echo "FAIL: PingSource sink.ref.name is '$PINGSOURCE_SINK', expected test-app-full"; exit 1; }

          # postRenderers are applied by Flux (not helm) — assert the generated
          # HelmRelease targets the chart's DLQ service by name.
          POSTRENDERERS=$(mktemp)
          yq eval '.spec.postRenderers' deploy/base/helmrelease.yaml > "$POSTRENDERERS"
          grep -q 'test-app-full-events-dlq' "$POSTRENDERERS" \
            || { echo "FAIL: HelmRelease postRenderers do not target the DLQ service"; exit 1; }
          echo "✓ Helm render + DLQ + PingSource assertions passed"
        shell: bash

      - name: Render environment overlays
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          for env in dev staging prod; do
            OUT="/tmp/overlay-${env}.yaml"
            kubectl kustomize "deploy/overlays/${env}" > "$OUT"
            [ -s "$OUT" ] || { echo "FAIL: deploy/overlays/${env} rendered empty"; exit 1; }
            if grep -q '{{' "$OUT"; then
              echo "FAIL: unrendered template syntax in deploy/overlays/${env}"
              exit 1
            fi

            # The overlay renders the HelmRelease, not the chart output, so the
            # scheduled-work wiring is asserted in spec.values (no PingSource kind).
            grep -q 'pingsources:' "$OUT" \
              || { echo "FAIL: deploy/overlays/${env} HelmRelease missing pingsources values"; exit 1; }
            PING_SCHEDULE=$(yq eval 'select(.kind == "HelmRelease") | .spec.values.pingsources.scheduled.schedule' "$OUT")
            PING_TIMEZONE=$(yq eval 'select(.kind == "HelmRelease") | .spec.values.pingsources.scheduled.timezone' "$OUT")
            PING_PAYLOAD=$(yq eval 'select(.kind == "HelmRelease") | .spec.values.pingsources.scheduled.data' "$OUT")
            [ "$PING_SCHEDULE" = "0 * * * *" ] \
              || { echo "FAIL: deploy/overlays/${env} cron_schedule is '$PING_SCHEDULE'"; exit 1; }
            [ "$PING_TIMEZONE" = "UTC" ] \
              || { echo "FAIL: deploy/overlays/${env} cron_timezone is '$PING_TIMEZONE'"; exit 1; }
            printf '%s' "$PING_PAYLOAD" | grep -Fq '{"message":"generated"}' \
              || { echo "FAIL: deploy/overlays/${env} cron_payload missing"; exit 1; }
          done

          # Dev overlay must keep the pooler host and preserve the base Kafka
          # sink/delivery/dlq fields (per-field patches, not whole-object
          # replaces) plus the DLQ postRenderer target.
          grep -q 'APP__POSTGRES__HOST' /tmp/overlay-dev.yaml \
            || { echo "FAIL: dev overlay missing APP__POSTGRES__HOST"; exit 1; }
          grep -q 'dlq:' /tmp/overlay-dev.yaml \
            || { echo "FAIL: dev overlay dropped kafka dlq config"; exit 1; }
          grep -q 'delivery:' /tmp/overlay-dev.yaml \
            || { echo "FAIL: dev overlay dropped kafka delivery config"; exit 1; }
          grep -q 'sink: app' /tmp/overlay-dev.yaml \
            || { echo "FAIL: dev overlay dropped kafka sink"; exit 1; }
          grep -q 'test-app-full-events-dlq' /tmp/overlay-dev.yaml \
            || { echo "FAIL: dev overlay dropped the DLQ postRenderer target"; exit 1; }
          echo "✓ overlay render assertions passed"
        shell: bash

      - name: Render Flux config with load restrictions off
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"
          kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/flux/config/dev > /tmp/flux-config-dev.yaml
          [ -s /tmp/flux-config-dev.yaml ] || { echo "FAIL: flux config dev rendered empty"; exit 1; }
          echo "✓ flux config dev rendered"
        shell: bash

      - name: Run generated test suite
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          # GitHub service containers are unsupported on ARC-style runners;
          # run Redis on the Docker daemon so localhost:6379 is reachable.
          for i in $(seq 1 60); do
            docker info >/dev/null 2>&1 && break
            sleep 2
          done
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec redis redis-cli ping

          cargo test --all-features
        shell: bash

      - name: Assert no leaked template syntax or CI placeholders
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"

          # Scoped leak gate. Excludes:
          #   - .github/workflows        GitHub Actions dollar-double-brace expressions
          #   - deploy/chart/templates   legitimate Helm {{ }}
          #   - docs/FLAGGER.md / TESTING.md / MONITORING.md
          #                              intentional runtime {{ }} examples
          #   - scripts/dev/build-and-deploy.sh
          #                              literal template-detection probe
          if grep -rnIE 'test-org|test-repo|\{\{ (project_name|crate_name|github_org|github_repo|image_registry|kafka_|postgres_)|\{\{project_name|\{% ' . \
              --exclude-dir=.git \
              --exclude-dir=target \
              --exclude-dir=workflows \
              --exclude-dir=templates \
              --exclude=FLAGGER.md \
              --exclude=TESTING.md \
              --exclude=MONITORING.md \
              --exclude=build-and-deploy.sh; then
            echo "FAIL: unrendered template syntax or CI placeholders leaked into the generated tree"
            exit 1
          fi
          echo "✓ no leaked template syntax or CI placeholders"
        shell: bash

      - name: Validate PostgreSQL manifests
        run: |
          set -euo pipefail
          cd "$GENERATED_DIR"
          ./scripts/validate-postgres-manifests.sh
        shell: bash
