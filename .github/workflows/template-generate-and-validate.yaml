name: Template Generate & Validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-and-validate:
    name: Generate & Validate (s3=${{ matrix.include_s3 }}, kafka=${{ matrix.include_kafka }}, updates=${{ matrix.enable_image_updates }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # S3: false, Kafka: false, ImageUpdates: false
          - scenario: no-s3-no-kafka
            include_s3: "false"
            include_kafka: "false"
            enable_image_updates: "false"
          # S3: false, Kafka: false, ImageUpdates: true
          - scenario: no-s3-no-kafka
            include_s3: "false"
            include_kafka: "false"
            enable_image_updates: "true"
          # S3: false, Kafka: true, ImageUpdates: false
          - scenario: no-s3-with-kafka
            include_s3: "false"
            include_kafka: "true"
            enable_image_updates: "false"
          # S3: false, Kafka: true, ImageUpdates: true
          - scenario: no-s3-with-kafka
            include_s3: "false"
            include_kafka: "true"
            enable_image_updates: "true"
          # S3: true, Kafka: false, ImageUpdates: false
          - scenario: with-s3-no-kafka
            include_s3: "true"
            include_kafka: "false"
            enable_image_updates: "false"
          # S3: true, Kafka: false, ImageUpdates: true
          - scenario: with-s3-no-kafka
            include_s3: "true"
            include_kafka: "false"
            enable_image_updates: "true"
          # S3: true, Kafka: true, ImageUpdates: false
          - scenario: with-s3-with-kafka
            include_s3: "true"
            include_kafka: "true"
            enable_image_updates: "false"
          # S3: true, Kafka: true, ImageUpdates: true
          - scenario: with-s3-with-kafka
            include_s3: "true"
            include_kafka: "true"
            enable_image_updates: "true"
    env:
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies for Kafka
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev pkg-config
        shell: bash

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-generate-${{ matrix.include_s3 }}-${{ matrix.include_kafka }}-${{ matrix.enable_image_updates }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Generate template and run build & lint checks
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          echo "Generating template: ${{ env.SCENARIO }} (include_s3=${{ matrix.include_s3 }}, kafka=${{ matrix.include_kafka }}, enable_image_updates=${{ matrix.enable_image_updates }})"

          # Build features array based on matrix values
          FEATURES="[]"
          if [[ "${{ matrix.include_s3 }}" == "true" && "${{ matrix.include_kafka }}" == "true" ]]; then
            FEATURES='["s3", "kafka"]'
          elif [[ "${{ matrix.include_s3 }}" == "true" ]]; then
            FEATURES='["s3"]'
          elif [[ "${{ matrix.include_kafka }}" == "true" ]]; then
            FEATURES='["kafka"]'
          fi

          # Create template values file
          cat > template-values.toml << TEMPLATE_EOF
          [values]
          project_name = "example-app"
          project_author = "CI Bot <ci@github.com>"
          features = $FEATURES
          event_sources = []
          enable_image_updates = ${{ matrix.enable_image_updates }}
          target_namespace = "default"
          github_org = "enchantednatures"
          github_repo = "rust-knative-flux-template"
          default_branch = "main"
          image_registry = "ghcr.io"
          use_default_scaling = true
          TEMPLATE_EOF

          cargo generate --path "$OLDPWD" --name "example-app-${{ env.SCENARIO }}-updates-${{ matrix.enable_image_updates }}" \
            --template-values-file template-values.toml \
            --allow-commands

          GENERATED_DIR="$TEMP_DIR/example-app-${{ env.SCENARIO }}-updates-${{ matrix.enable_image_updates }}"
          cd "$GENERATED_DIR"

          echo "Cleaning build artifacts from post-generate hook"
          cargo clean

          echo "Running formatting check"
          cargo fmt --all -- --check

          echo "Running Clippy"
          cargo clippy --all-targets --all-features -- -D warnings

          echo "Building"
          cargo build --all-features

          echo "Compiling tests (no run)"
          cargo test --all-features --no-run
        shell: bash
