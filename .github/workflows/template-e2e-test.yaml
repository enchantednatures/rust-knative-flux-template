name: E2E Tests (OCI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  e2e:
    name: E2E (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - scenario: with-s3
            feature_s3: "true"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            feature_gha_runner: "false"
            event_source_kafka: "false"
            project_name: "test-app-with-s3"
            deploy: "true"

          - scenario: with-gha-runner
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "false"
            feature_gha_runner: "true"
            event_source_kafka: "false"
            project_name: "test-app-with-runner"
            deploy: "false"

          - scenario: with-flagger
            feature_s3: "false"
            feature_kafka: "false"
            feature_postgres: "false"
            feature_flagger: "true"
            feature_gha_runner: "false"
            event_source_kafka: "false"
            project_name: "test-app-with-flagger"
            deploy: "true"

    env:
      SCENARIO: ${{ matrix.scenario }}

    steps:
      - name: Install dependencies (for robustness)
        run: |
          if ! command -v docker &> /dev/null; then
            echo "❌ Docker not found. Please install Docker on self-hosted runner."
            exit 1
          fi

          if ! command -v kind &> /dev/null; then
            echo "Installing kind..."
            curl -Lo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64"
            chmod +x ./kind
            sudo mv ./kind /usr/local/bin/
          fi

          if ! command -v kubectl &> /dev/null; then
            echo "Installing kubectl..."
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi

          if ! command -v helm &> /dev/null; then
            echo "Installing helm..."
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

          if ! command -v kustomize &> /dev/null; then
            echo "Installing kustomize..."
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
          fi

          # Shared deterministic HTTP probe: detached pod + poll + logs —
          # cannot lose stdout on fast-exit containers (k8s attach race:
          # kubernetes#27264, #28695). Sourced by the probe and canary steps.
          cat > /tmp/kubectl_curl.sh <<'KUBECTL_CURL_EOF'
          kubectl_curl() {
            local pod exit_code output phase i
            pod="curl-e2e-$RANDOM-$$"
            if ! kubectl run "$pod" --image=curlimages/curl:latest --restart=Never --quiet \
                 --command -- curl "$@" >/dev/null 2>&1; then
              echo "  ⚠ kubectl run failed to create probe pod $pod" >&2
              return 1
            fi
            phase=""; i=0
            while [ "$i" -lt 90 ]; do
              phase=$(kubectl get pod "$pod" -o jsonpath='{.status.phase}' 2>/dev/null || true)
              case "$phase" in Succeeded|Failed) break ;; esac
              sleep 1; i=$((i + 1))
            done
            if [ "$phase" != "Succeeded" ] && [ "$phase" != "Failed" ]; then
              echo "  ⚠ probe pod $pod did not finish within 90s (phase=$phase)" >&2
              kubectl describe pod "$pod" 2>/dev/null | tail -20 >&2 || true
              kubectl delete pod "$pod" --ignore-not-found --wait=false >/dev/null 2>&1 || true
              return 1
            fi
            exit_code=$(kubectl get pod "$pod" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null)
            [ -n "$exit_code" ] || exit_code=1
            output=$(kubectl logs "$pod" 2>/dev/null || true)
            kubectl delete pod "$pod" --ignore-not-found --wait=false >/dev/null 2>&1 || true
            echo "$output" | awk '
              BEGIN { body=0; saw_header=0 }
              /^pod.*/ { next }
              /^HTTP\// { saw_header=1; next }
              /^< HTTP\// { saw_header=1; next }
              /^< [A-Za-z-]+:/ { saw_header=1; next }
              /^[A-Za-z-]+:/ { saw_header=1; next }
              /^$/ { if (saw_header) { body=1; next } }
              { if (!saw_header || body) print }
            '
            return "$exit_code"
          }
          KUBECTL_CURL_EOF

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate
        run: cargo install cargo-generate --locked

      - name: Install Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Setup Kind cluster
        if: matrix.deploy == 'true'
        run: |
          kind version
          kind delete cluster --name e2e-${{ matrix.scenario }} || true
          kind create cluster --name e2e-${{ matrix.scenario }} --wait 5m

          # Export Kind kubeconfig for subsequent steps
          kind get kubeconfig --name e2e-${{ matrix.scenario }} > /tmp/kind-kubeconfig-${{ matrix.scenario }}
          echo "KUBECONFIG=/tmp/kind-kubeconfig-${{ matrix.scenario }}" >> $GITHUB_ENV

      - name: Generate project from template
        run: |
          # Create template values file
          cat > template-values.toml <<EOF
          [values]
          project_name = "${{ matrix.project_name }}"
          project_author = "E2E Bot <e2e@github.com>"
          feature_s3 = ${{ matrix.feature_s3 }}
          feature_kafka = ${{ matrix.feature_kafka }}
          feature_postgres = ${{ matrix.feature_postgres }}
          feature_flagger = ${{ matrix.feature_flagger }}
          feature_gha_runner = ${{ matrix.feature_gha_runner }}
          event_source_kafka = ${{ matrix.event_source_kafka }}
          enable_image_updates = false
          target_namespace = "default"
          github_org = "test-org"
          github_repo = "test-repo"
          default_branch = "main"
          image_registry = "ghcr.io"
          use_default_scaling = false
          base_min_scale = "1"
          base_max_scale = "10"
          base_target = "100"
          base_cpu_request = "100m"
          base_cpu_limit = "500m"
          base_memory_request = "64Mi"
          base_memory_limit = "256Mi"
          dev_min_scale = "0"
          dev_max_scale = "3"
          dev_cpu_request = "100m"
          dev_cpu_limit = "500m"
          dev_memory_request = "64Mi"
          dev_memory_limit = "256Mi"
          staging_min_scale = "1"
          staging_max_scale = "5"
          staging_cpu_request = "200m"
          staging_cpu_limit = "800m"
          staging_memory_request = "128Mi"
          staging_memory_limit = "384Mi"
          prod_min_scale = "2"
          prod_max_scale = "20"
          prod_cpu_request = "250m"
          prod_cpu_limit = "1000m"
          prod_memory_request = "256Mi"
          prod_memory_limit = "512Mi"
          EOF

          # Append GHA runner variables when feature is enabled
          if [ "${{ matrix.feature_gha_runner }}" = "true" ]; then
            cat >> template-values.toml <<EOF
          gha_runner_chart_version = "0.13.1"
          gha_runner_image_tag = "2.331.0"
          gha_runner_max = "4"
          gha_runner_storage_class = "openebs-hostpath"
          gha_runner_priority_class = "actions-runner-high-priority"
          gha_runner_storage_size = "50Gi"
          EOF
          fi

          # Flagger values (prompted when feature_flagger = true). All three
          # Prometheus URLs use the dev observability address on purpose: the
          # in-cluster Prometheus of this E2E installs at exactly that address.
          if [ "${{ matrix.feature_flagger }}" = "true" ]; then
            cat >> template-values.toml <<EOF
          canary_success_rate_threshold = "99"
          canary_latency_threshold_ms = "500"
          k6_vus = "10"
          flagger_prometheus_url_staging = "http://prometheus.observability.svc.cluster.local:9090"
          flagger_prometheus_url_prod = "http://prometheus.observability.svc.cluster.local:9090"
          flagger_operator_metrics_server = "http://prometheus.observability.svc.cluster.local:9090"
          EOF
          fi

          PROJECT_NAME=$(awk -F'"' '/^project_name =/ {print $2}' template-values.toml)
          SERVICE_NAME=$(echo "$PROJECT_NAME" | tr '_' '-')
          echo "PROJECT_NAME=${PROJECT_NAME}" >> $GITHUB_ENV
          echo "SERVICE_NAME=${SERVICE_NAME}" >> $GITHUB_ENV

                     cargo generate --path . \
            --name "${PROJECT_NAME}" \
            --template-values-file template-values.toml \
            --silent \
            --allow-commands
                     # Move generated project to expected location
          mkdir -p ./generated
          mv ${PROJECT_NAME} ./generated/

      - name: Validate generated project structure
        run: |
          echo "✓ Checkpoint 1: Validating template generation"

          GENERATED_DIR="./generated/${PROJECT_NAME}"

          required_files=(
            "${GENERATED_DIR}/Cargo.toml"
            "${GENERATED_DIR}/src/main.rs"
            "${GENERATED_DIR}/Dockerfile"
            "${GENERATED_DIR}/deploy/base/helmrelease.yaml"
            "${GENERATED_DIR}/deploy/base/kustomization.yaml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
            echo "  ✓ Found: $file"
          done

          echo ""
          echo "Validating YAML syntax..."
          # Note: We can't use kubectl apply --dry-run here because Flux CRDs aren't installed yet
          # The manifests will be validated when actually applied to the cluster later
          if ! yq eval '.' "${GENERATED_DIR}/deploy/base/helmrelease.yaml" > /dev/null 2>&1; then
            echo "❌ YAML syntax validation failed"
            exit 1
          fi
          echo "  ✓ YAML syntax is valid"

          echo "✅ Checkpoint 1 passed: Template generation valid"

      - name: Validate GHA runner files (when enabled)
        if: matrix.feature_gha_runner == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          echo "=== Validating GHA runner file presence ==="

          runner_files=(
            "${GENERATED_DIR}/deploy/infrastructure/gha-runner/oci-repository.yaml"
            "${GENERATED_DIR}/deploy/infrastructure/gha-runner/helmrelease.yaml"
            "${GENERATED_DIR}/deploy/infrastructure/gha-runner/kustomization.yaml"
            "${GENERATED_DIR}/deploy/flux/gha-runner-kustomization.yaml"
          )

          for file in "${runner_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing GHA runner file: $file"
              exit 1
            fi
            echo "  ✓ Found: $file"
          done

          echo ""
          echo "=== Validating GHA runner YAML syntax ==="
          for file in "${runner_files[@]}"; do
            if ! yq eval '.' "$file" > /dev/null 2>&1; then
              echo "❌ Invalid YAML: $file"
              exit 1
            fi
            echo "  ✓ Valid YAML: $(basename "$file")"
          done

          echo ""
          echo "=== Validating GHA runner variable interpolation ==="
          HR="${GENERATED_DIR}/deploy/infrastructure/gha-runner/helmrelease.yaml"
          OCI="${GENERATED_DIR}/deploy/infrastructure/gha-runner/oci-repository.yaml"
          FK="${GENERATED_DIR}/deploy/flux/gha-runner-kustomization.yaml"

          if grep -rq '{{' "${GENERATED_DIR}/deploy/infrastructure/gha-runner/" || \
             grep -q '{{' "$FK"; then
            echo "❌ Raw Liquid template syntax found in generated runner files"
            grep -rn '{{' "${GENERATED_DIR}/deploy/infrastructure/gha-runner/" || true
            grep -n '{{' "$FK" || true
            exit 1
          fi
          echo "  ✓ No raw Liquid template syntax"

          if ! grep -q "githubConfigUrl: https://github.com/test-org/test-repo" "$HR"; then
            echo "❌ githubConfigUrl not interpolated correctly"
            grep "githubConfigUrl" "$HR"
            exit 1
          fi
          echo "  ✓ githubConfigUrl = test-org/test-repo"

          if ! grep -q "maxRunners: 4" "$HR"; then
            echo "❌ maxRunners not interpolated correctly"
            grep "maxRunners" "$HR"
            exit 1
          fi
          echo "  ✓ maxRunners = 4"

          if ! grep -q "storageClassName: openebs-hostpath" "$HR"; then
            echo "❌ storageClassName not interpolated correctly"
            grep "storageClassName" "$HR"
            exit 1
          fi
          echo "  ✓ storageClassName = openebs-hostpath"

          if ! grep -q "priorityClassName: actions-runner-high-priority" "$HR"; then
            echo "❌ priorityClassName not interpolated correctly"
            grep "priorityClassName" "$HR"
            exit 1
          fi
          echo "  ✓ priorityClassName = actions-runner-high-priority"

          if ! grep -q 'tag: "0.13.1"' "$OCI"; then
            echo "❌ Chart version not interpolated correctly"
            grep "tag:" "$OCI"
            exit 1
          fi
          echo "  ✓ chart version = 0.13.1"

          if ! grep -q "actions-runner:2.331.0" "$HR"; then
            echo "❌ Runner image tag not interpolated correctly"
            grep "actions-runner" "$HR"
            exit 1
          fi
          echo "  ✓ runner image tag = 2.331.0"

          if ! grep -q "storage: 50Gi" "$HR"; then
            echo "❌ Storage size not interpolated correctly"
            grep "storage:" "$HR"
            exit 1
          fi
          echo "  ✓ storage size = 50Gi"

          RUNNER_NAME="${SERVICE_NAME}-runner"
          if ! grep -q "name: &name ${RUNNER_NAME}" "$HR"; then
            echo "❌ YAML anchor name not set correctly"
            grep "name:.*&name" "$HR" || echo "No anchor found"
            exit 1
          fi
          echo "  ✓ YAML anchor = ${RUNNER_NAME}"

          if ! grep -q "name: ${RUNNER_NAME}" "$FK"; then
            echo "❌ Flux Kustomization name not interpolated correctly"
            grep "name:" "$FK"
            exit 1
          fi
          echo "  ✓ Flux Kustomization name = ${RUNNER_NAME}"

          echo ""
          echo "=== Validating kustomize build ==="
          kustomize build "${GENERATED_DIR}/deploy/infrastructure/gha-runner/" > /dev/null 2>&1 && \
            echo "  ✓ kustomize build succeeded" || \
            echo "  ⚠ kustomize build failed (expected — CRDs not installed)"

          echo ""
          echo "=== Validating generated CI/CD workflows use self-hosted runner ==="
          CI_YAML="${GENERATED_DIR}/.github/workflows/ci.yaml"
          RELEASE_YAML="${GENERATED_DIR}/.github/workflows/release.yaml"

          for wf in "$CI_YAML" "$RELEASE_YAML"; do
            if [[ ! -f "$wf" ]]; then
              echo "  ⚠ Workflow not found: $wf (skipping)"
              continue
            fi
            if grep -q "runs-on: ${RUNNER_NAME}" "$wf"; then
              echo "  ✓ $(basename "$wf") uses runs-on: ${RUNNER_NAME}"
            else
              echo "❌ $(basename "$wf") does not use self-hosted runner"
              grep "runs-on:" "$wf"
              exit 1
            fi
            if grep -q "runs-on: ubuntu-latest" "$wf"; then
              echo "❌ $(basename "$wf") still contains runs-on: ubuntu-latest"
              grep -n "runs-on: ubuntu-latest" "$wf"
              exit 1
            fi
            echo "  ✓ $(basename "$wf") has no ubuntu-latest references"
          done

          echo ""
          echo "✅ GHA runner validation passed"

      - name: Validate GHA runner files absent (when disabled)
        if: matrix.feature_gha_runner != 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          echo "=== Verifying GHA runner files are absent ==="

          absent_paths=(
            "${GENERATED_DIR}/deploy/infrastructure/gha-runner"
            "${GENERATED_DIR}/deploy/flux/gha-runner-kustomization.yaml"
          )

          for path in "${absent_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "❌ GHA runner path should not exist: $path"
              exit 1
            fi
            echo "  ✓ Absent: $path"
          done

          echo "✅ GHA runner files correctly excluded"

      - name: Validate workflows use ubuntu-latest (when runner disabled)
        if: matrix.feature_gha_runner != 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          echo "=== Verifying generated workflows use ubuntu-latest ==="
          CI_YAML="${GENERATED_DIR}/.github/workflows/ci.yaml"
          RELEASE_YAML="${GENERATED_DIR}/.github/workflows/release.yaml"

          for wf in "$CI_YAML" "$RELEASE_YAML"; do
            if [[ ! -f "$wf" ]]; then
              echo "  ⚠ Workflow not found: $wf (skipping)"
              continue
            fi
            if ! grep -q "runs-on: ubuntu-latest" "$wf"; then
              echo "❌ $(basename "$wf") should use runs-on: ubuntu-latest"
              grep "runs-on:" "$wf"
              exit 1
            fi
            echo "  ✓ $(basename "$wf") uses runs-on: ubuntu-latest"
          done

          echo "✅ Workflow runner labels verified"

      - name: Set image tags
        if: matrix.deploy == 'true'
        id: image-meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="main"
          fi

          RUN_NUMBER="${{ github.run_number }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          IMAGE_TAG="pr-${PR_NUMBER}-run-${RUN_NUMBER}-${SHORT_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "app_image=${{ env.REGISTRY }}/${{ github.repository }}/${SERVICE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "manifest_image=${{ env.REGISTRY }}/${{ github.repository }}/manifests-${PROJECT_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

          echo "📦 Using image tag: ${IMAGE_TAG}"

      - name: Log in to GHCR
        if: matrix.deploy == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build application image
        if: matrix.deploy == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          docker build \
            -t ${{ steps.image-meta.outputs.app_image }} \
            "${GENERATED_DIR}"

      - name: Push application image to GHCR
        if: matrix.deploy == 'true'
        run: |
          docker push ${{ steps.image-meta.outputs.app_image }}

      - name: Load image into Kind
        if: matrix.deploy == 'true'
        run: |
          kind load docker-image \
            ${{ steps.image-meta.outputs.app_image }} \
            --name e2e-${{ matrix.scenario }}

      - name: Validate application image in GHCR
        if: matrix.deploy == 'true'
        run: |
          echo "✓ Checkpoint 2: Validating application image"

          docker manifest inspect ${{ steps.image-meta.outputs.app_image }} > /dev/null 2>&1 || {
            echo "❌ Image not found in GHCR"
            exit 1
          }

          echo "✅ Checkpoint 2 passed: Application image verified in GHCR"

      - name: Prepare manifests for OCI push
        if: matrix.deploy == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"
          CHART_DIR="${GENERATED_DIR}/deploy/chart"
          NEW_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${SERVICE_NAME}"
          NEW_TAG="${{ steps.image-meta.outputs.image_tag }}"

          helm dependency build "${CHART_DIR}"

          yq eval -i '
            .spec.values.services[""].image.repository = "'"${NEW_IMAGE}"'" |
            .spec.values.services[""].image.tag = "'"${NEW_TAG}"'"
          ' "${GENERATED_DIR}/deploy/base/helmrelease.yaml"

          VALUES_FILE=$(mktemp)
          yq eval '.spec.values' "${GENERATED_DIR}/deploy/base/helmrelease.yaml" > "${VALUES_FILE}"

          mkdir -p "${GENERATED_DIR}/manifests-built"

          helm template "${SERVICE_NAME}" "${CHART_DIR}" \
            -f "${VALUES_FILE}" \
            -n default \
            | yq eval '
              (select(.kind == "Service" and .apiVersion == "serving.knative.dev/v1") |
                .spec.template.spec.imagePullSecrets) = [{"name": "ghcr-auth"}]
            ' - > "${GENERATED_DIR}/manifests-built/all.yaml"

          rm -f "${VALUES_FILE}"

          echo "::group::Built manifests"
          cat "${GENERATED_DIR}/manifests-built/all.yaml"
          echo "::endgroup::"

      - name: Validate image transformation
        if: matrix.deploy == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          EXPECTED_IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/${SERVICE_NAME}:${{ steps.image-meta.outputs.image_tag }}"

          echo "Validating image transformation..."
          echo "Expected image: ${EXPECTED_IMAGE}"

          if ! grep -q "${EXPECTED_IMAGE}" "${GENERATED_DIR}/manifests-built/all.yaml"; then
            echo "❌ Image transformation failed"
            echo ""
            echo "Expected to find: ${EXPECTED_IMAGE}"
            echo ""
            echo "Actual image references in manifest:"
            grep "image:" "${GENERATED_DIR}/manifests-built/all.yaml" || echo "No image references found"
            exit 1
          fi

          echo "✅ Image transformation verified: ${EXPECTED_IMAGE}"

      - name: Push manifests as OCI artifact
        if: matrix.deploy == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          flux push artifact \
            oci://${{ steps.image-meta.outputs.manifest_image }} \
            --path "${GENERATED_DIR}/manifests-built" \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ github.sha }}"

      - name: Validate OCI artifact in GHCR
        if: matrix.deploy == 'true'
        run: |
          echo "✓ Checkpoint 3: Validating OCI artifact"

          mkdir -p ./oci-verify
          # GHCR is occasionally not immediately consistent after a push
          # (MANIFEST_UNKNOWN right after a 201) — retry the pull.
          PULL_OK=0
          for i in 1 2 3 4 5; do
            if flux pull artifact \
              oci://${{ steps.image-meta.outputs.manifest_image }} \
              --output ./oci-verify; then
              PULL_OK=1
              break
            fi
            echo "  ⚠ artifact pull attempt $i failed (GHCR propagation delay?) — retrying in 5s"
            sleep 5
          done
          [ "$PULL_OK" = "1" ] || {
            echo "❌ OCI artifact not retrievable after 5 attempts"
            exit 1
          }

          if [[ ! -f "./oci-verify/all.yaml" ]]; then
            echo "❌ OCI artifact missing all.yaml"
            exit 1
          fi

          echo "✅ Checkpoint 3 passed: OCI artifact verified"

          echo "::group::Artifact contents"
          ls -la ./oci-verify/
          echo "::endgroup::"

      - name: Install Flux controllers
        if: matrix.deploy == 'true'
        run: |
          flux install

          kubectl wait --for=condition=available \
            --timeout=180s \
            -n flux-system \
            deployment/source-controller \
            deployment/kustomize-controller

      - name: Install Knative Serving
        if: matrix.deploy == 'true'
        run: |
          KNATIVE_VERSION="knative-v1.20.0"

          kubectl apply -f https://github.com/knative/serving/releases/download/${KNATIVE_VERSION}/serving-crds.yaml

          kubectl apply -f https://github.com/knative/serving/releases/download/${KNATIVE_VERSION}/serving-core.yaml

          kubectl apply -f https://github.com/knative/net-kourier/releases/download/${KNATIVE_VERSION}/kourier.yaml

          kubectl patch configmap/config-network \
            --namespace knative-serving \
            --type merge \
            --patch '{"data":{"ingress-class":"kourier.ingress.networking.knative.dev"}}'

          kubectl wait --for=condition=available \
            --timeout=300s \
            -n knative-serving \
            deployment/activator \
            deployment/autoscaler \
            deployment/controller \
            deployment/webhook

      - name: Install Observability (canary prerequisites)
        if: matrix.feature_flagger == 'true' && matrix.deploy == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          # The canary metric gates need Prometheus scraping the kourier
          # gateway (annotation-based job in the dev observability config).
          kubectl apply -k "${GENERATED_DIR}/deploy/dev/observability"

          kubectl wait --for=condition=available \
            --timeout=300s \
            -n observability \
            deployment/prometheus deployment/jaeger deployment/otel-collector

      - name: Install Flagger operator (canary test)
        if: matrix.feature_flagger == 'true' && matrix.deploy == 'true'
        run: |
          GENERATED_DIR="./generated/${PROJECT_NAME}"

          # Operator + loadtester install through the project's own Flux
          # HelmReleases (chart >= 1.41.0, meshProvider: knative). The
          # deployments are created asynchronously by helm-controller — poll
          # for existence first (kubectl wait errors instantly on missing
          # resources), then wait for availability.
          kubectl apply -k "${GENERATED_DIR}/deploy/infrastructure/flagger/operator"

          for i in $(seq 1 60); do
            if kubectl get deployment/flagger deployment/flagger-loadtester \
                 -n flagger-system >/dev/null 2>&1; then break; fi
            sleep 5
          done
          kubectl wait --for=condition=available \
            --timeout=600s \
            -n flagger-system \
            deployment/flagger deployment/flagger-loadtester \
            || {
              echo "❌ Flagger stack did not become ready"
              kubectl get helmreleases,helmrepositories -A
              kubectl get pods -n flagger-system
              kubectl describe helmrelease/flagger -n flagger-system | tail -20
              kubectl logs -n flux-system deployment/helm-controller --tail=30
              exit 1
            }

          kubectl rollout status deploy/flagger -n flagger-system --timeout=120s
          kubectl rollout status deploy/flagger-loadtester -n flagger-system --timeout=120s
          echo "✓ Flagger operator + loadtester ready"

      - name: Install Redis
        if: matrix.deploy == 'true'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

          helm install redis bitnami/redis \
            --set auth.enabled=false \
            --set architecture=standalone \
            --wait \
            --timeout 120s

      - name: Install MinIO (if needed)
        if: matrix.feature_s3 == 'true' && matrix.deploy == 'true'
        run: |
          helm repo add minio https://charts.min.io/
          helm repo update

          helm install minio minio/minio \
            --set replicas=1 \
            --set mode=standalone \
            --set resources.requests.memory=256Mi \
            --set rootUser=minioadmin \
            --set rootPassword=minioadmin \
            --wait \
            --timeout 180s

          # Ensure expected bucket exists for tests
          kubectl wait --for=condition=ready pod -l release=minio --timeout=120s
          kubectl run minio-mc --rm -i --restart=Never --timeout=120s \
            --image=quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z \
            --command -- /bin/sh -c \
            "mc alias set minio http://minio.default.svc.cluster.local:9000 minioadmin minioadmin && mc mb -p minio/data"

      - name: Validate cluster dependencies
        if: matrix.deploy == 'true'
        run: |
          echo "✓ Checkpoint 4: Validating cluster dependencies"

          echo "Checking Flux..."
          flux check || { echo "❌ Flux check failed"; exit 1; }
          echo "  ✓ Flux healthy"

          echo ""
          echo "Checking Knative..."
          kubectl get pods -n knative-serving -o wide
          kubectl wait --for=condition=ready pod \
            -l app=activator \
            -n knative-serving \
            --timeout=60s || { echo "❌ Knative not ready"; exit 1; }
          echo "  ✓ Knative healthy"

          echo ""
          echo "Checking Redis..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=redis \
            --timeout=60s || { echo "❌ Redis not ready"; exit 1; }
          echo "  ✓ Redis healthy"

          if [ "${{ matrix.feature_s3 }}" = "true" ]; then
            echo ""
            echo "Checking MinIO..."
            kubectl wait --for=condition=ready pod \
              -l app=minio \
              --timeout=60s || { echo "❌ MinIO not ready"; exit 1; }
            echo "  ✓ MinIO healthy"
          fi

          if [ "${{ matrix.feature_flagger }}" = "true" ]; then
            echo ""
            echo "Checking Prometheus + Flagger stack..."
            kubectl wait --for=condition=ready pod \
              -l app=prometheus \
              -n observability \
              --timeout=60s || { echo "❌ Prometheus not ready"; exit 1; }
            kubectl rollout status deployment/flagger-loadtester \
              -n flagger-system --timeout=60s \
              || { echo "❌ Flagger loadtester not ready"; exit 1; }
            echo "  ✓ Observability + Flagger healthy"
          fi

          echo "✅ Checkpoint 4 passed: All cluster dependencies healthy"

      - name: Create application secrets
        if: matrix.deploy == 'true'
        run: |
          if [ "${{ matrix.feature_s3 }}" = "true" ]; then
            kubectl create secret generic ${SERVICE_NAME}-secrets \
              --from-literal=redis-url=redis://redis-master:6379 \
              --from-literal=aws-access-key-id=minioadmin \
              --from-literal=aws-secret-access-key=minioadmin \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            kubectl create secret generic ${SERVICE_NAME}-secrets \
              --from-literal=redis-url=redis://redis-master:6379 \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Create GHCR pull secret for Flux and default namespace
        if: matrix.deploy == 'true'
        run: |
          # Create pull secret in flux-system namespace (for OCI artifact pulls)
          kubectl create secret docker-registry ghcr-auth \
            --namespace=flux-system \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Create pull secret in default namespace (for application image pulls)
          kubectl create secret docker-registry ghcr-auth \
            --namespace=default \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy OCIRepository and Kustomization
        if: matrix.deploy == 'true'
        run: |
          cat <<EOF | kubectl apply -f -
          ---
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: OCIRepository
          metadata:
            name: ${PROJECT_NAME}
            namespace: flux-system
          spec:
            interval: 1m
            url: oci://${{ env.REGISTRY }}/${{ github.repository }}/manifests-${PROJECT_NAME}
            ref:
              tag: "${{ steps.image-meta.outputs.image_tag }}"
            secretRef:
              name: ghcr-auth
          ---
          apiVersion: kustomize.toolkit.fluxcd.io/v1
          kind: Kustomization
          metadata:
            name: ${PROJECT_NAME}
            namespace: flux-system
          spec:
            interval: 1m
            sourceRef:
              kind: OCIRepository
              name: ${PROJECT_NAME}
            path: ./
            prune: true
            targetNamespace: default
            wait: true
            timeout: 5m
          EOF

      - name: Wait for Flux reconciliation
        if: matrix.deploy == 'true'
        run: |
          echo "Waiting for OCIRepository to be ready..."
          kubectl wait --for=condition=ready \
            --timeout=180s \
            -n flux-system \
            ocirepository/${PROJECT_NAME} || {
              echo "❌ OCIRepository failed to become ready"
              kubectl describe ocirepository/${PROJECT_NAME} -n flux-system
              exit 1
            }

          echo "Waiting for Kustomization to be ready..."
          kubectl wait --for=condition=ready \
            --timeout=300s \
            -n flux-system \
            kustomization/${PROJECT_NAME} || {
              echo "❌ Kustomization failed to become ready"
              kubectl describe kustomization/${PROJECT_NAME} -n flux-system
              exit 1
            }

          echo "✓ Flux reconciliation complete"

      - name: Validate application deployment
        if: matrix.deploy == 'true'
        run: |
          echo "✓ Checkpoint 5: Validating application deployment"

          SERVICE_NAME="${SERVICE_NAME}"

          echo "Checking Flux resource status..."
          flux get all -A

          echo ""
          echo "Checking deployed resources..."
          kubectl get all -n default

          echo ""
          echo "Waiting for Knative Service to be ready..."
          kubectl wait --for=condition=ready \
            --timeout=300s \
            ksvc/${SERVICE_NAME} || {
              echo "❌ Knative Service not ready"
              kubectl describe ksvc/${SERVICE_NAME}
              kubectl logs -l serving.knative.dev/service=${SERVICE_NAME} --tail=100
              exit 1
            }

          echo "✅ Checkpoint 5 passed: Application deployed and ready"

      - name: Run Flagger canary promotion test
        if: matrix.feature_flagger == 'true' && matrix.deploy == 'true'
        run: |
          set -euo pipefail
          GENERATED_DIR="./generated/${PROJECT_NAME}"
          source /tmp/kubectl_curl.sh

          # Flux re-applies the rendered manifests every 1m and would revert
          # manual KnativeService template changes. Suspend the app
          # Kustomization so revision bumps stick during the canary test.
          flux suspend kustomization ${PROJECT_NAME} -n flux-system

          # Render the canary surface exactly as the staging overlay applies
          # it: component + namespace transformer + the MetricTemplate address
          # patch pulled verbatim from the generated overlay (yq), plus
          # CI-speed analysis params (shipped canary.yaml keeps production
          # defaults). The extracted address is the dev observability URL,
          # which is where the E2E Prometheus actually runs.
          CANARY_TMP="${GENERATED_DIR}/deploy/overlays/.canary-e2e"
          rm -rf "$CANARY_TMP" && mkdir -p "$CANARY_TMP"
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "namespace: default"
            echo "components:"
            echo "  - ../../components/flagger"
            echo "patches:"
            yq eval '.patches | map(select(.target.kind == "MetricTemplate"))' \
              "${GENERATED_DIR}/deploy/overlays/staging/kustomization.yaml" | sed 's/^/  /'
            cat <<'PATCH'
            - target:
                kind: Canary
              patch: |-
                - op: replace
                  path: /spec/analysis/interval
                  value: 30s
                - op: replace
                  path: /spec/analysis/stepWeight
                  value: 50
                - op: replace
                  path: /spec/analysis/maxWeight
                  value: 50
                - op: replace
                  path: /spec/analysis/threshold
                  value: 1
                - op: replace
                  path: /spec/progressDeadlineSeconds
                  value: 600
          PATCH
          } > "$CANARY_TMP/kustomization.yaml"
          kustomize build "$CANARY_TMP" > /tmp/canary-rendered.yaml
          grep -E '^kind:|prometheus' /tmp/canary-rendered.yaml | head -8 || true
          kubectl apply -f /tmp/canary-rendered.yaml
          rm -rf "$CANARY_TMP"

          echo ""
          echo "Waiting for the canary to be Initialized (Flagger adopts the KSvc)..."
          PHASE=""
          for i in $(seq 1 60); do
            PHASE=$(kubectl get canary ${SERVICE_NAME} -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            [ "$PHASE" = "Initialized" ] && break
            sleep 5
          done
          [ "$PHASE" = "Initialized" ] || {
            echo "❌ Canary never reached Initialized (phase: '$PHASE')"
            kubectl describe canary ${SERVICE_NAME} || true
            kubectl logs -n flagger-system deploy/flagger --tail=60 || true
            exit 1
          }
          # Knative provider: no <svc>-primary KSvc — the primary is pinned via
          # the flagger.app/primary-revision annotation on the target service.
          PRIMARY_REV=$(kubectl get ksvc ${SERVICE_NAME} \
            -o jsonpath='{.metadata.annotations.flagger\.app/primary-revision}')
          [ -n "$PRIMARY_REV" ] || {
            echo "❌ flagger.app/primary-revision annotation missing"
            kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '.metadata.annotations' -
            kubectl logs -n flagger-system deploy/flagger --tail=60 || true
            exit 1
          }
          echo "✓ Canary Initialized — primary revision pinned: ${PRIMARY_REV}"

          # Preflight: the builtin Knative gates query Kourier gateway Envoy
          # stats (via the operator's metrics server) — verify the gateway
          # actually serves them.
          GW_POD=$(kubectl get pods -n kourier-system -l app=kourier-gateway \
            -o jsonpath='{.items[0].metadata.name}')
          GW_IP=$(kubectl get pod "$GW_POD" -n kourier-system -o jsonpath='{.status.podIP}')
          GW_STATS=$(kubectl_curl -s "http://${GW_IP}:9000/stats/prometheus" || true)
          if ! echo "$GW_STATS" | grep -q 'envoy_cluster_upstream_rq'; then
            echo "❌ kourier gateway :9000/stats/prometheus serves no envoy_cluster_upstream_rq — builtin gates would have no data"
            echo "$GW_STATS" | head -20 || true
            exit 1
          fi
          echo "✓ kourier gateway serves Envoy cluster stats (gate data source verified)"

          # Trigger v2: a pod-template annotation change creates a new revision.
          kubectl patch ksvc ${SERVICE_NAME} --type merge \
            -p '{"spec":{"template":{"metadata":{"annotations":{"e2e.test/rev":"v2"}}}}}'
          echo ""
          echo "Waiting for canary analysis (interval 30s, single 50% step, k6 load test per step)..."
          PHASE=""; WEIGHT="0"
          for i in $(seq 1 60); do
            PHASE=$(kubectl get canary ${SERVICE_NAME} -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            WEIGHT=$(kubectl get canary ${SERVICE_NAME} -o jsonpath='{.status.canaryWeight}' 2>/dev/null || echo "?")
            echo "  phase=${PHASE} canaryWeight=${WEIGHT}"
            [ "$PHASE" = "Succeeded" ] && break
            [ "$PHASE" = "Failed" ] && break
            sleep 15
          done
          [ "$PHASE" = "Succeeded" ] || {
            echo "❌ Canary promotion failed (phase: '$PHASE')"
            kubectl describe canary ${SERVICE_NAME} || true
            kubectl logs -n flagger-system deploy/flagger --tail=120 || true
            kubectl logs -n flagger-system deploy/flagger-loadtester --tail=60 || true
            exit 1
          }
          # Promotion advances the pinned primary to the canary revision and
          # consolidates traffic on it.
          PRIMARY_REV2=$(kubectl get ksvc ${SERVICE_NAME} \
            -o jsonpath='{.metadata.annotations.flagger\.app/primary-revision}')
          [ "$PRIMARY_REV2" != "$PRIMARY_REV" ] || {
            echo "❌ promotion did not advance the primary revision (still ${PRIMARY_REV2})"
            exit 1
          }
          ROUTES=$(kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '[.status.traffic[] | select(.percent > 0)] | length' -)
          TOP_PCT=$(kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '[.status.traffic[].percent] | max' -)
          [ "$ROUTES" = "1" ] && [ "$TOP_PCT" = "100" ] || {
            echo "❌ traffic not consolidated after promotion"
            kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '.status.traffic' -
            exit 1
          }
          echo "✅ Checkpoint 6 passed: Canary promoted (primary=${PRIMARY_REV2})"
          echo "PROMOTED_REV=${PRIMARY_REV2}" >> "$GITHUB_ENV"

      - name: Run Flagger rollback test
        if: matrix.feature_flagger == 'true' && matrix.deploy == 'true'
        run: |
          set -euo pipefail
          source /tmp/kubectl_curl.sh

          # Make the custom-metric gate deterministically failing: the
          # placeholder query returns vector(0), so with min=2 every analysis
          # step fails and threshold=1 triggers an immediate rollback.
          kubectl patch canary ${SERVICE_NAME} --type=json \
            -p='[{"op":"replace","path":"/spec/analysis/metrics/2/thresholdRange/min","value":2}]'

          # Trigger v3.
          kubectl patch ksvc ${SERVICE_NAME} --type merge \
            -p '{"spec":{"template":{"metadata":{"annotations":{"e2e.test/rev":"v3"}}}}}'
          echo ""
          echo "Waiting for the canary to fail and roll back to primary..."
          PHASE=""
          for i in $(seq 1 60); do
            PHASE=$(kubectl get canary ${SERVICE_NAME} -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
            echo "  phase=${PHASE}"
            [ "$PHASE" = "Failed" ] && break
            if [ "$PHASE" = "Succeeded" ]; then
              echo "❌ Rollback test unexpectedly succeeded — the failing gate did not fail"
              exit 1
            fi
            sleep 15
          done
          [ "$PHASE" = "Failed" ] || {
            echo "❌ Canary never reached Failed (phase: '$PHASE')"
            kubectl describe canary ${SERVICE_NAME} || true
            kubectl logs -n flagger-system deploy/flagger --tail=120 || true
            exit 1
          }

          # Rollback semantics: the promoted primary stays pinned and traffic
          # consolidates on it.
          PINNED=$(kubectl get ksvc ${SERVICE_NAME} \
            -o jsonpath='{.metadata.annotations.flagger\.app/primary-revision}')
          [ "$PINNED" = "$PROMOTED_REV" ] || {
            echo "❌ primary revision changed after rollback (pinned: ${PINNED}, promoted: ${PROMOTED_REV})"
            exit 1
          }
          ROUTES=$(kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '[.status.traffic[] | select(.percent > 0)] | length' -)
          TOP_PCT=$(kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '[.status.traffic[].percent] | max' -)
          echo "Traffic routes >0%: ${ROUTES}, top percent: ${TOP_PCT}"
          [ "$ROUTES" = "1" ] && [ "$TOP_PCT" = "100" ] || {
            echo "❌ Traffic not restored to primary after rollback"
            kubectl get ksvc ${SERVICE_NAME} -o json | yq eval '.status.traffic' -
            exit 1
          }
          echo "✅ Checkpoint 7 passed: Rollback verified (phase=Failed, traffic restored to primary)"

      - name: Get application URL
        if: matrix.deploy == 'true'
        id: app-url
        run: |
          SERVICE_NAME="${SERVICE_NAME}"
          SERVICE_URL=$(kubectl get ksvc ${SERVICE_NAME} -o jsonpath='{.status.url}')
          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "📡 Service URL: ${SERVICE_URL}"

      - name: Run E2E tests
        if: matrix.deploy == 'true'
        env:
          SERVICE_URL: ${{ steps.app-url.outputs.service_url }}
        run: |
          echo "Running E2E tests against: ${SERVICE_URL}"

          # Deterministic HTTP probe (shared helper written by the
          # dependencies-install step): detached pod + poll + logs — cannot
          # lose stdout on fast-exit containers.
          source /tmp/kubectl_curl.sh

          FAILED=0

          echo ""
          echo "Test: Liveness probe..."
          if kubectl_curl -f -s "${SERVICE_URL}/health/live" > /dev/null 2>&1; then
            echo "  ✓ Liveness probe PASSED"
          else
            echo "  ✗ Liveness probe FAILED"
            ((FAILED++))
          fi

          echo ""
          echo "Test: Readiness probe..."
          if kubectl_curl -f -s "${SERVICE_URL}/health/ready" > /dev/null 2>&1; then
            echo "  ✓ Readiness probe PASSED"
          else
            echo "  ✗ Readiness probe FAILED"
            ((FAILED++))
          fi

          echo ""
          echo "Test: Prometheus metrics..."
          METRICS_OUTPUT=$(kubectl_curl -f -s "${SERVICE_URL}/metrics")
          if echo "$METRICS_OUTPUT" | grep -q '# HELP' && echo "$METRICS_OUTPUT" | grep -q '# TYPE'; then
            echo "  ✓ Metrics endpoint PASSED (Prometheus format detected)"
          else
            echo "  ✗ Metrics endpoint FAILED (no Prometheus metrics found)"
            echo "  Output preview: $(echo "$METRICS_OUTPUT" | head -5)"
            ((FAILED++))
          fi

          echo ""
          echo "Test: Hello API..."
          # Try with verbose output first to diagnose the issue
          echo "  Debug: Testing with verbose curl..."
          VERBOSE_OUTPUT=$(kubectl run curl-debug-$RANDOM --image=curlimages/curl:latest --rm -i --restart=Never --quiet -- curl -v -s "${SERVICE_URL}/api/v1/hello" 2>&1 || true)
          echo "  Debug: Verbose output (first 500 chars):"
          echo "$VERBOSE_OUTPUT" | head -c 500
          echo ""

          RESPONSE=$(kubectl_curl -s "${SERVICE_URL}/api/v1/hello")
          CURL_EXIT=$?
          echo "  Debug: curl exit code=$CURL_EXIT"
          echo "  Debug: response length=${#RESPONSE}"
          echo "  Debug: response preview: $(echo "$RESPONSE" | head -c 200)"
          if echo "$RESPONSE" | grep -q '"message"'; then
            echo "  ✓ Hello API PASSED"
          else
            echo "  ✗ Hello API FAILED"
            echo "  Full response: $RESPONSE"
            ((FAILED++))
          fi

          if [ "${{ matrix.feature_s3 }}" = "true" ]; then
            echo ""
            echo "Test: S3 storage example..."
            echo "  Debug: Testing with verbose curl..."
            VERBOSE_OUTPUT=$(kubectl run curl-debug-$RANDOM --image=curlimages/curl:latest --rm -i --restart=Never --quiet -- curl -v -s -X POST "${SERVICE_URL}/api/v1/storage/example" 2>&1 || true)
            echo "  Debug: Verbose output (first 500 chars):"
            echo "$VERBOSE_OUTPUT" | head -c 500
            echo ""

            RESPONSE=$(kubectl_curl -s -X POST "${SERVICE_URL}/api/v1/storage/example")
            CURL_EXIT=$?
            echo "  Debug: curl exit code=$CURL_EXIT"
            echo "  Debug: response length=${#RESPONSE}"
            echo "  Debug: response preview: $(echo "$RESPONSE" | head -c 200)"

            if echo "$RESPONSE" | grep -q '"success":true' && \
               echo "$RESPONSE" | grep -q '"read_verified":true'; then
              echo "  ✓ S3 storage PASSED"
            else
              echo "  ✗ S3 storage FAILED"
              echo "  Response: $RESPONSE"
              ((FAILED++))
            fi
          fi

          echo ""
          echo "======================================"
          if [ $FAILED -eq 0 ]; then
            echo "✅ All tests PASSED for scenario: ${{ matrix.scenario }}"
          else
            echo "❌ ${FAILED} test(s) FAILED for scenario: ${{ matrix.scenario }}"
            exit 1
          fi
          echo "======================================"

      - name: Final validation summary
        if: always() && matrix.deploy == 'true'
        run: |
          echo "✓ Checkpoint 6: Final validation summary"
          echo "============================================"
          echo "           E2E Test Summary"
          echo "============================================"
          echo "Scenario: ${{ matrix.scenario }}"
          echo "Image: ${{ steps.image-meta.outputs.app_image }}"
          echo "Manifest: ${{ steps.image-meta.outputs.manifest_image }}"
          echo ""
          echo "Cluster state:"
          kubectl get pods -A | grep -v kube-system || true
          echo ""
          echo "Flux resources:"
          flux get all -A || true
          echo "============================================"

      - name: Collect debug information on failure
        if: failure() && matrix.deploy == 'true'
        run: |
          SERVICE_NAME="${SERVICE_NAME}"

          echo "::group::Flux logs"
          kubectl logs -n flux-system deployment/source-controller --tail=100 || true
          kubectl logs -n flux-system deployment/kustomize-controller --tail=100 || true
          echo "::endgroup::"

          echo "::group::Application logs"
          kubectl logs -l serving.knative.dev/service=${SERVICE_NAME} --tail=100 || true
          echo "::endgroup::"

          echo "::group::All pods"
          kubectl get pods -A -o wide
          echo "::endgroup::"

          echo "::group::Events"
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50
          echo "::endgroup::"
