apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Standalone Flux image-update resources for this service. They live in
# flux-system and are registered by the project's
# deploy/flux/config/<env>/kustomization.yaml when image updates are enabled.
# This directory is never included from the app overlays: their namespace
# transformer would move the objects out of flux-system.
resources:
  - flux-image-repository.yaml
  - flux-image-policy.yaml
