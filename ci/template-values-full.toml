[values]
project_name = "test-app-full"
project_author = "CI Bot <ci@github.com>"
feature_s3 = true
feature_kafka = true
feature_postgres = true
feature_flagger = true
feature_gha_runner = true
feature_cluster_smoke = true
smoke_environment = "staging"
event_source_kafka = true
feature_cron = true
enable_image_updates = false
target_namespace = "default"
github_org = "enchantednatures"
github_repo = "rust-knative-flux-template"
default_branch = "main"
image_registry = "ghcr.io"
use_default_scaling = false
base_min_scale = "1"
base_max_scale = "10"
base_target = "100"
base_cpu_request = "100m"
base_cpu_limit = "500m"
base_memory_request = "64Mi"
base_memory_limit = "256Mi"
dev_min_scale = "0"
dev_max_scale = "3"
dev_cpu_request = "100m"
dev_cpu_limit = "500m"
dev_memory_request = "64Mi"
dev_memory_limit = "256Mi"
staging_min_scale = "1"
staging_max_scale = "5"
staging_cpu_request = "200m"
staging_cpu_limit = "800m"
staging_memory_request = "128Mi"
staging_memory_limit = "384Mi"
prod_min_scale = "2"
prod_max_scale = "20"
prod_cpu_request = "250m"
prod_cpu_limit = "1000m"
prod_memory_request = "256Mi"
prod_memory_limit = "512Mi"
gha_runner_chart_version = "0.13.1"
gha_runner_image_tag = "2.331.0"
gha_runner_max = "4"
gha_runner_storage_class = "openebs-hostpath"
gha_runner_priority_class = "actions-runner-high-priority"
gha_runner_storage_size = "50Gi"
canary_success_rate_threshold = "99"
canary_latency_threshold_ms = "500"
flagger_prometheus_url_staging = "http://prometheus.observability.svc.cluster.local:9090"
flagger_prometheus_url_prod = "http://prometheus.observability.svc.cluster.local:9090"
flagger_operator_metrics_server = "http://prometheus.observability.svc.cluster.local:9090"
postgres_version = "18"
postgres_instances_dev = "1"
postgres_instances_staging = "2"
postgres_instances_prod = "3"
postgres_pooler = "true"
postgres_pooler_instances_dev = "1"
postgres_pooler_instances_staging = "2"
postgres_pooler_instances_prod = "4"
postgres_storage_class = "standard"
backup_schedule = "0 2 * * *"
backup_retention_dev = "7"
backup_retention_staging = "14"
backup_retention_prod = "30"
ceph_rgw_endpoint_dev = "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80"
ceph_rgw_endpoint_staging = "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
ceph_rgw_endpoint_prod = "https://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:443"
ceph_bucket_storage_class = "ceph-bucket"
kafka_broker_url = "kafka.kafka.svc.cluster.local:9092"
kafka_topic = "events"
kafka_bootstrap_servers_staging = "kafka.staging.svc.cluster.local:9092"
kafka_bootstrap_servers_prod = "kafka.prod.svc.cluster.local:9092"
cron_schedule = "0 * * * *"
cron_timezone = "UTC"
cron_payload = '{"message":"generated"}'
git_auth_secret = "test-git-auth"
image_pull_secret = "test-pull-secret"
custom_domain = "test-app-full.example.com"
network_policy_allow_all = true
