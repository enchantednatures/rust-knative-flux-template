apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: audio-exporter-postgres-metrics
  namespace: default
  labels:
    app: audio-exporter-postgres
    release: prometheus  # For Prometheus Operator ServiceMonitor selection
spec:
  # Select PostgreSQL pods
  selector:
    matchLabels:
      postgresql: audio-exporter-postgres  # Matches pods from CloudNativePG cluster
  
  # Pod port configuration
  podMetricsEndpoints:
    - port: metrics  # CloudNativePG metrics port (default 9187)
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
  
  # Namespace selector (optional, defaults to same namespace)
  namespaceSelector:
    matchNames:
      - default

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-operator-metrics
  namespace: cnpg-system
  labels:
    app: cnpg-operator
    release: prometheus
spec:
  # Select CloudNativePG operator pods
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  
  # Operator metrics endpoint
  podMetricsEndpoints:
    - port: metrics  # Operator metrics port (default 8080)
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
  
  # CloudNativePG operator runs in cnpg-system namespace
  namespaceSelector:
    matchNames:
      - cnpg-system
