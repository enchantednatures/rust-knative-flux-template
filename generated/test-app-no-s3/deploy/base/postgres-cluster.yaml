apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test-app-postgres
  namespace: default
spec:
  instances: 3  # Base: 3 replicas. Override in environment overlays (1 primary + 2 standby)
  
  # PostgreSQL version and configuration
  postgresql:
    version: ""
    
    # SSL/TLS Certificate Configuration
    # CloudNativePG automatically generates and manages SSL certificates
    # Certificates are stored in Kubernetes secrets and rotated automatically
    parameters:
      # SSL/TLS Protocol Configuration
      ssl: "on"                              # Enable SSL/TLS connections
      ssl_min_protocol_version: "TLSv1.3"    # Require TLS 1.3 minimum
      ssl_max_protocol_version: "TLSv1.3"    # Use TLS 1.3
      
      # Performance tuning
      shared_buffers: "2Gi"            # 25% of memory for production
      max_connections: "300"           # Connection limit
      
      # High availability configuration
      synchronous_commit: "remote_apply"       # Quorum replication for zero data loss
      synchronous_standby_names: "ANY 1 (*)"  # At least 1 replica must confirm writes
      
      # WAL archiving for backups and PITR
      archive_timeout: "5min"          # Archive WAL every 5 minutes
      wal_compression: "on"            # Compress WAL files
      
    # Pre-load extensions
    shared_preload_libraries:
      - "pg_stat_statements"  # Query performance tracking
  
  # Resource allocation (production defaults)
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  
  # Storage configuration
  storage:
    size: "200Gi"
    storageClassName: ""
  
  # Barman Cloud Plugin configuration for WAL archiving
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: test-app-postgres-backup-store  # References ObjectStore CRD
  
  # Bootstrap configuration (for new clusters)
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
        - "ALTER SYSTEM SET log_statement = 'all';"
        - "ALTER SYSTEM SET log_min_duration_statement = '1000';"  # Log queries >1s
  
  # Monitoring configuration
  monitoring:
    enabled: true
    podMonitorEnabled: true  # Enable PodMonitor for Prometheus

---
# Documentation: SSL/TLS Certificate Management
# CloudNativePG automatically generates and manages the following certificates:
# 
# 1. CA Certificate Secret (test-app-postgres-ca):
#    - Contains: ca.crt, ca.key
#    - Used to sign server and client certificates
#    - Valid for 1 year, automatically renewed
#
# 2. Server Certificate Secret (test-app-postgres-server):
#    - Contains: tls.crt, tls.key
#    - Used by PostgreSQL server for TLS connections
#    - Signed by CA
#    - Subject: CN=test-app-postgres
#    - Alt Names: test-app-postgres, test-app-postgres.default, test-app-postgres-rw, etc.
#
# 3. Replication Certificate Secret (test-app-postgres-replication):
#    - Contains: tls.crt, tls.key
#    - Used for encrypted replication between primary and standbys
#    - Signed by CA
#
# 4. Application Password Secret (test-app-postgres-app):
#    - Contains: username, password for the 'app' user
#    - Auto-generated on cluster creation
#
# Connections from clients (e.g., applications) require:
# - Set sslmode=require or sslmode=verify-full in connection strings
# - Optional: Provide CA certificate for verification
#
# Example client connection strings:
# 
# sslmode=require (allows self-signed certificates):
#   postgresql://app:password@test-app-postgres-rw:5432/app?sslmode=require
#
# sslmode=verify-full (requires valid CA certificate):
#   postgresql://app:password@test-app-postgres-rw:5432/app?sslmode=verify-full&sslrootcert=/path/to/ca.crt
