apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: test-app-postgres-backup-store
  namespace: default
spec:
  # Configuration for Barman Cloud Plugin backup storage
  configuration:
    # S3-compatible endpoint and bucket
    destinationPath: s3://test-app-postgres-backups/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    
    # Credentials reference (from Kubernetes Secret)
    s3Credentials:
      accessKeyId:
        name: postgres-backup-storage
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-storage
        key: ACCESS_SECRET_KEY
    
    # Backup data compression
    data:
      compression: zstd  # Production default (faster and better compression than gzip)
      jobs: 2            # Parallel compression threads
    
    # WAL archiving configuration
    wal:
      compression: gzip  # WAL compression (balance of speed and size)
      maxParallel: 4     # Parallel WAL fetches during restore
  
  # Retention policy (backups older than this are automatically deleted)
  # Overridden per environment in overlays
  retentionPolicy: "30d"  # 30 days for production
