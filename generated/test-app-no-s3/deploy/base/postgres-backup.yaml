apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: test-app-postgres-daily-backup
  namespace: default
spec:
  # Backup schedule (cron format, UTC timezone)
  schedule: ""  # Customizable via template
  
  # Backup method - MUST use plugin for Barman Cloud Plugin
  method: plugin
  
  # Plugin configuration - explicit reference required
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: test-app-postgres-backup-store  # References ObjectStore CRD
  
  # Target cluster
  cluster:
    name: test-app-postgres
  
  # Backup target selection (prefer standby to reduce load on primary)
  target: prefer-standby
  
  # Backup retention is managed by ObjectStore CRD retentionPolicy
  # This schedule only controls when backups are triggered
