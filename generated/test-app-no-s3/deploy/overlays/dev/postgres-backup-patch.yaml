apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: test-app-postgres-daily-backup
  namespace: default
spec:
  # Development backup schedule - adjusted via template variable
  schedule: ""

---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: test-app-postgres-backup-store
  namespace: default
spec:
  configuration:
    destinationPath: s3://test-app-postgres-backups/dev/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: postgres-backup-storage
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-storage
        key: ACCESS_SECRET_KEY
  
  # Development: shorter retention (configurable via template)
  retentionPolicy: "d"
  
  # Development: faster compression (gzip)
  configuration:
    data:
      compression: gzip
    wal:
      compression: gzip
