apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
    prometheus.io/scrape: "true"
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/name: rust-service
  name: rust-service
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/target: "100"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      containerConcurrency: 100
      containers:
      - env:
        - name: APP_ENV
          value: production
        - name: APP__SERVER__PORT
          value: "8080"
        - name: APP__REDIS__URL
          valueFrom:
            secretKeyRef:
              key: redis-url
              name: rust-service-secrets
        - name: APP__TELEMETRY__OTLP_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4317
        - name: APP__TELEMETRY__SERVICE_NAME
          value: rust-service
        image: localhost:5001/test-org/test-app:latest
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 2
        name: service
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      timeoutSeconds: 300
      volumes:
      - emptyDir: {}
        name: tmp
