[template]
cargo_generate_version = ">=0.23.0"
subfolder = "."
ignore = [
  ".git",
  "tests/e2e",
  ".opencode",
  ".specify",
  "target",
  "Cargo.lock",
  "specs",
  "audio-stream-exporter",
  "crates/axum-cloudevents/target",
  "crates/axum-cloudevents-macros/target",
  ".github/workflows/template-e2e-test.yaml",
  ".github/workflows/template-generate-and-validate.yaml",
  ".github/workflows/naming-convention-tests.yaml",
  ".github/workflows/LOCAL_TESTING_QUICK_REF.md",
  ".github/workflows/ci.yaml.liquid",
  "docs/MONITORING.md.liquid",
  "docs/TESTING.md.liquid",
  "docs/LOCAL_E2E_TESTING.md",
  "docs/E2E_TROUBLESHOOTING.md",
  "docs/VERSION_COMPATIBILITY.md",
  "scripts/test-template-e2e-local.sh",
  "scripts/cleanup-e2e-local.sh",
  "scripts/README.md",
  "CHANGELOG-LOCAL-E2E.md",
]

[hooks]
post = ["post-generate.rhai"]

[placeholders]
project_name = { prompt = "Project name", type = "string", default = "example-app" }
project_author = { prompt = "Project authors", type = "string", default = "Your Name <you@example.com>" }
features = { prompt = "Select default features", type = "array", choices = [
  "s3",
  "postgres",
  "kafka",
], default = [
] }
event_sources = { prompt = "Select event sources", type = "array", choices = [
  "kafka",
], default = [
] }
enable_image_updates = { prompt = "Enable automated image updates?", type = "bool", default = false }
target_namespace = { prompt = "Target namespace", type = "string", default = "default" }
github_org = { prompt = "GitHub organization or username", type = "string", default = "your-org" }
github_repo = { prompt = "GitHub repository name", type = "string", default = "your-repo" }
default_branch = { prompt = "Default git branch for Flux", type = "string", default = "main" }
image_registry = { prompt = "Container image registry", type = "string", default = "ghcr.io" }

# Scaling configuration
use_default_scaling = { prompt = "Use default scaling parameters?", type = "bool", default = true }

[conditional.'!use_default_scaling'.placeholders]
# Scaling parameters (only prompted when use_default_scaling = false)
base_min_scale = { prompt = "Base minimum scale", type = "string" }
base_max_scale = { prompt = "Base maximum scale", type = "string" }
base_target = { prompt = "Base autoscaling target (concurrency)", type = "string" }
base_cpu_request = { prompt = "Base CPU request", type = "string" }
base_cpu_limit = { prompt = "Base CPU limit", type = "string" }
base_memory_request = { prompt = "Base memory request", type = "string" }
base_memory_limit = { prompt = "Base memory limit", type = "string" }
dev_min_scale = { prompt = "Dev minimum scale", type = "string" }
dev_max_scale = { prompt = "Dev maximum scale", type = "string" }
dev_cpu_request = { prompt = "Dev CPU request", type = "string" }
dev_cpu_limit = { prompt = "Dev CPU limit", type = "string" }
dev_memory_request = { prompt = "Dev memory request", type = "string" }
dev_memory_limit = { prompt = "Dev memory limit", type = "string" }
staging_min_scale = { prompt = "Staging minimum scale", type = "string" }
staging_max_scale = { prompt = "Staging maximum scale", type = "string" }
staging_cpu_request = { prompt = "Staging CPU request", type = "string" }
staging_cpu_limit = { prompt = "Staging CPU limit", type = "string" }
staging_memory_request = { prompt = "Staging memory request", type = "string" }
staging_memory_limit = { prompt = "Staging memory limit", type = "string" }
prod_min_scale = { prompt = "Prod minimum scale", type = "string" }
prod_max_scale = { prompt = "Prod maximum scale", type = "string" }
prod_cpu_request = { prompt = "Prod CPU request", type = "string" }
prod_cpu_limit = { prompt = "Prod CPU limit", type = "string" }
prod_memory_request = { prompt = "Prod memory request", type = "string" }
prod_memory_limit = { prompt = "Prod memory limit", type = "string" }

[conditional.'!if features contains "s3"']
ignore = [
  "src/handlers/storage.rs.liquid",
  "tests/storage_test.rs.liquid",
  "STORAGE.md.liquid",
  "terraform/modules/minio",
]

[conditional.'if event_sources contains "kafka"'.placeholders]
kafka_topic = { prompt = "Kafka topic name", type = "string", default = "events" }
kafka_consumer_group = { prompt = "Kafka consumer group", type = "string", default = "{{project_name}}-consumers" }
kafka_bootstrap_servers_staging = { prompt = "Kafka bootstrap servers (staging)", type = "string", default = "kafka.staging.svc.cluster.local:9092" }
kafka_bootstrap_servers_prod = { prompt = "Kafka bootstrap servers (prod)", type = "string", default = "kafka.prod.svc.cluster.local:9092" }

[conditional.'!if event_sources contains "kafka"']
ignore = [
  "deploy/base/kafka-source.yaml.liquid",
  "deploy/base/dlq-handler.yaml.liquid",
  "deploy/dev/infrastructure/kafka.yaml.liquid",
  "scripts/dev/install-knative-kafka.sh",
  "scripts/dev/send-kafka-event.sh",
  "scripts/dev/create-kafka-topic.sh",
  "docs/KAFKA_EVENTING.md.liquid",
  "tests/e2e/fixtures/kafka",
]

[conditional.'if features contains "postgres"'.placeholders]
postgres_version = { prompt = "PostgreSQL version", type = "string", default = "16" }
postgres_instances_dev = { prompt = "Dev PostgreSQL replicas", type = "string", default = "1" }
postgres_instances_staging = { prompt = "Staging PostgreSQL replicas", type = "string", default = "2" }
postgres_instances_prod = { prompt = "Prod PostgreSQL replicas", type = "string", default = "3" }
postgres_storage_class = { prompt = "StorageClass for PostgreSQL PVCs", type = "string", default = "standard" }
backup_schedule = { prompt = "Backup schedule (cron expression)", type = "string", default = "0 2 * * *" }
backup_retention_dev = { prompt = "Dev backup retention (days)", type = "string", default = "7" }
backup_retention_staging = { prompt = "Staging backup retention (days)", type = "string", default = "14" }
backup_retention_prod = { prompt = "Prod backup retention (days)", type = "string", default = "30" }

[conditional.'!if features contains "postgres"']
ignore = [
  "deploy/base/postgres-cluster.yaml.liquid",
  "deploy/base/postgres-backup.yaml.liquid",
  "deploy/base/postgres-pooler.yaml.liquid",
  "deploy/base/postgres-objectstore.yaml.liquid",
  "deploy/base/postgres-podmonitor.yaml.liquid",
  "deploy/base/postgres-alerts.yaml.liquid",
  "deploy/flux/postgres-kustomization.yaml.liquid",
  "deploy/overlays/dev/postgres-cluster-patch.yaml.liquid",
  "deploy/overlays/dev/postgres-backup-patch.yaml.liquid",
  "deploy/overlays/staging/postgres-cluster-patch.yaml.liquid",
  "deploy/overlays/staging/postgres-backup-patch.yaml.liquid",
  "deploy/overlays/prod/postgres-cluster-patch.yaml.liquid",
  "deploy/overlays/prod/postgres-backup-patch.yaml.liquid",
  "scripts/dev/deploy-postgres.sh.liquid",
  "scripts/dev/check-postgres-status.sh.liquid",
  "scripts/dev/port-forward-postgres.sh.liquid",
  "scripts/dev/create-backup.sh.liquid",
  "scripts/dev/check-backup-status.sh.liquid",
  "scripts/dev/list-backups.sh.liquid",
  "scripts/dev/restore-from-backup.sh.liquid",
  "scripts/validate-postgres-manifests.sh.liquid",
  "docs/POSTGRES.md.liquid",
  "docs/POSTGRES_BACKUP_RESTORE.md.liquid",
  "docs/POSTGRES_MONITORING.md.liquid",
  "specs/001-cloudnative-postgres-backups",
]

[conditional.'if features contains "kafka"'.placeholders]
kafka_broker_url = { prompt = "Kafka broker URL (e.g., kafka.kafka.svc.cluster.local:9092)", type = "string", default = "kafka.kafka.svc.cluster.local:9092" }
kafka_topic = { prompt = "Kafka topic name for event publishing", type = "string", default = "events" }
kafka_event_name = { prompt = "CloudEvents event name (e.g., com.example.service.event.published)", type = "string", default = "com.{{project_name}}.event.published" }

[conditional.'!if features contains "kafka"']
ignore = [
  "src/handlers/kafka.rs.liquid",
  "tests/integration/kafka_publishing_test.rs.liquid",
]
