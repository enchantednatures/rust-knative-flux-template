global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the application metrics endpoint
  - job_name: 'rust-service'
    static_configs:
      - targets: ['app:8080']
    metrics_path: '/metrics'

  # Scrape OTel collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
