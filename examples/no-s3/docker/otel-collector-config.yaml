# =============================================================================
# Local OTel Collector Config - Simulates Knative Tracing Infrastructure
# =============================================================================
# This configuration accepts traces from TWO sources:
#   1. Zipkin receiver (port 9411) - Simulates Knative infrastructure traces
#      (activator, queue-proxy use Zipkin B3 headers)
#   2. OTLP receiver (port 4317) - Your Rust application traces
#
# Both are exported to Jaeger for visualization, allowing you to verify
# that B3 propagation correctly links your app traces to infrastructure.
# =============================================================================

receivers:
  # Simulates Knative's Zipkin-based infrastructure tracing
  zipkin:
    endpoint: 0.0.0.0:9411

  # Your application sends traces here via OTLP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Export traces to Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Debug logging (useful for troubleshooting)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [zipkin, otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
