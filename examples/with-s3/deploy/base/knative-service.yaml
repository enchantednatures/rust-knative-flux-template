apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rust-service
  labels:
    app.kubernetes.io/name: rust-service
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: flux
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  template:
    metadata:
      annotations:
        # Autoscaling configuration
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
        autoscaling.knative.dev/target: "100"
        # Prometheus (pod-level scraping)
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - name: service
          # Image will be updated by Flux ImageUpdateAutomation
          image: ghcr.io/your-org/rust-service:latest # {"$imagepolicy": "flux-system:rust-service"}
          ports:
            - containerPort: 8080
              protocol: TCP
           env:
             - name: APP_ENV
               value: "production"
             - name: APP__SERVER__PORT
               value: "8080"
             - name: APP__REDIS__URL
               valueFrom:
                 secretKeyRef:
                   name: rust-service-secrets
                   key: redis-url
             
             - name: AWS_ACCESS_KEY_ID
               valueFrom:
                 secretKeyRef:
                   name: rust-service-secrets
                   key: aws-access-key-id
             - name: AWS_SECRET_ACCESS_KEY
               valueFrom:
                 secretKeyRef:
                   name: rust-service-secrets
                   key: aws-secret-access-key
             - name: APP__S3__ENDPOINT
               value: "http://minio:9000"  # Update for your environment
             - name: APP__S3__BUCKET
               value: "data"
             - name: APP__S3__REGION
               value: "us-east-1"
             
             - name: APP__TELEMETRY__OTLP_ENDPOINT
               value: "http://otel-collector.observability.svc.cluster.local:4317"
             - name: APP__TELEMETRY__SERVICE_NAME
               valueFrom:
                 fieldRef:
                   fieldPath: metadata.name
             - name: OTEL_RESOURCE_ATTRIBUTES
               value: "service.namespace=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME)"
             - name: POD_NAMESPACE
               valueFrom:
                 fieldRef:
                   fieldPath: metadata.namespace
             - name: POD_NAME
               valueFrom:
                 fieldRef:
                   fieldPath: metadata.name
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Liveness: Is the process alive?
          # Kubernetes restarts the pod if this fails
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness: Can it handle traffic? (checks Redis)
          # Kubernetes removes from Service endpoints if this fails
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
