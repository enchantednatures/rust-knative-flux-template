# Default configuration
# Override via environment-specific files or environment variables

[server]
host = "0.0.0.0"
port = 8080

[redis]
url = "redis://localhost:6379"

[telemetry]
service_name = "{{ project_name | kebab_case }}"
log_level = "info"
# otlp_endpoint = "http://otel-collector:4317"  # Optional

{% if feature_s3 %}
[s3]
endpoint = "http://localhost:9000"  # MinIO endpoint
bucket = "data"
region = "us-east-1"
{% endif %}

{% if feature_kafka %}
[kafka]
broker_url = "{{ kafka_broker_url }}"
topic = "{{ kafka_topic }}"
event_name = "{{ kafka_event_name }}"
compression = "snappy"
linger_ms = 5
retries = 3
timeout_ms = 10000
{% endif %}

{% if feature_postgres %}
[postgres]
url = ""                    # overridden by APP__POSTGRES__URL injected from CNPG secret
host = ""                   # blank locally; APP__POSTGRES__HOST points to the pooler in k8s
ssl_mode = "verify-full"
ssl_root_cert_path = "/etc/secrets/pg-ca/ca.crt"
run_migrations = true
max_connections = 5
{% endif %}
