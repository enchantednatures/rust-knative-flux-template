# Default configuration
# Override via environment-specific files or environment variables

[server]
host = "0.0.0.0"
port = 8080

[redis]
url = "redis://localhost:6379"

[telemetry]
service_name = "{{ project_name | kebab_case }}"
log_level = "info"
# otlp_endpoint = "http://otel-collector:4317"  # Optional

{% if features contains "s3" %}
[s3]
endpoint = "http://localhost:9000"  # MinIO endpoint
bucket = "data"
region = "us-east-1"
{% endif %}

{% if features contains "kafka" %}
[kafka]
broker_url = "{{ kafka_broker_url }}"
topic = "{{ kafka_topic }}"
event_name = "{{ kafka_event_name }}"
compression = "snappy"
linger_ms = 5
retries = 3
timeout_ms = 10000
{% endif %}
