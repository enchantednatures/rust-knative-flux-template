# Development environment configuration

[telemetry]
service_name = "{{ project_name | kebab_case }}-dev"
log_level = "debug"
otlp_endpoint = "http://localhost:4317"

{% if feature_s3 %}
[s3]
endpoint = "http://localhost:9000"
bucket = "data"
region = "us-east-1"
{% endif %}

{% if feature_kafka %}
[kafka]
broker_url = "{{ kafka_broker_url }}"
topic = "{{ kafka_topic }}"
timeout_ms = 5000  # Shorter timeout for dev
{% endif %}
