# Development environment configuration

[telemetry]
service_name = "{{ project_name | kebab_case }}-dev"
log_level = "debug"
otlp_endpoint = "http://localhost:4317"

{% if feature_s3 %}
[s3]
endpoint = "http://localhost:9000"
bucket = "data"
region = "us-east-1"
{% endif %}

{% if feature_kafka %}
[kafka]
broker_url = "{{ kafka_broker_url }}"
topic = "{{ kafka_topic }}"
timeout_ms = 5000  # Shorter timeout for dev
{% endif %}

{% if feature_postgres %}
[postgres]
url = ""                    # overridden by APP__POSTGRES__URL injected from CNPG secret
host = ""                   # blank locally; APP__POSTGRES__HOST points to the pooler in k8s
ssl_mode = "verify-full"    # server CA mounted in dev
ssl_root_cert_path = "/etc/secrets/pg-ca/ca.crt"
run_migrations = true
max_connections = 5
{% endif %}
