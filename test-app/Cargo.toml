[package]
name = "postgres-test-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "postgres-test-app"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "tls-rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
